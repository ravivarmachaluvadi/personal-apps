<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Sound Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ink:#2A2418;--cream:#FFF8E6;--khaki:#E3CF8C;--khaki2:#CDB56A;--jungle:#2E7D4F;--jungle2:#1F5A3A;--leaf:#5BB36E;--sunset:#FF7A3D;--sunset2:#E85D1F;--sky:#9BD7F0;--dad:#3E8BFF;--son:#FF7A3D;
--display:'Bangers','Impact','Arial Black',sans-serif;--ui:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--khaki);background-image:radial-gradient(circle at 12% 8%,rgba(255,255,255,.35) 0 6px,transparent 7px),radial-gradient(circle at 78% 30%,rgba(255,255,255,.25) 0 5px,transparent 6px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.25) 0 4px,transparent 5px),linear-gradient(180deg,#EAD79A,#D9C27A);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0}
button:focus-visible{outline:4px solid var(--sunset);outline-offset:3px}
#app{max-width:1080px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding-top:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,11vw,104px);line-height:.9;margin:0;color:var(--jungle);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);letter-spacing:.03em;transform:rotate(-2deg);text-wrap:balance}
h1 span{color:var(--sunset)}
.tag{margin:8px 0 0;font-weight:900;font-size:clamp(14px,2.2vw,18px);letter-spacing:.12em;text-transform:uppercase;color:var(--jungle2)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);margin:0;color:var(--cream);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);letter-spacing:.04em}
.panel{background:var(--jungle);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px;position:relative}
.panel::before{content:"";position:absolute;inset:6px;border-radius:20px;border:3px dashed rgba(255,248,230,.25);pointer-events:none}
.bubble{position:relative;margin:0 auto 14px;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:8px 22px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 5px 0 var(--ink);max-width:560px;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-18px;width:0;height:0;border:12px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
.bubble .name{font-family:var(--display);font-size:clamp(30px,6vw,52px);letter-spacing:.06em;color:var(--sunset2);-webkit-text-stroke:1.5px var(--ink);line-height:1}
.bubble .hint{font-weight:900;font-size:clamp(15px,2.4vw,19px);color:var(--jungle2)}
.bubble.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:clamp(8px,1.6vw,14px)}
.listen{--cols:6}
@media (max-width:640px){.listen{--cols:4}}
@media (max-width:380px){.listen{--cols:3}}
.card{position:relative;aspect-ratio:1;perspective:900px;border-radius:18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.card.up .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.face.back{background:var(--khaki);background-image:radial-gradient(circle,rgba(46,125,79,.18) 0 22%,transparent 23%);background-size:26px 26px}
.face.back svg{width:56%;height:56%}
.face.front{background:var(--cream);transform:rotateY(180deg)}
.face.front svg{width:86%;height:86%}
.face.front .pic,.face.front .mystery{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.face.front .mystery{display:none}
.board.sound .card:not(.matched) .face.front .pic{display:none}
.board.sound .card:not(.matched) .face.front .mystery{display:flex}
.card.matched .face.front{background:#FFF1C2}
.card.matched{animation:bounce .5s cubic-bezier(.2,1.6,.4,1)}
.card.wobble{animation:wobble .5s}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.card:active .inner{transform:scale(.96)}
.card.up:active .inner{transform:rotateY(180deg) scale(.96)}
.listen .card .inner{transform:rotateY(180deg)}
.listen .card.play{animation:bounce .5s cubic-bezier(.2,1.6,.4,1)}
.setup{display:flex;flex-direction:column;gap:14px;align-items:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px 12px 16px;border-radius:22px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--cream);transition:transform .08s,background .15s}
.mode .big{font-family:var(--display);font-size:clamp(26px,4vw,36px);letter-spacing:.05em;line-height:1}
.mode small{font-weight:800;font-size:14px;line-height:1.3;opacity:.85}
.mode.on{background:var(--sunset);color:var(--cream)}
.mode.on small{opacity:.95}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sizes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{font-weight:900;font-size:17px;padding:10px 18px;border-radius:999px;border:4px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink)}
.chip.on{background:var(--jungle2);color:var(--cream)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn{font-family:var(--display);font-size:clamp(24px,4vw,34px);letter-spacing:.06em;padding:12px 32px;border-radius:20px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);background:var(--sunset);color:var(--cream);-webkit-text-stroke:1px var(--ink)}
.btn.alt{background:var(--cream);color:var(--ink);-webkit-text-stroke:0}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:14px}
.pill{background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:6px 18px;font-weight:900;font-size:clamp(16px,2.6vw,22px);box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;white-space:nowrap}
.pill small{font-size:.65em;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.player{border-color:var(--ink);color:var(--cream);opacity:.55;transition:opacity .2s,transform .2s}
.player.dad{background:var(--dad)}.player.son{background:var(--son)}
.player.turn{opacity:1;transform:scale(1.08);box-shadow:0 4px 0 var(--ink),0 0 0 5px rgba(255,248,230,.6)}
.board{margin:0 auto;width:min(100%,calc((100vh - 260px) * var(--cols) / var(--rows)));max-width:900px}
.overlay{position:fixed;inset:0;background:rgba(42,36,24,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.winbox{background:var(--jungle);border:4px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:26px 28px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;max-width:520px;width:100%}
.stat{display:grid;grid-template-columns:auto auto;gap:6px 24px;font-weight:900;font-size:clamp(18px,3vw,24px);background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:12px 22px;text-align:left;font-variant-numeric:tabular-nums}
.stat span:nth-child(odd){opacity:.65;letter-spacing:.1em;text-transform:uppercase;font-size:.7em;align-self:center}
.stat span:nth-child(even){color:var(--sunset2);text-align:right}
.best{font-weight:900;color:var(--cream);letter-spacing:.06em;text-shadow:0 2px 0 var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.mute{position:fixed;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:22px;z-index:15;display:flex;align-items:center;justify-content:center}
.foot{text-align:center;font-weight:800;font-size:13px;color:var(--jungle2);opacity:.8}
@media (prefers-reduced-motion:reduce){.card .inner{transition:none}.card.matched,.card.wobble,.bubble.pop,.listen .card.play{animation:none}}
</style>

<button class="mute" id="btnMute" aria-label="Sound on or off">🔊</button>
<div id="app">
  <header class="top">
    <h1>Sound <span>Safari</span></h1>
    <p class="tag">Tap a card · Hear the sound · Find the pair</p>
  </header>

  <section id="home">
    <div class="panel">
      <div class="bubble" id="bubble"><span class="hint">Tap any animal or vehicle to hear it!</span></div>
      <div class="grid listen" id="listen"></div>
    </div>
    <div class="setup" style="margin-top:16px">
      <div class="modes">
        <button class="mode on" data-mode="picture"><span class="big">Picture Match</span><small>Flip cards, hear each sound, find the two that look the same</small></button>
        <button class="mode" data-mode="sound"><span class="big">Sound Match</span><small>Cards stay hidden. Listen carefully and match by sound alone</small></button>
        <button class="mode" data-mode="versus"><span class="big">Dad vs Son</span><small>Take turns. A match earns another go. Most pairs wins!</small></button>
      </div>
      <div class="sizes">
        <button class="chip on" data-size="4x3">Easy · 6 pairs</button>
        <button class="chip" data-size="4x4">Medium · 8 pairs</button>
        <button class="chip" data-size="6x4">Big · 12 pairs</button>
      </div>
      <button class="btn" id="btnStart">Start Game</button>
      <div class="foot" id="bestLine"></div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="hud" id="hud">
      <div class="pill"><small>Moves</small><span id="hMoves">0</span></div>
      <div class="pill"><small>Time</small><span id="hTime">0:00</span></div>
      <div class="pill"><small>Pairs</small><span id="hPairs">0 / 6</span></div>
      <div class="pill player dad" id="pDad" hidden>Dad <span id="sDad">0</span></div>
      <div class="pill player son" id="pSon" hidden>Son <span id="sSon">0</span></div>
    </div>
    <div class="panel"><div class="grid board" id="board"></div></div>
    <div class="row" style="margin-top:16px"><button class="btn alt" id="btnHome">Home</button><button class="btn" id="btnShuffle">Shuffle</button></div>
  </section>

  <div id="win" class="overlay" hidden>
    <div class="winbox">
      <h2 id="winTitle">You did it!</h2>
      <div class="stat" id="winStats"></div>
      <div class="best" id="winBest"></div>
      <div class="row"><button class="btn" id="btnAgain">Play Again</button><button class="btn alt" id="btnMenu">Home</button></div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<script>

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const vibrate=p=>{try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}};
const fmt=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};

const el={home:$('home'),game:$('game'),listen:$('listen'),bubble:$('bubble'),board:$('board'),moves:$('hMoves'),time:$('hTime'),pairs:$('hPairs'),pDad:$('pDad'),pSon:$('pSon'),sDad:$('sDad'),sSon:$('sSon'),win:$('win'),winTitle:$('winTitle'),winStats:$('winStats'),winBest:$('winBest'),bestLine:$('bestLine'),mute:$('btnMute'),fx:$('fx')};

/* setup controls */
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{wake();SOUNDS.click();document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));mode=b.dataset.mode;showBest();}));
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{wake();SOUNDS.click();document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));size=b.dataset.size;showBest();}));
function bestFor(){const b=store.get('ss_best',{})[mode+'_'+size];return b||null;}
function showBest(){if(mode==='versus'){el.bestLine.textContent='Two players on one screen. Dad is blue, Son is orange.';return;}const b=bestFor();el.bestLine.textContent=b?'Best so far: '+b.moves+' moves in '+fmt(b.time):'No best yet for this mode. Go set one!';}
showBest();

function goHome(){clearInterval(timer);state=null;el.win.hidden=true;el.game.hidden=true;el.home.hidden=false;showBest();window.scrollTo({top:0,behavior:'smooth'});}
function startGame(){let [cols,rows]=size.split('x').map(Number);if(window.innerWidth<window.innerHeight&&cols>rows)[cols,rows]=[rows,cols];
  const pairs=cols*rows/2,subs=shuffle(SUBJECTS.slice()).slice(0,pairs);deck=shuffle(subs.concat(subs));
  el.board.style.setProperty('--cols',cols);el.board.style.setProperty('--rows',rows);el.board.classList.toggle('sound',mode==='sound');
  el.board.innerHTML=deck.map((s,i)=>'<button class="card" data-i="'+i+'" data-id="'+s.id+'" aria-label="Card '+(i+1)+'">'+cardHTML(s)+'</button>').join('');
  state={first:null,lock:false,moves:0,matched:0,pairs,start:0,running:false,turn:'dad',score:{dad:0,son:0}};
  el.pDad.hidden=el.pSon.hidden=mode!=='versus';el.win.hidden=true;el.home.hidden=true;el.game.hidden=false;
  clearInterval(timer);timer=setInterval(()=>{if(state&&state.running)el.time.textContent=fmt((performance.now()-state.start)/1000);},250);
  el.time.textContent='0:00';updateHud();window.scrollTo({top:0,behavior:'smooth'});}
function updateHud(){if(!state)return;el.moves.textContent=state.moves;el.pairs.textContent=state.matched+' / '+state.pairs;el.sDad.textContent=state.score.dad;el.sSon.textContent=state.score.son;el.pDad.classList.toggle('turn',state.turn==='dad');el.pSon.classList.toggle('turn',state.turn==='son');}
el.board.addEventListener('click',e=>{const b=e.target.closest('.card');if(b)flip(b);});
function flip(b){if(!state||state.lock||b.classList.contains('up')||b.classList.contains('matched'))return;wake();
  if(!state.running){state.running=true;state.start=performance.now();}
  b.classList.add('up');SOUNDS[b.dataset.id]();vibrate(10);
  if(!state.first){state.first=b;return;}
  const a=state.first;state.moves++;state.lock=true;updateHud();
  if(a.dataset.id===b.dataset.id){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');a.classList.remove('up');b.classList.remove('up');SOUNDS.match();vibrate([20,30,40]);state.matched++;if(mode==='versus')state.score[state.turn]++;state.first=null;state.lock=false;updateHud();if(state.matched===state.pairs)finish();},420);}
  else{setTimeout(()=>{a.classList.add('wobble');b.classList.add('wobble');SOUNDS.miss();vibrate(30);setTimeout(()=>{a.classList.remove('up','wobble');b.classList.remove('up','wobble');if(mode==='versus')state.turn=state.turn==='dad'?'son':'dad';state.first=null;state.lock=false;updateHud();},560);},750);}}
function finish(){state.running=false;const t=(performance.now()-state.start)/1000;el.time.textContent=fmt(t);let title='You did it!',bestLine='';
  if(mode==='versus'){const d=state.score.dad,s=state.score.son;title=d>s?'Dad wins!':s>d?'Son wins!':"It's a tie!";if(s>=d)SOUNDS.cheer();}
  else{const all=store.get('ss_best',{}),k=mode+'_'+size,b=all[k];if(!b||state.moves<b.moves||(state.moves===b.moves&&t<b.time)){all[k]={moves:state.moves,time:t};store.set('ss_best',all);title='New best!';bestLine=b?'Old best: '+b.moves+' moves in '+fmt(b.time):'First time on this board. Beat it next round!';}else bestLine='Best: '+b.moves+' moves in '+fmt(b.time);}
  const rows=[['Moves',state.moves],['Time',fmt(t)]];if(mode==='versus')rows.push(['Dad pairs',state.score.dad],['Son pairs',state.score.son]);
  el.winTitle.textContent=title;el.winStats.innerHTML=rows.map(([k,v])=>'<span>'+k+'</span><span>'+v+'</span>').join('');el.winBest.textContent=bestLine;
  SOUNDS.win();vibrate([40,60,40,60,120]);confetti();setTimeout(()=>{el.win.hidden=false;},650);}

function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const dpr=Math.min(2,window.devicePixelRatio||1);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;fctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFD23F','#FF7A3D','#5BB36E','#3E8BFF','#E63946','#FFF8E6'];for(let i=0;i<160;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.4,vx:(Math.random()-0.5)*120,vy:80+Math.random()*160,r:4+Math.random()*6,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-0.5)*8,life:3+Math.random()});
  if(!fxRunning){fxRunning=true;let last=performance.now();const step=now=>{const dt=Math.min(0.05,(now-last)/1000);last=now;fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.life-=dt;p.vy+=60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.globalAlpha=Math.min(1,p.life);fctx.fillStyle=p.c;fctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);fctx.restore();});if(parts.length)requestAnimationFrame(step);else{fxRunning=false;fctx.clearRect(0,0,innerWidth,innerHeight);}};requestAnimationFrame(step);}}
})();
</script>
