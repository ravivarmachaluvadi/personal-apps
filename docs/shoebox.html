<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoebox</title>
<script src="config.js"></script>
<script>/* the light/dark choice for this page on this device, applied before first paint */try{var pageTheme=JSON.parse(localStorage.getItem('shoebox.theme'));if(pageTheme==='light'||pageTheme==='dark')document.documentElement.setAttribute('data-theme',pageTheme);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3EEE7; --surface:#FFFFFF; --surface-2:#F8F4EE; --line:#E2D8CB;
  --text:#221C16; --muted:#5B5248; --faint:#6A6157;
  --accent:#A63F17; --accent-ink:#FFFFFF; --accent-soft:#F8E6DC;
  --good:#2E7D4F; --warn:#8A5A0F; --warn-soft:#FBEBCB;
  --danger:#B42318; --danger-soft:#FBE0DC;
  --k-folder:#B4730E; --k-image:#6D44B8; --k-pdf:#C2341E; --k-gdoc:#1F6FC5; --k-file:#6A6157;
  --shadow:0 10px 26px rgba(34,28,22,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16120E; --surface:#201B16; --surface-2:#29231D; --line:#43392F;
  --text:#F1EAE1; --muted:#B8AC9C; --faint:#A0958A;
  --accent:#F2945F; --accent-ink:#2A1206; --accent-soft:#3D2619;
  --good:#6BCF8B; --warn:#E2A33B; --warn-soft:#3A2E14;
  --danger:#F27A6B; --danger-soft:#3C1F1B;
  --k-folder:#E8B04B; --k-image:#B79BF0; --k-pdf:#F2826E; --k-gdoc:#7FB5F0; --k-file:#A0958A;
  --shadow:0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16120E; --surface:#201B16; --surface-2:#29231D; --line:#43392F;
  --text:#F1EAE1; --muted:#B8AC9C; --faint:#A0958A;
  --accent:#F2945F; --accent-ink:#2A1206; --accent-soft:#3D2619;
  --good:#6BCF8B; --warn:#E2A33B; --warn-soft:#3A2E14;
  --danger:#F27A6B; --danger-soft:#3C1F1B;
  --k-folder:#E8B04B; --k-image:#B79BF0; --k-pdf:#F2826E; --k-gdoc:#7FB5F0; --k-file:#A0958A;
  --shadow:0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* no scroll anchoring: these pages redraw whole sections when you click inside them, and Chrome anchored the
   scroll to the control just clicked; once that control was replaced the page jumped. Set on body *, not on
   html or body, where it allows a different jump */
body *{overflow-anchor:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:1240px;margin:0 auto;padding:22px 16px 110px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(28px,5vw,38px);letter-spacing:-.02em;margin:0;line-height:1.1}
.datel{color:var(--muted);font:13px "Red Hat Mono",ui-monospace,monospace}
.headright{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
#acct{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted)}
#acct .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.btn{font:600 13.5px "Plus Jakarta Sans",system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,#nav button:focus-visible,.it .open:focus-visible,.mrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px;min-height:30px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.danger.pri{background:var(--danger);border-color:var(--danger);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:hover{border-color:var(--line)}
.btn svg{width:17px;height:17px;flex:none}
.btn.icon{padding:7px 9px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
svg.i{display:block}
input[type=text],input[type=search],select{font:14.5px "Plus Jakarta Sans",system-ui,sans-serif;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px;width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;font:600 13px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted);padding:7px 11px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:9px 10px 9px 18px;border-radius:999px;font:600 13.5px "Plus Jakarta Sans",system-ui,sans-serif;opacity:0;pointer-events:none;transition:.18s;z-index:70;max-width:min(560px,92vw);display:flex;align-items:center;gap:12px}
.toast:not(.act){padding-right:18px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.on.act{pointer-events:auto}
.toast .undo{border:0;border-radius:999px;background:var(--bg);color:var(--text);font:700 13px "Plus Jakarta Sans",system-ui,sans-serif;padding:6px 13px;cursor:pointer;flex:none}
body.selecting .toast{bottom:92px}

/* layout: places on the left on a laptop, a row of pills above the files on a phone */
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
.rail{position:sticky;top:12px;display:grid;gap:16px}
#nav{display:grid;gap:2px}
#nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:8px 10px;font:600 14.5px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted);cursor:pointer;text-align:left;min-height:40px;white-space:nowrap}
#nav button svg{width:18px;height:18px;flex:none}
#nav button:hover{background:var(--surface-2);color:var(--text)}
#nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.storage{font-size:12.5px;color:var(--muted);display:grid;gap:6px;padding:0 10px}
.storage .sbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.storage .sbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
body[data-auth="out"] .rail,body[data-auth="out"] .searchrow,body[data-auth="out"] .bar,
body[data-auth="none"] .rail,body[data-auth="none"] .searchrow,body[data-auth="none"] .bar{display:none}
body[data-auth="out"] .layout,body[data-auth="none"] .layout{grid-template-columns:minmax(0,1fr)}
.searchrow{position:relative}
.searchrow svg{position:absolute;left:12px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--faint);pointer-events:none}
.searchrow input{padding-left:38px;border-radius:12px;min-height:44px;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin:14px 0 14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;min-width:0;font:600 17px "Plus Jakarta Sans",system-ui,sans-serif}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:8px;cursor:pointer;color:var(--muted);font:inherit;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{background:var(--surface-2);color:var(--text)}
.crumbs button:last-child{color:var(--text)}
.crumbs .cs{color:var(--faint);font-weight:400}
.crumbs .ttl{padding:3px 6px;color:var(--text)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select{width:auto;min-height:38px;padding:6px 10px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;color:var(--muted);font-size:13.5px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);padding:34px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;font-size:14.5px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.loading{color:var(--muted);padding:34px 4px;font-size:14.5px}
.morewrap{display:flex;justify-content:center;margin:18px 0 0}

/* files: one grid; folders first, then a full-width "Files" label so files start on a fresh row */
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.sep{grid-column:1/-1;font:500 11.5px "Red Hat Mono",ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 2px -2px}
.sep:first-child{margin-top:0}
.it{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;transition:border-color .12s,box-shadow .12s}
.it:hover{border-color:var(--accent)}
.it[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.it .open{display:flex;flex-direction:column;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit;border-radius:14px;min-width:0}
.it .th{display:grid;place-items:center;aspect-ratio:4/3;background:var(--surface-2);border-radius:13px 13px 0 0;overflow:hidden;position:relative;flex:none}
.it .th svg{width:36px;height:36px}
.it .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.it .th img.ok{opacity:1}
.k-folder{color:var(--k-folder)} .k-image{color:var(--k-image)} .k-pdf{color:var(--k-pdf)} .k-gdoc{color:var(--k-gdoc)} .k-file,.k-video{color:var(--k-file)}
.it .txt{padding:8px 11px 10px;display:grid;gap:1px;min-width:0}
.it .nm{font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.it .mt{font:12px "Red Hat Mono",ui-monospace,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ck{position:absolute;top:9px;left:9px;z-index:2;width:20px;height:20px;margin:0;opacity:0;cursor:pointer}
.it .more{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;opacity:0;padding:0}
.it .more svg{width:18px;height:18px}
.it .star{position:absolute;right:10px;bottom:10px;color:var(--k-folder);pointer-events:none}
.it .star svg{width:15px;height:15px;fill:currentColor}
.it:hover .ck,.it:hover .more,.it:focus-within .ck,.it:focus-within .more,body.selecting .it .ck,.it .ck:checked{opacity:1}
@media (hover:none){.it .more{opacity:1}}
.it.fold .open{flex-direction:row;align-items:center;gap:10px;padding:11px 44px 11px 12px;min-height:58px}
.it.fold .th{aspect-ratio:auto;background:none;border-radius:0;display:block}
.it.fold .th svg{width:26px;height:26px}
.it.fold .txt{padding:0}
.it.fold .ck{top:50%;margin-top:-10px;left:12px}
body.selecting .it.fold .open{padding-left:42px}
.it.fold .star{bottom:auto;top:50%;margin-top:-8px;right:44px}
/* list view: the same items as rows */
#list.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#list.rows .sep{display:none}
#list.rows .it{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
#list.rows .it:last-child{border-bottom:0}
#list.rows .it[aria-selected="true"]{background:var(--accent-soft)}
#list.rows .it .open,#list.rows .it.fold .open{flex-direction:row;align-items:center;gap:12px;padding:7px 52px 7px 44px;min-height:56px;border-radius:0}
#list.rows .it .th{width:42px;height:42px;aspect-ratio:auto;border-radius:8px;display:grid}
#list.rows .it.fold .th{background:var(--surface-2)}
#list.rows .it .th svg{width:22px;height:22px}
#list.rows .it .txt{padding:0;display:flex;gap:14px;align-items:baseline;flex:1;min-width:0}
#list.rows .it .nm{flex:1;-webkit-line-clamp:1}
#list.rows .it .ck{top:50%;margin-top:-10px;left:13px;opacity:1}
#list.rows .it .more{top:50%;margin-top:-16px;right:10px;opacity:1;border-color:transparent;background:transparent}
#list.rows .it .star{bottom:auto;top:50%;margin-top:-8px;right:48px}

/* selection bar and upload tray, pinned to the bottom of the screen */
#selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--text);color:var(--bg);border-radius:16px;padding:8px 10px;box-shadow:0 14px 34px rgba(0,0,0,.28);max-width:calc(100vw - 24px)}
#selCount{font:600 13.5px "Plus Jakarta Sans",system-ui,sans-serif;padding:0 8px 0 6px;white-space:nowrap}
#selbar button{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;color:inherit;font:600 13px "Plus Jakarta Sans",system-ui,sans-serif;border-radius:10px;padding:7px 10px;cursor:pointer;min-height:36px}
#selbar button:hover{border-color:var(--bg)}
#selbar button[disabled]{opacity:.4;cursor:default}
#selbar button svg{width:16px;height:16px}
#tray{position:fixed;right:16px;bottom:16px;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:35;max-height:46vh;overflow:auto}
body.selecting #tray{bottom:92px}
.trh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);font-size:14px}
.up{padding:9px 14px;border-bottom:1px dashed var(--line);display:grid;gap:6px;font-size:13px}
.up:last-child{border-bottom:0}
.upn{display:flex;gap:10px;align-items:center;min-width:0}
.upn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ups{color:var(--muted);font:12px "Red Hat Mono",ui-monospace,monospace;white-space:nowrap}
.up[data-state="done"] .ups{color:var(--good)}
.up[data-state="failed"] .ups{color:var(--danger);white-space:normal}
.pbar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .15s}
#drop{position:fixed;inset:10px;z-index:80;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;pointer-events:none;font:700 20px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--accent);text-align:center;padding:20px}

/* signed out */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;box-shadow:var(--shadow);max-width:640px}
.hero h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 8px;letter-spacing:-.01em;line-height:1.2}
.hero p{color:var(--muted);margin:0 0 14px}
.hero .hint{font-size:13px;margin:14px 0 0}
.hero .why{color:var(--danger);font-weight:600;margin:12px 0 0;font-size:14px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);color:var(--text);font:600 14.5px "Plus Jakarta Sans",system-ui,sans-serif;padding:10px 16px;border-radius:12px;cursor:pointer;min-height:46px}
.gbtn:hover{border-color:var(--accent)}
.gbtn svg{width:18px;height:18px}

/* dialogs: header and action row stay pinned while a long list scrolls */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);padding:0;max-width:min(560px,94vw);width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(12,10,8,.5)}
.dlg{padding:18px 20px 20px;display:grid;gap:13px}
.dlgh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:3;background:var(--surface);margin:-18px -20px 0;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line);font:600 17px "Plus Jakarta Sans",system-ui,sans-serif}
.dlgh span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;z-index:3;background:var(--surface);margin:0 -20px -20px;padding:12px 20px;border-top:1px solid var(--line)}
.dlg .derr{color:var(--danger);font-size:13.5px}
#menuDlg{max-width:min(400px,94vw)}
.facts{color:var(--muted);font:12.5px "Red Hat Mono",ui-monospace,monospace;display:grid;gap:2px}
.acts{display:grid;gap:2px;margin:0 -8px}
.acts button,.acts a{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;font:600 14.5px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);cursor:pointer;text-align:left;text-decoration:none;min-height:42px}
.acts button:hover,.acts a:hover{background:var(--surface-2)}
.acts svg{width:18px;height:18px;color:var(--muted);flex:none}
.acts .danger,.acts .danger svg{color:var(--danger)}
#moveDlg{max-width:min(520px,94vw);height:min(600px,90vh)}
#moveDlg .dlg{min-height:100%;grid-template-rows:auto auto 1fr auto auto}
#moveCrumbs{font-size:15px}
#moveList{display:grid;gap:2px;min-height:160px;align-content:start}
.mrow{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;border-radius:10px;padding:9px 10px;font:600 14.5px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);cursor:pointer;text-align:left;min-height:44px}
.mrow:hover{background:var(--surface-2)}
.mrow svg{width:20px;height:20px;color:var(--k-folder);flex:none}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow i{font-style:normal;font-weight:500;font-size:12.5px;color:var(--faint)}
.mrow[disabled]{cursor:default;opacity:.55}
.mrow[disabled]:hover{background:none}

/* viewer: always dark, whatever the page theme, so photos read true */
#viewer{max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;margin:0;border:0;border-radius:0;padding:0;background:#0E0B09;color:#F3EEE7;overflow:hidden;color-scheme:dark}
#viewer[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}
#viewer::backdrop{background:#0E0B09}
.vtop{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;background:#1A1512;border-bottom:1px solid #3A3029;min-width:0}
#vName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#vPos{color:#B8AC9C;font:12.5px "Red Hat Mono",ui-monospace,monospace;white-space:nowrap}
.vtop .btn{background:#26201B;border-color:#3A3029;color:#F3EEE7}
.vtop .btn:hover{border-color:#F2945F}
#vBody{position:relative;display:grid;place-items:center;overflow:auto;min-height:0;touch-action:pan-y pinch-zoom}
#vBody img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#vBody iframe{width:100%;height:100%;border:0;background:#fff;align-self:stretch;justify-self:stretch}
.vmsg{color:#D8CEC2;text-align:center;padding:24px;display:grid;gap:12px;justify-items:center;max-width:460px}
.pdfpages{display:grid;gap:12px;justify-items:center;padding:14px 10px 40px;align-self:start;width:100%}
.pdfpages canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.vnav{position:absolute;top:50%;margin-top:-26px;width:48px;height:52px;border:0;border-radius:12px;background:rgba(26,21,18,.72);color:#F3EEE7;cursor:pointer;display:grid;place-items:center;z-index:3}
.vnav:hover{background:rgba(60,48,40,.9)}
.vnav svg{width:26px;height:26px}
#vPrev{left:10px} #vNext{right:10px}
.lbl{display:inline}

@media (max-width:879px){
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{position:static;gap:8px}

    $('#vName').textContent=f.name;$('#vName').title=f.name;
    $('#vPos').textContent=V.list.length>1?(V.i+1)+' / '+V.list.length:'';
    $('#vPrev').hidden=$('#vNext').hidden=V.list.length<2;
    var dr=$('#vDrive');if(f.webViewLink){dr.href=f.webViewLink;dr.hidden=false;}else dr.hidden=true;
    freeV();setKids(b,[h('div',{class:'vmsg',text:'Loading…'})]);
    D.media(effId(f)).then(function(blob){
      if(gen!==V.gen)return;
      if(k==='image'){
        var url=URL.createObjectURL(blob),img=h('img',{alt:f.name});V.url=url;
        img.onload=function(){if(gen===V.gen)setKids(b,[img]);};
        img.onerror=function(){if(gen===V.gen)cantShow(b,f,'This photo\'s format can\'t be shown in this browser.');};
        img.src=url;return;
      }
      var pb=blob.type==='application/pdf'?blob:new Blob([blob],{type:'application/pdf'});
      /* desktop browsers have their own PDF viewer; Android Chrome does not, so PDF.js draws the pages there */
      if(navigator.pdfViewerEnabled){var u2=URL.createObjectURL(pb);V.url=u2;setKids(b,[h('iframe',{src:u2,title:f.name})]);return;}
      return pdfjsInto(pb,b,gen);
    }).catch(function(e){if(gen===V.gen)cantShow(b,f,e&&e.code?errText(e,'open it'):'Couldn\'t show this PDF here.');});
  }
  var pdfjsP=null;
  function loadPdfjs(){
    if(!pdfjsP){pdfjsP=import(PDFJS+'pdf.min.mjs').then(function(m){m.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs';return m;});pdfjsP.catch(function(){pdfjsP=null;});}
    return pdfjsP;
  }
  function pdfjsInto(blob,b,gen){
    return Promise.all([loadPdfjs(),blob.arrayBuffer()]).then(function(r){
      return r[0].getDocument({data:new Uint8Array(r[1])}).promise.then(function(doc){
        if(gen!==V.gen)return;
        var wrap=h('div',{class:'pdfpages'});setKids(b,[wrap]);
        var width=Math.max(200,Math.min(b.clientWidth-20,1100)),dpr=Math.min(2,window.devicePixelRatio||1),chain=Promise.resolve();
        for(var n=1;n<=Math.min(doc.numPages,300);n++)(function(n2){chain=chain.then(function(){
          if(gen!==V.gen)return;
          return doc.getPage(n2).then(function(pg){
            var base=pg.getViewport({scale:1}),vp=pg.getViewport({scale:width/base.width*dpr}),c=document.createElement('canvas');
            c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=Math.floor(vp.width/dpr)+'px';wrap.appendChild(c);
            return pg.render({canvas:c,viewport:vp}).promise;
          });
        });})(n);
        return chain;
      });
    });
  }
  function stepV(d){if(V.list.length<2)return;V.i=(V.i+d+V.list.length)%V.list.length;showV();}
  function closeViewer(){if($('#viewer').open)$('#viewer').close();}
  $('#viewer').addEventListener('close',function(){
    V.gen++;freeV();clear($('#vBody'));
    if(V.popped){V.popped=false;return;}
    if(history.state&&history.state.shoebox==='viewer')history.back();
  });
  window.addEventListener('popstate',function(){if($('#viewer').open){V.popped=true;$('#viewer').close();}});
  (function swipe(){
    var x0=null,y0=0,b=$('#vBody');
    b.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;x0=e.clientX;y0=e.clientY;});
    b.addEventListener('pointerup',function(e){if(x0==null)return;var dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
      if(Math.abs(dx)>60&&Math.abs(dy)<80&&kindOf(V.list[V.i])==='image')stepV(dx<0?1:-1);});
    b.addEventListener('pointercancel',function(){x0=null;});
  })();

  /* ---------- theme (this page, this device) ---------- */
  var darkQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function chosenTheme(){var t=lsGet('shoebox.theme','auto');return t==='light'||t==='dark'?t:'auto';}
  function deviceTheme(){return darkQ&&darkQ.matches?'dark':'light';}
  function shownTheme(){var t=chosenTheme();return t==='auto'?deviceTheme():t;}
  function paintTheme(){
    var t=chosenTheme(),dark=shownTheme()==='dark',b=$('#themeBtn'),label=dark?'Switch to light':'Switch to dark';
    if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
    setKids(b,[icon(dark?'sun':'moon')]);b.setAttribute('aria-label',label);b.title=label;
  }

  /* ---------- wiring ---------- */
  function wire(){
    $$('#nav button').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-view');endSelect();go(v==='drive'?{view:'drive',id:'root'}:{view:v});});});
    $('#searchForm').insertBefore(icon('search'),$('#q'));
    $('#searchForm').addEventListener('submit',function(e){e.preventDefault();var t=$('#q').value.trim();$('#q').blur();endSelect();if(t)go({view:'search',text:t});else go({view:'drive',id:'root'});});
    $('#upBtn').addEventListener('click',function(){$('#upInput').click();});
    $('#upInput').addEventListener('change',function(e){var files=Array.prototype.slice.call(e.target.files||[]);e.target.value='';if(files.length)enqueue(files);});
    $('#newFolderBtn').addEventListener('click',newFolder);
    $$('#filter button').forEach(function(b){b.addEventListener('click',function(){S.filter=b.getAttribute('data-f');lsSet('shoebox.filter',S.filter);endSelect();load(S.route);});});
    $('#sortSel').addEventListener('change',function(e){S.sort=oneOf(e.target.value,['name','modified','size'],'name');lsSet('shoebox.sort',S.sort);load(S.route);});
    $('#viewBtn').addEventListener('click',function(){S.view=S.view==='grid'?'rows':'grid';lsSet('shoebox.view',S.view);render();});
    $('#selBtn').addEventListener('click',function(){if(S.selecting)endSelect();else S.selecting=true;render();});
    $('#themeBtn').addEventListener('click',function(){var next=shownTheme()==='dark'?'light':'dark';lsSet('shoebox.theme',next===deviceTheme()?'auto':next);paintTheme();});
    if(darkQ){if(darkQ.addEventListener)darkQ.addEventListener('change',paintTheme);else if(darkQ.addListener)darkQ.addListener(paintTheme);}
    $$('dialog [data-close]').forEach(function(b){b.addEventListener('click',function(){b.closest('dialog').close();});});
    $('#nameForm').addEventListener('submit',function(e){
      e.preventDefault();var v=$('#nameInp').value.trim(),err=$('#nameErr'),ok=$('#nameOk');
      if(!v){err.textContent='Type a name first.';err.hidden=false;return;}
      if(!NAME_CB)return;ok.disabled=true;err.hidden=true;
      NAME_CB(v).then(function(){NAME_CB=null;$('#nameDlg').close();},function(ex){err.textContent=errText(ex,'save that');err.hidden=false;}).then(function(){ok.disabled=false;});
    });
    $('#nameDlg').addEventListener('close',function(){NAME_CB=null;});
    $('#confirmYes').addEventListener('click',function(){var cb=CONFIRM_CB;CONFIRM_CB=null;$('#confirmDlg').close();if(cb)cb(true);});
    $('#confirmDlg').addEventListener('close',function(){var cb=CONFIRM_CB;CONFIRM_CB=null;if(cb)cb(false);});
    $('#moveHere').addEventListener('click',function(){
      var dest=realId(MV.at),name=MV.path.length?MV.path[MV.path.length-1].name:'My Drive',hb=$('#moveHere');
      hb.disabled=true;doMove(MV.items,dest,name).then(function(){$('#moveDlg').close();},function(e){$('#moveErr').textContent=errText(e,'move that');$('#moveErr').hidden=false;hb.disabled=false;});
    });
    $('#moveDlg').addEventListener('close',function(){MV.gen++;});
    setKids($('#vDl'),[icon('download'),h('span',{class:'lbl',text:'Download'})]);$('#vDl').setAttribute('aria-label','Download');
    setKids($('#vDrive'),[icon('drivelink'),h('span',{class:'lbl',text:'Open in Drive'})]);$('#vDrive').setAttribute('aria-label','Open in Google Drive');
    setKids($('#vClose'),[icon('x')]);setKids($('#vPrev'),[icon('left')]);setKids($('#vNext'),[icon('right')]);
    $('#vDl').addEventListener('click',function(){var f=V.list[V.i];if(f)downloadMany([f]);});
    $('#vClose').addEventListener('click',closeViewer);
    $('#vPrev').addEventListener('click',function(){stepV(-1);});
    $('#vNext').addEventListener('click',function(){stepV(1);});
    document.addEventListener('keydown',function(e){
      if($('#viewer').open){if(e.key==='ArrowRight'){e.preventDefault();stepV(1);}else if(e.key==='ArrowLeft'){e.preventDefault();stepV(-1);}return;}
      if(document.querySelector('dialog[open]'))return;
      var typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')&&e.target.type!=='checkbox';
      if(e.key==='Escape'&&S.selecting){endSelect();render();return;}
      if(typing)return;
      if(e.key==='/'&&signedIn()){e.preventDefault();$('#q').focus();return;}
      if((e.key==='Delete'||e.key==='Backspace')&&S.selecting&&selected().length&&S.route.view!=='trash'){e.preventDefault();trashItems(selected());}
    });
  }

  wire();paintTheme();
  S.route=parseHash();
  render();
  if(configured()&&signedIn())afterSignIn();
})();
</script>
</body>
</html>
