<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Word Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
:root{--ink:#1B1A2E;--chalk:#F4F1E8;--board:#2F5D50;--board2:#244A40;--bus:#FFC72C;--bus2:#F5A300;--coral:#FF5A4A;--sky:#7CC4F5;--grass:#62C24B;--mint:#7FE0B4;
  --display:'Bangers','Impact','Arial Black',sans-serif;--ui:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2F5D50}
body{font-family:var(--ui);color:var(--chalk);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;background:#7CC4F5;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--bus);outline-offset:2px}
input{font-family:inherit}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:8px}
.pill{background:rgba(27,26,46,.78);border:3px solid var(--chalk);border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(16px,2.6vw,24px);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.stars{color:var(--bus)}
.fuel{display:flex;flex-direction:column;align-items:center;gap:4px}
.fuel .bar{width:min(220px,40vw);height:22px;border:3px solid var(--chalk);border-radius:999px;background:rgba(27,26,46,.78);overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.fuel .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF5A4A,#FFC72C 40%,#62C24B);transition:width .2s;border-radius:999px}
.fuel small{font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.hud-btns button{width:46px;height:46px;border-radius:50%;background:rgba(27,26,46,.78);border:3px solid var(--chalk);color:var(--chalk);font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hud-btns button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.6);font-family:var(--display);font-size:clamp(36px,9vw,96px);color:var(--bus);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,199,44,.55);letter-spacing:.04em;opacity:0;transition:opacity .25s,transform .25s cubic-bezier(.2,1.6,.4,1);text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto}
.pad.left{left:max(12px,env(safe-area-inset-left))}.pad.right{right:max(12px,env(safe-area-inset-right))}
.pad button{touch-action:none;width:min(104px,22vw,26vh);height:min(104px,22vw,26vh);border-radius:26px;background:var(--chalk);color:var(--ink);font-size:clamp(30px,7vw,48px);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);opacity:.94}
.pad button.down,.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
body.no-touch .pad{display:none}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(27,26,46,.3),rgba(27,26,46,.8));overflow:auto}
.screen h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,14vw,140px);line-height:.9;margin:0;color:var(--bus);-webkit-text-stroke:2px var(--ink);text-shadow:0 8px 0 var(--ink),0 0 40px rgba(255,199,44,.5);letter-spacing:.03em;transform:rotate(-3deg);text-wrap:balance}
.screen h1 span{color:var(--chalk)}
.screen h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,84px);margin:0;color:var(--chalk);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);letter-spacing:.04em}
.tag{margin:0;font-weight:900;font-size:clamp(14px,2.2vw,19px);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 0 var(--ink)}
.namebox{display:flex;align-items:center;gap:10px;background:rgba(27,26,46,.75);border:3px solid var(--chalk);border-radius:999px;padding:6px 8px 6px 18px;font-weight:900}
.namebox input{width:min(200px,44vw);font-size:18px;font-weight:900;border:0;border-radius:999px;padding:8px 14px;background:var(--chalk);color:var(--ink);text-align:center}
.packs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pack{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(200px,44vw);padding:14px 10px 16px;border-radius:22px;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);color:var(--ink);background:var(--chalk);transition:transform .08s}
.pack .em{font-size:clamp(36px,7vw,52px);line-height:1}
.pack .big{font-family:var(--display);font-size:clamp(26px,5vw,38px);letter-spacing:.05em;line-height:1}
.pack small{font-weight:800;font-size:13px;opacity:.8}
.pack.sel{background:var(--bus);transform:translateY(3px);box-shadow:0 4px 0 var(--ink)}
.levels{display:flex;border:4px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.levels button{padding:10px 22px;font-family:var(--display);font-size:clamp(18px,3.4vw,26px);letter-spacing:.06em;background:var(--chalk);color:var(--ink)}
.levels button.sel{background:var(--board);color:var(--chalk)}
.btn{font-family:var(--display);font-size:clamp(24px,4.4vw,36px);letter-spacing:.06em;padding:10px 30px;border-radius:18px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--bus);color:var(--ink)}
.btn.alt{background:var(--chalk)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:13px;color:rgba(244,241,232,.85)}
.keys kbd{font-family:var(--ui);background:var(--chalk);color:var(--ink);border-radius:6px;padding:2px 7px;border-bottom:3px solid #b9ad99;font-weight:900}
#best{font-weight:900;color:var(--bus);text-shadow:0 2px 0 var(--ink)}

/* challenge card (the chalkboard) */
#challenge{justify-content:center;background:rgba(27,26,46,.35)}
.card{width:min(680px,96vw);background:var(--board);border:6px solid #8B5A2B;outline:4px solid var(--ink);border-radius:14px;box-shadow:0 12px 0 var(--ink),0 20px 40px rgba(0,0,0,.4);padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.card .eyebrow{font-weight:900;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mint)}
.card .prompt{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.card .emoji{font-size:clamp(64px,14vw,110px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.card .sum{font-family:var(--display);font-size:clamp(44px,10vw,84px);color:var(--chalk);letter-spacing:.06em;text-shadow:0 4px 0 var(--ink)}
.card .letter{font-family:var(--display);font-size:clamp(90px,20vw,160px);line-height:1;color:var(--bus);text-shadow:0 6px 0 var(--ink)}
.card .letter.hidden-letter{color:var(--mint)}
.card .count{font-size:clamp(20px,4vw,30px);line-height:1.2;letter-spacing:.05em;max-width:24ch}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(44px,9vw,64px);height:clamp(56px,11vw,78px);border-radius:12px;border:3px dashed rgba(244,241,232,.55);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(30px,7vw,48px);color:var(--chalk);text-transform:uppercase}
.slot.filled{border-style:solid;border-color:var(--chalk);background:rgba(244,241,232,.12)}
.slot.next{border-color:var(--bus);animation:blink 1s infinite}
@keyframes blink{50%{border-color:rgba(255,199,44,.25)}}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{min-width:clamp(64px,13vw,92px);height:clamp(64px,13vw,92px);padding:0 14px;border-radius:18px;background:var(--bus);color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:var(--display);font-size:clamp(30px,6vw,46px);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tile small{font-family:var(--ui);font-weight:900;font-size:12px;text-transform:none;letter-spacing:.02em}
.tile.pic{font-size:clamp(34px,7vw,52px);min-width:clamp(88px,20vw,130px);height:auto;padding:10px 12px;gap:4px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile.used{opacity:.3;pointer-events:none}
.tile.wrong{animation:wobble .4s}
.tile.hint{animation:glow .7s infinite alternate}
.tile.right{background:var(--grass);color:var(--chalk)}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
@keyframes glow{from{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(127,224,180,.9)}to{box-shadow:0 6px 0 var(--ink),0 0 0 12px rgba(127,224,180,0)}}
.card .fb{min-height:1.4em;font-family:var(--display);font-size:clamp(22px,4.6vw,36px);letter-spacing:.06em;color:var(--bus);text-shadow:0 3px 0 var(--ink)}
.card .say{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;background:var(--chalk);color:var(--ink);border:3px solid var(--ink);font-size:20px;box-shadow:0 4px 0 var(--ink)}
.card .say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* certificate */
.cert{width:min(560px,94vw);background:var(--chalk);color:var(--ink);border:6px double #8B5A2B;border-radius:8px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 12px 0 var(--ink),0 20px 40px rgba(0,0,0,.4);transform:rotate(-1deg)}
.cert .ribbon{font-weight:900;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8B5A2B}
.cert .who{font-family:var(--display);font-size:clamp(40px,9vw,72px);line-height:1;color:var(--board)}
.cert p{margin:0;font-weight:800;max-width:36ch;line-height:1.35}
.cert .grid{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-weight:900;font-variant-numeric:tabular-nums;text-align:left;margin-top:6px}
.cert .grid span:nth-child(odd){color:#8B5A2B;font-size:.75em;letter-spacing:.12em;text-transform:uppercase;align-self:center}
.cert .grid span:nth-child(even){text-align:right;font-size:1.2em}
.cert .seal{width:64px;height:64px;border-radius:50%;background:var(--bus);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:6px;box-shadow:0 4px 0 var(--ink)}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cdText{font-family:var(--display);font-size:clamp(120px,30vw,320px);color:var(--bus);-webkit-text-stroke:3px var(--ink);text-shadow:0 12px 0 var(--ink);animation:cd .95s ease-out infinite}
@keyframes cd{0%{transform:scale(1.5);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){#cdText,.tile.hint,.slot.next{animation:none}}
@media (max-height:720px){.screen h1{font-size:clamp(44px,9vw,84px)}.screen{gap:10px}.pack{padding:8px 8px 10px}.pack .em{font-size:28px}.pack small{display:none}}
@media (max-height:520px){.screen h1{font-size:clamp(44px,10vw,90px)}.keys{display:none}.pack{padding:8px 8px 10px}.pack .em{font-size:30px}}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="pill stars"><span aria-hidden="true">★</span><span id="hudStars">0</span></div>
      <div class="fuel"><div class="bar"><i id="fuelBar"></i></div><small id="hudPit">Pit stop 1 of 5</small></div>
      <div class="hud-btns"><button id="btnMute" aria-label="Sound on/off">🔊</button><button id="btnPause" aria-label="Pause">⏸</button></div>
    </div>
    <div id="toast"></div>
    <div class="pad left"><button data-k="left" aria-label="Nudge left">◀</button></div>
    <div class="pad right"><button data-k="right" aria-label="Nudge right">▶</button></div>
  </div>

  <div id="title" class="screen">
    <h1>Word<br><span>Racer</span></h1>
    <p class="tag">Solve it · Fuel up · Zoom!</p>
    <label class="namebox">Driver <input id="nameInput" maxlength="14" placeholder="your name" autocomplete="off"></label>
    <div class="packs">
      <button class="pack sel" data-pack="spelling"><span class="em">🔤</span><span class="big">Spelling</span><small>Fill the missing letters</small></button>
      <button class="pack" data-pack="sums"><span class="em">➕</span><span class="big">Sums</span><small>Add and take away</small></button>
      <button class="pack" data-pack="sounds"><span class="em">🔊</span><span class="big">Letter Sounds</span><small>Hear it, find the picture</small></button>
    </div>
    <div class="levels"><button class="sel" data-level="starter">Starter</button><button data-level="speedy">Speedy</button></div>
    <button class="btn" id="btnStart">Start Engine</button>
    <div class="keys"><span><kbd>←</kbd><kbd>→</kbd> nudge</span><span><kbd>A</kbd>–<kbd>Z</kbd> letters</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pick a picture</span><span><kbd>P</kbd> pause</span></div>
    <div id="best"></div>
  </div>

  <div id="challenge" class="screen" hidden>
    <div class="card">
      <button class="say" id="btnSay" aria-label="Hear it again">🔊</button>
      <div class="eyebrow" id="chEyebrow">Pit stop 1 · Spelling</div>
      <div class="prompt" id="chPrompt"></div>
      <div class="slots" id="chSlots"></div>
      <div class="tiles" id="chTiles"></div>
      <div class="fb" id="chFb"></div>
    </div>
  </div>

  <div id="pause" class="screen" hidden>
    <h2>Paused</h2>
    <div class="row"><button class="btn" id="btnResume">Keep Driving</button><button class="btn alt" id="btnQuit">Main Menu</button></div>
  </div>

  <div id="results" class="screen" hidden>
    <div class="cert">
      <div class="ribbon">Certificate of Awesome Driving</div>
      <div class="who" id="certName">Driver</div>
      <p id="certText">finished the Spelling race.</p>
      <div class="grid" id="certGrid"></div>
      <div class="seal">🏁</div>
    </div>
    <div class="row"><button class="btn" id="btnAgain">Race Again</button><button class="btn alt" id="btnMenu">Main Menu</button></div>
  </div>

  <div id="countdown" hidden><span id="cdText">3</span></div>
</div>
<script>
(function(){
'use strict';
const G={state:'title',pack:'spelling',level:'starter',position:0,playerX:0,targetX:0,speed:0,maxSpeed:1,stars:0,boost:0,wobble:0,shake:0,bounce:0,time:0,driveTime:0,fuel:100,pit:0,pits:5,solved:0,attempts:0,misses:0,particles:[],clouds:[],curSeg:null,skyOffset:0,hillOffset:0,steer:0,throttle:true,braking:false,offroad:false,bumpTime:0,speedKmh:0,name:''};
const CAM={height:1000,fov:100,depth:1/Math.tan((100/2)*Math.PI/180),drawDist:200,fog:4.5};
const playerZ=CAM.height*CAM.depth;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const view={w:0,h:0,dpr:1,touch:false};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const easeIn=(a,b,p)=>a+(b-a)*Math.pow(p,2);
const easeOut=(a,b,p)=>a+(b-a)*(1-Math.pow(1-p,2));
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
const pct=(n,total)=>(n%total)/total;
const overlap=(x1,w1,x2,w2,p)=>{const h1=w1*(p||1)/2,h2=w2*(p||1)/2;return !((x1+h1)<(x2-h2)||(x1-h1)>(x2+h2));};
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mixHex=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtTime=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);};
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK='#1B1A2E';
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.lineJoin='round';x.lineCap='round';x.strokeStyle=INK;x.lineWidth=3;fn(x,w,h);return {img:c,w,h};}
function circle(x,cx,cy,r,fill,ns){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function ellipse(x,cx,cy,rx,ry,fill,ns){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function rr(x,px,py,w,h,r,fill,ns){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function poly(x,pts,fill,ns){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function starPath(x,cx,cy,R,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}x.closePath();}
const SPRITE_SCALE=0.3/80;   // player car is ~80px wide in sprite units
const SEG_LEN=200,RUMBLE=3,ROAD_W=2000,LANES=3,ZONE_SEGS=420;
const L={SHORT:25,MEDIUM:50,LONG:100},H={LOW:20,MEDIUM:40,HIGH:60};
let segments=[],trackLength=0,starTotal=0,ZONE_BOUNDS=[];
const lastY=()=>segments.length?segments[segments.length-1].p2.world.y:0;
function addSegment(curve,y,zone){const n=segments.length;segments.push({index:n,zone,p1:{world:{x:0,y:lastY(),z:n*SEG_LEN},camera:{},screen:{}},p2:{world:{x:0,y:y,z:(n+1)*SEG_LEN},camera:{},screen:{}},curve,sprites:[],cars:[],alt:Math.floor(n/RUMBLE)%2===0,checker:false});}
function addRoad(enter,hold,leave,curve,y,zone){const sy=lastY(),ey=sy+y*SEG_LEN,total=enter+hold+leave;let n;
  for(n=0;n<enter;n++)addSegment(easeIn(0,curve,n/enter),easeInOut(sy,ey,n/total),zone);
  for(n=0;n<hold;n++)addSegment(curve,easeInOut(sy,ey,(enter+n)/total),zone);
  for(n=0;n<leave;n++)addSegment(easeInOut(curve,0,n/leave),easeInOut(sy,ey,(enter+hold+n)/total),zone);}
function genZone(zone,count,maxCurve,hillMax){const start=segments.length;
  while(segments.length-start<count){const r=Math.random(),s=Math.random()<0.5?-1:1;
    if(r<0.22)addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,pick([0,0,H.LOW*0.5,-H.LOW*0.5]),zone);

function makeChallenge(){const speedy=G.level==='speedy';
  if(G.pack==='spelling'){const pool=WORDS.filter(([w])=>speedy?(w.length>=3&&w.length<=5):w.length<=4);const [word,emoji]=pick(pool);const letters=word.split('');
    if(!speedy){const idx=rndi(0,word.length-1);const need=word[idx];const d=[];while(d.length<3){const l=LETTERS[rndi(0,25)];if(l!==need&&!d.includes(l))d.push(l);}
      return {type:'spell',word,emoji,missing:[idx],filled:[],tiles:shuffle([need,...d]).map(l=>({label:l,letter:l})),say:word+'. Which letter is missing?'};}
    const d=[];while(d.length<2){const l=LETTERS[rndi(0,25)];if(!letters.includes(l)&&!d.includes(l))d.push(l);}
    return {type:'spell',word,emoji,missing:letters.map((_,i)=>i),filled:[],tiles:shuffle([...letters,...d]).map(l=>({label:l,letter:l})),say:word+'. Spell '+word+'.'};}
  if(G.pack==='sums'){const max=speedy?20:10;let a,b,op,ans;if(Math.random()<0.6){op='+';a=rndi(1,max-1);b=rndi(1,max-a);ans=a+b;}else{op='−';a=rndi(2,max);b=rndi(1,a-1);ans=a-b;}
    const opts=[ans];while(opts.length<3){const v=ans+pick([-3,-2,-1,1,2,3]);if(v>=0&&!opts.includes(v))opts.push(v);}
    return {type:'sum',a,b,op,ans,emoji:speedy?null:pick(['🍎','⭐','🚗','🐸','🍪','🎈']),tiles:shuffle(opts).map(v=>({label:String(v),value:v})),say:a+(op==='+'?' plus ':' take away ')+b+'. What is the answer?'};}
  const withLetter=l=>WORDS.filter(([w])=>w[0]===l);let letter;do{letter=LETTERS[rndi(0,25)];}while(withLetter(letter).length===0);
  const right=pick(withLetter(letter));const others=[];while(others.length<2){const c=pick(WORDS);if(c[0][0]!==letter&&!others.some(o=>o[0][0]===c[0][0]))others.push(c);}
  return {type:'sound',letter,right,hideLetter:speedy,tiles:shuffle([right,...others]).map(([w,e])=>({label:e,sub:w,word:w})),say:PHONICS[letter]+'. Which picture starts with '+letter.toUpperCase()+'?'};}

  else if(c.type==='sum'){let vis='';if(c.emoji){vis='<div class="count">'+c.emoji.repeat(c.a)+' '+c.op+' '+c.emoji.repeat(c.b)+'</div>';}el.prompt.innerHTML=vis+'<div class="sum">'+c.a+' '+c.op+' '+c.b+' = ?</div>';}
  else{el.prompt.innerHTML='<div class="letter'+(c.hideLetter?' hidden-letter':'')+'">'+(c.hideLetter?'?':c.letter.toUpperCase())+'</div><div class="count">Which picture starts with this sound?</div>';}
  c.tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='tile'+(t.word?' pic':'');b.innerHTML=t.label+(t.sub?'<small>'+t.sub+'</small>':'');b.addEventListener('click',()=>{wake();tapTile(i);});t.el=b;el.tiles.appendChild(b);});
  el.say.hidden=!Speech.ok;}
function markNext(){const c=CH;if(c.type!=='spell')return;const slots=el.slots.children;let done=false;for(let i=0;i<slots.length;i++){slots[i].classList.remove('next');if(!done&&c.missing.includes(i)&&!c.filled.includes(i)){slots[i].classList.add('next');done=true;}}}
function nextMissing(){return CH.missing.find(i=>!CH.filled.includes(i));}
function tapTile(i){if(!CH||CH.done)return;const t=CH.tiles[i];if(t.used)return;let ok=false;
  if(CH.type==='spell'){const ni=nextMissing();if(ni!=null&&CH.word[ni]===t.letter){ok=true;CH.filled.push(ni);t.used=true;t.el.classList.add('used');el.slots.children[ni].textContent=t.letter;el.slots.children[ni].classList.add('filled');markNext();if(nextMissing()==null)return win();Audio.chime();Haptics.star();el.fb.textContent=pick(['Nice!','Keep going!','Yes!']);return;}}
  else if(CH.type==='sum'){ok=t.value===CH.ans;}else ok=t.word[0]===CH.letter;
  if(ok)return win();
  CH.misses++;G.attempts++;Audio.wobble();Haptics.bad();t.el.classList.remove('wrong');void t.el.offsetWidth;t.el.classList.add('wrong');el.fb.textContent=pick(['Try again!','Almost!','Have another go!']);
  if(CH.misses>=2)CH.tiles.forEach(x=>{const good=CH.type==='spell'?x.letter===CH.word[nextMissing()]&&!x.used:CH.type==='sum'?x.value===CH.ans:x.word[0]===CH.letter;if(good)x.el.classList.add('hint');});}
function win(){CH.done=true;G.solved++;G.attempts++;G.stars+=3;Audio.cheer();Haptics.good();spawn('confetti',reducedMotion?0:80);spawn('stars',12);el.fb.textContent=pick(['YES! ⭐⭐⭐','SUPER! ⭐⭐⭐','WOW! ⭐⭐⭐']);
  CH.tiles.forEach(x=>{const good=CH.type==='spell'?CH.word.includes(x.letter):CH.type==='sum'?x.value===CH.ans:x.word[0]===CH.letter;x.el.classList.remove('hint');if(good)x.el.classList.add('right');});
  if(CH.type==='spell')Speech.say(CH.word+'! Great job!');else if(CH.type==='sum')Speech.say(CH.a+(CH.op==='+'?' plus ':' take away ')+CH.b+' is '+CH.ans+'. Great job!');else Speech.say(CH.right[0]+'! Great job!');
  setTimeout(closeChallenge,1500);}
function challengeKey(letter){if(!CH||CH.done)return;if(CH.type==='spell'){const i=CH.tiles.findIndex(t=>t.letter===letter&&!t.used);if(i>=0)tapTile(i);}}
function challengeDigit(d){if(!CH||CH.done)return;if(CH.type==='sum'){digitBuf+=d;clearTimeout(digitTimer);const v=parseInt(digitBuf,10);const i=CH.tiles.findIndex(t=>t.value===v);if(i>=0){digitBuf='';tapTile(i);}else if(digitBuf.length>=2){digitBuf='';Audio.wobble();}else digitTimer=setTimeout(()=>{digitBuf='';},900);}
  else if(CH.type==='sound'){const i=parseInt(d,10)-1;if(i>=0&&i<CH.tiles.length)tapTile(i);}}
let pitSprite=null,pitSeg=null;
function startPit(){G.state='pitting';Audio.pitIn();toast('PIT STOP!',1200);const seg=findSegment(G.position+playerZ+SEG_LEN*16);pitSprite={spr:SPR.pit,offset:1.25,kind:'deco'};pitSeg=seg;seg.sprites.push(pitSprite);}
function openChallenge(){G.pit++;CH=makeChallenge();CH.misses=0;CH.done=false;renderChallenge();el.ch.hidden=false;G.state='challenge';updateHud();setTimeout(sayChallenge,350);}
function closeChallenge(){el.ch.hidden=true;CH=null;if(pitSeg&&pitSprite){const i=pitSeg.sprites.indexOf(pitSprite);if(i>=0)pitSeg.sprites.splice(i,1);}pitSprite=null;G.driveTime=0;G.fuel=100;G.boost=2.5;G.state='racing';Audio.boost();Haptics.boost();toast('ZOOM!',900);spawn('boost',24);if(G.pit>=G.pits)G.finishing=true;}

/* ===================== flow ===================== */
function bump(s){if(G.bumpTime>0)return;s.taken=true;G.bumpTime=0.6;G.speed*=0.5;G.shake=6;G.wobble=(G.playerX>s.offset?1:-1)*1.5;Audio.bump();Haptics.bump();spawn('sparks',10);toast(pick(['Bonk!','Oops!','Whoa!']),700);}
function collectStar(s){s.taken=true;G.stars++;Audio.star();Haptics.star();spawn('stars',8);}
function resetGame(){buildTrack();G.maxSpeed=SEG_LEN*60*0.6;Object.assign(G,{position:0,playerX:0,targetX:0,speed:0,stars:0,boost:0,wobble:0,shake:0,driveTime:0,fuel:100,pit:0,solved:0,attempts:0,particles:[],bumpTime:0,finishing:false,steer:0,speedKmh:0});G.name=(el.name.value.trim()||'Driver');}
function bestKey(){return G.pack+'_'+G.level;}
function showBest(){const b=store.get('wr_best',{})[bestKey()];el.best.textContent=b?'Best in '+PACK_NAME[G.pack]+' '+(G.level==='speedy'?'Speedy':'Starter')+': '+b.solved+' solved · '+b.acc+'% · '+b.stars+' stars':'No race yet in '+PACK_NAME[G.pack]+' '+(G.level==='speedy'?'Speedy':'Starter')+'. Start your engine!';}
function goTitle(){resetGame();G.state='title';el.hud.hidden=true;el.pause.hidden=true;el.results.hidden=true;el.countdown.hidden=true;el.ch.hidden=true;el.title.hidden=false;showBest();keepAwake(false);if(Speech.ok)speechSynthesis.cancel();}
let cdTimer=0;
function startGame(){resetGame();G.state='countdown';el.title.hidden=true;el.pause.hidden=true;el.results.hidden=true;el.hud.hidden=false;el.countdown.hidden=false;keepAwake(true);updateHud(true);
  clearTimeout(cdTimer);const steps=['3','2','1','GO!'];let i=0;const tick=()=>{if(G.state!=='countdown')return;el.cdText.textContent=steps[i];el.cdText.style.animation='none';void el.cdText.offsetWidth;el.cdText.style.animation='';
    if(i<3){Audio.beep(false);Haptics.vibrate(25);i++;cdTimer=setTimeout(tick,900);}else{Audio.beep(true);Haptics.go();G.state='racing';Speech.say('Go '+G.name+'!');cdTimer=setTimeout(()=>{el.countdown.hidden=true;},800);}};tick();}
function togglePause(){if(G.state==='racing'||G.state==='pitting'){G.prev=G.state;G.state='paused';el.pause.hidden=false;keepAwake(false);}else if(G.state==='paused'){G.state=G.prev||'racing';el.pause.hidden=true;keepAwake(true);}}
function finish(){G.state='results';keepAwake(false);const acc=G.attempts?Math.round(G.solved/G.attempts*100):100;const all=store.get('wr_best',{}),k=bestKey(),prev=all[k];const score=G.solved*100+acc+G.stars;const isNew=!prev||score>prev.score;if(isNew){all[k]={solved:G.solved,acc,stars:G.stars,score};store.set('wr_best',all);}
  el.certName.textContent=G.name;el.certText.textContent='finished the '+PACK_NAME[G.pack]+' '+(G.level==='speedy'?'Speedy':'Starter')+' race on '+new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+(isNew?'. New personal best!':'.');
  const what=G.pack==='sums'?'Sums solved':G.pack==='sounds'?'Sounds found':'Words spelled';
  el.certGrid.innerHTML=[[what,G.solved+' / '+G.pits],['Accuracy',acc+'%'],['Stars',G.stars]].map(([a,b])=>'<span>'+a+'</span><span>'+b+'</span>').join('');
  el.results.hidden=false;el.hud.hidden=true;Audio.fanfare();spawn('confetti',reducedMotion?0:120);Speech.say('Well done '+G.name+'! You finished the race!');}

/* ===================== physics ===================== */
const PIT_INTERVAL=(()=>{const m=location.search.match(/pit=(\d+)/);return m?Math.max(2,+m[1]):20;})();
function update(dt){G.time+=dt;const playerSeg=findSegment(G.position+playerZ),speedPct=G.speed/G.maxSpeed;
  if(G.state==='paused'||G.state==='results'||G.state==='challenge'){updateParticles(dt);Audio.update(speedPct,false,false,false);return;}
  const racing=G.state==='racing';let input=0;
  if(racing){input=(keys.left?-1:0)+(keys.right?1:0);G.targetX=clamp(G.targetX+input*1.5*dt,-0.72,0.72);G.driveTime+=dt;G.fuel=G.finishing?100:Math.max(8,100-G.driveTime/PIT_INTERVAL*88);
    if(G.finishing&&G.driveTime>6)return finish();if(!G.finishing&&G.driveTime>=PIT_INTERVAL)startPit();}
  else if(G.state==='title'){G.targetX=lerp(G.targetX,0,dt);}
  else if(G.state==='pitting'){G.targetX=lerp(G.targetX,0.55,1-Math.pow(0.2,dt));}
  const top=G.maxSpeed*(G.boost>0?1.35:1);
  if(G.state==='pitting'){G.speed=Math.max(0,G.speed-G.maxSpeed*0.7*dt);G.braking=true;if(G.speed<=0){G.speed=0;openChallenge();return;}}
  else if(G.state==='countdown'){G.speed=0;G.braking=false;}
  else{G.braking=false;if(G.boost>0){G.speed=Math.min(top,G.speed+G.maxSpeed*1.4*dt);G.boost-=dt;if(G.boost<0)G.boost=0;}else{const want=G.state==='title'?G.maxSpeed*0.5:G.maxSpeed;G.speed=G.speed<want?Math.min(want,G.speed+G.maxSpeed/3.5*dt):Math.max(want,G.speed-G.maxSpeed/4*dt);}}
  G.position=(G.position+dt*G.speed)%trackLength;
  const dx=dt*2*speedPct;G.playerX-=dx*speedPct*playerSeg.curve*0.12;G.playerX+=(G.targetX-G.playerX)*Math.min(1,5*dt);
  G.steer=lerp(G.steer,clamp((G.targetX-G.playerX)*4+input*0.6,-1,1),1-Math.pow(0.001,dt));
  if(racing){for(const s of playerSeg.sprites){if(s.taken||s.kind==='deco')continue;const sw=s.spr.w*SPRITE_SCALE;if(overlap(G.playerX,0.3,s.offset,sw,0.8)){if(s.kind==='star')collectStar(s);else bump(s);}}}
  if(G.bumpTime>0)G.bumpTime-=dt;G.shake=Math.max(0,G.shake-dt*40);G.wobble*=Math.pow(0.03,dt);G.bounce=reducedMotion?0:1.2*speedPct*(Math.random()*2-1);
  G.skyOffset+=0.001*playerSeg.curve*speedPct*dt*60;G.hillOffset+=0.002*playerSeg.curve*speedPct*dt*60;G.clouds.forEach(c=>{c.x=(c.x+c.v*dt)%1;});updateParticles(dt);
  Audio.update(speedPct,G.state!=='pitting',G.boost>0,G.state!=='title');}

/* ===================== HUD + loop ===================== */
const hudCache={};function setText(k,node,v){if(hudCache[k]!==v){hudCache[k]=v;node.textContent=v;}}
function updateHud(force){if(el.hud.hidden&&!force)return;setText('stars',el.stars,String(G.stars));setText('pit',el.pit,G.finishing?'Final lap!':'Pit stop '+Math.min(G.state==='challenge'?G.pit:G.pit+1,G.pits)+' of '+G.pits);const fw=Math.round(G.fuel)+'%';if(hudCache.fuel!==fw){hudCache.fuel=fw;el.fuel.style.width=fw;}}
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}render();updateHud();requestAnimationFrame(frame);}
function init(){buildSprites();goTitle();requestAnimationFrame(frame);}
const fontsReady=document.fonts?Promise.all([document.fonts.load('42px Bangers'),document.fonts.load('900 20px Nunito')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(init);
})();
</script>
