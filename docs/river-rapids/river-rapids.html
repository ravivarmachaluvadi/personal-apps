<meta charset="utf-8">
<meta name="darkreader-lock">
<title>River Rapids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
:root{
  --ink:#1B1A2E; --cream:#FFF6E5; --sand:#F2D6A2; --sand2:#E2B86F; --teal:#1FA3A8; --deep:#0F5E63; --deep2:#093F43;
  --coral:#FF7A59; --leaf:#4FAF46; --sky:#39B6E8; --foam:#EAFBFF;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --ui:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#093F43}
body{font-family:var(--ui);color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;background:#39B6E8;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:8px}
.pill{background:rgba(9,63,67,.82);border:3px solid var(--sand);border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(16px,2.6vw,24px);letter-spacing:.02em;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.catch{color:var(--sand)}
.pill.lap{color:var(--cream);flex-direction:column;gap:0;padding:4px 18px;line-height:1.1}
.pill.lap small{font-size:.6em;color:var(--sand);letter-spacing:.12em;text-transform:uppercase}
.hud-top .center{display:flex;flex-direction:column;align-items:center;gap:5px}
#bio{font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,246,229,.9);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.hud-btns button{width:46px;height:46px;border-radius:50%;background:rgba(9,63,67,.82);border:3px solid var(--sand);color:var(--cream);font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hud-btns button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);font-family:var(--display);font-size:clamp(36px,9vw,96px);color:var(--sand);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--deep2),0 0 30px rgba(31,163,168,.6);letter-spacing:.04em;opacity:0;transition:opacity .25s,transform .25s cubic-bezier(.2,1.6,.4,1);text-align:center;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- Touch pads ---------- */
.pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}
.pad.left{left:max(12px,env(safe-area-inset-left))}
.pad.right{right:max(12px,env(safe-area-inset-right));display:grid;grid-template-columns:auto auto;justify-items:center;align-items:end}
.pad button{touch-action:none;color:var(--ink);font-family:var(--display);font-size:clamp(18px,3.4vw,30px);letter-spacing:.06em;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:22px;opacity:.92;display:flex;align-items:center;justify-content:center}
.pad button.down,.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.1)}
.pad button[data-k=left],.pad button[data-k=right]{width:min(88px,19vw,23vh);height:min(88px,19vw,23vh);background:var(--sand);font-size:clamp(28px,6vw,44px)}
.pad button[data-k=brake]{width:min(96px,20vw,25vh);height:min(96px,20vw,25vh);background:var(--coral);border-radius:50%}
.pad button[data-k=gas]{width:min(118px,25vw,30vh);height:min(118px,25vw,30vh);background:var(--leaf);border-radius:50%}
.pad button[data-k=horn]{width:min(60px,13vw,16vh);height:min(60px,13vw,16vh);background:var(--sky);border-radius:50%;font-size:clamp(18px,4.4vw,28px)}
.pad button[data-k=turbo]{width:min(72px,15vw,18vh);height:min(72px,15vw,18vh);background:var(--teal);color:var(--cream);border-radius:50%;font-size:clamp(14px,2.8vw,20px)}
.pad button[data-k=turbo][disabled]{opacity:.35;filter:grayscale(.6)}
.pad button[data-k=turbo]:not([disabled]){animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(31,163,168,.7)}to{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(31,163,168,0)}}
body.no-touch .pad{display:none}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(9,63,67,.3),rgba(9,63,67,.84));overflow:auto}
.screen h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,14vw,148px);line-height:.9;margin:0;color:var(--sand);-webkit-text-stroke:2px var(--ink);text-shadow:0 8px 0 var(--deep2),0 0 40px rgba(31,163,168,.6);letter-spacing:.03em;transform:rotate(-2deg);text-wrap:balance}
.screen h1 span{color:var(--foam)}
.screen h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,90px);margin:0;color:var(--cream);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--deep2);letter-spacing:.04em}
.wave{width:min(420px,80vw);height:18px;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--foam) 6px 26px,transparent 26px 32px);border-radius:9px;opacity:.7;mask:radial-gradient(circle at 50% 100%,#000 60%,transparent 62%) 0 0/32px 18px repeat-x;-webkit-mask:radial-gradient(circle at 50% 100%,#000 60%,transparent 62%) 0 0/32px 18px repeat-x}
.tag{margin:0;font-weight:900;font-size:clamp(15px,2.4vw,20px);letter-spacing:.14em;text-transform:uppercase;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.mode{display:flex;flex-direction:column;gap:4px;align-items:center;width:min(280px,82vw);padding:16px 18px 20px;border-radius:26px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);color:var(--ink);transition:transform .08s}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.mode .big{font-family:var(--display);font-size:clamp(34px,6vw,46px);letter-spacing:.05em;line-height:1}
.mode small{font-weight:800;font-size:14px;line-height:1.3;opacity:.85}
.mode.kid{background:linear-gradient(180deg,#F8E2B4,#E2B86F)}
.mode.pro{background:linear-gradient(180deg,#2BB9BE,#0F5E63);color:var(--cream)}
.mode.pro small{opacity:.92}
.opts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;background:rgba(9,63,67,.75);border:3px solid var(--sand);border-radius:999px;padding:8px 16px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--sand);margin:0}
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:13px;color:rgba(255,246,229,.85);margin-top:4px}
.keys kbd{font-family:var(--ui);background:var(--cream);color:var(--ink);border-radius:6px;padding:2px 7px;border-bottom:3px solid #b9ad99;font-weight:900}
#best{font-weight:900;color:var(--sand);letter-spacing:.06em;text-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:clamp(22px,4vw,32px);letter-spacing:.06em;padding:10px 28px;border-radius:18px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--sand);color:var(--ink)}
.btn.alt{background:var(--cream)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-weight:900;font-size:clamp(18px,3vw,26px);font-variant-numeric:tabular-nums;background:rgba(9,63,67,.78);border:3px solid var(--sand);border-radius:20px;padding:14px 26px;text-align:left}
.stat span:nth-child(odd){color:rgba(255,246,229,.7);letter-spacing:.1em;text-transform:uppercase;font-size:.7em;align-self:center}
.stat span:nth-child(even){color:var(--sand);text-align:right}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cdText{font-family:var(--display);font-size:clamp(120px,30vw,320px);color:var(--sand);-webkit-text-stroke:3px var(--ink);text-shadow:0 12px 0 var(--deep2),0 0 60px rgba(31,163,168,.7);animation:cd .95s ease-out infinite}
@keyframes cd{0%{transform:scale(1.5);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){#cdText,.pad button[data-k=turbo]{animation:none}}
@media (max-height:520px){.screen h1{font-size:clamp(44px,10vw,90px)}.mode{padding:10px 14px 14px}.keys{display:none}.wave{display:none}}
</style>

<div id="game">
  <canvas id="c"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="pill catch"><span>🦆 <span id="hudDucks">0</span></span><span>🐟 <span id="hudFish">0</span></span></div>
      <div class="center"><div class="pill lap"><small id="hudLapLabel">Lap 1</small><span id="hudTime">0:00.0</span></div><div id="bio">Jungle Bend</div></div>
      <div class="hud-btns">
        <button id="btnMute" title="Sound on/off" aria-label="Sound on/off">🔊</button>
        <button id="btnPause" title="Pause" aria-label="Pause">⏸</button>
      </div>
    </div>
    <div id="toast"></div>
    <div class="pad left">
      <button data-k="left" aria-label="Steer left">◀</button>
      <button data-k="right" aria-label="Steer right">▶</button>
    </div>
    <div class="pad right">
      <button data-k="horn" aria-label="Boat horn">📯</button>
      <button data-k="turbo" id="btnTurbo" disabled aria-label="Boost">BOOST</button>
      <button data-k="brake" aria-label="Slow down">SLOW</button>
      <button data-k="gas" aria-label="Go">GO</button>
    </div>
  </div>

  <div id="title" class="screen">
    <h1>River<br><span>Rapids</span></h1>
    <div class="wave"></div>
    <p class="tag">Steer · Splash · Catch the ducks</p>
    <div class="modes">
      <button class="mode kid" data-mode="kid"><span class="big">Kid Paddle</span><small>Auto throttle, soft bumps, the river keeps you in the middle, paddle as long as you like</small></button>
      <button class="mode pro" data-mode="pro"><span class="big">Pro Rapids</span><small>3 laps against the clock, real crashes on rocks and logs, best lap saved</small></button>
    </div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="optAutoGas" checked> Auto throttle in Kid Paddle</label>
      <label class="toggle"><input type="checkbox" id="optHaptics" checked> Haptics</label>
    </div>
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> steer</span><span><kbd>↑</kbd> go</span><span><kbd>↓</kbd>/<kbd>Space</kbd> slow</span><span><kbd>Shift</kbd> boost</span><span><kbd>H</kbd> horn</span><span><kbd>P</kbd> pause</span><span>🎮 gamepad works too</span>
    </div>
    <div id="best">Best lap: —</div>
  </div>

  <div id="pause" class="screen" hidden>
    <h2>Paused</h2>
    <div class="row"><button class="btn" id="btnResume">Keep Paddling</button><button class="btn alt" id="btnQuit">Main Menu</button></div>
  </div>

  <div id="results" class="screen" hidden>
    <h2 id="resTitle">Rapids Complete!</h2>
    <div class="stat" id="resStats"></div>
    <div class="row"><button class="btn" id="btnAgain">Race Again</button><button class="btn alt" id="btnMenu">Main Menu</button></div>
  </div>

  <div id="countdown" hidden><span id="cdText">3</span></div>
</div>
<script>
(function(){
'use strict';
/* ===================== utilities ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const easeIn=(a,b,p)=>a+(b-a)*Math.pow(p,2);
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
const pct=(n,total)=>(n%total)/total;
const overlap=(x1,w1,x2,w2,p)=>{const h1=w1*(p||1)/2,h2=w2*(p||1)/2;return !((x1+h1)<(x2-h2)||(x1-h1)>(x2+h2));};
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mixHex=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtTime=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);};
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== audio (all synthesized) ===================== */
const Audio={
  ctx:null,master:null,muted:store.get('rr_muted',false),ready:false,
  init(){
    if(this.ready)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=this.ctx=new AC();
    this.master=ctx.createGain();this.master.gain.value=this.muted?0:0.9;this.master.connect(ctx.destination);
    const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noise=buf;
    // outboard motor: buzzy saw + square, amplitude "putter" from an LFO, through a lowpass
    const eg=ctx.createGain();eg.gain.value=0;eg.connect(this.master);
    const putt=ctx.createGain();putt.gain.value=1;putt.connect(eg);
    const lfo=ctx.createOscillator();lfo.type='square';lfo.frequency.value=12;const lg=ctx.createGain();lg.gain.value=0.35;lfo.connect(lg);lg.connect(putt.gain);lfo.start();
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;lp.Q.value=1.5;lp.connect(putt);
    const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=80;o1.connect(lp);
    const o2=ctx.createOscillator();o2.type='square';o2.frequency.value=80;o2.detune.value=6;const g2=ctx.createGain();g2.gain.value=0.3;o2.connect(g2);g2.connect(lp);
    o1.start();o2.start();
    this.engine={gain:eg,lp,o1,o2,lfo};
    // water rush: noise through a lowpass, swells with speed and in rapids
    const wg=ctx.createGain();wg.gain.value=0;wg.connect(this.master);
    const wf=ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=700;wf.connect(wg);
    const wn=ctx.createBufferSource();wn.buffer=buf;wn.loop=true;wn.connect(wf);wn.start();
    this.water={gain:wg,lp:wf};
    // hiss for spray / hard steering
    const sg=ctx.createGain();sg.gain.value=0;sg.connect(this.master);
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=0.8;bp.connect(sg);
    const ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;ns.connect(bp);ns.start();
    this.spray={gain:sg};
    this.ready=true;
  },
  resume(){if(this.ctx&&this.ctx.state!=='running')this.ctx.resume();},
  setMuted(m){this.muted=m;store.set('rr_muted',m);if(this.master)this.master.gain.setTargetAtTime(m?0:0.9,this.ctx.currentTime,0.02);},
  update(speedPct,throttle,boost,rapids,skidding,running,air){
    if(!this.ready)return;const t=this.ctx.currentTime,e=this.engine;
    const f=(70+speedPct*230)*(boost?1.25:1)*(air?1.35:1);
    e.o1.frequency.setTargetAtTime(f,t,0.05);e.o2.frequency.setTargetAtTime(f*1.004,t,0.05);e.lfo.frequency.setTargetAtTime(8+speedPct*40,t,0.1);
    e.lp.frequency.setTargetAtTime(350+speedPct*1500+(throttle?300:0),t,0.08);
    e.gain.gain.setTargetAtTime(running?(0.05+speedPct*0.08+(throttle?0.03:0)):0,t,0.06);
    const wv=running?(0.04+speedPct*0.14+(rapids?0.16:0)):0;
    this.water.gain.gain.setTargetAtTime(wv,t,0.12);this.water.lp.frequency.setTargetAtTime(500+speedPct*1200+(rapids?900:0),t,0.12);
    this.spray.gain.gain.setTargetAtTime(running&&skidding?0.07:0,t,0.05);
  },
  tone(freq,dur,type,vol,when,slideTo){
    if(!this.ready)return;const ctx=this.ctx,t=(when||0)+ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);
  },
  burst(dur,vol,fStart,fEnd,when,type){
    if(!this.ready)return;const ctx=this.ctx,t=(when||0)+ctx.currentTime;
    const s=ctx.createBufferSource();s.buffer=this.noise;const f=ctx.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fStart,t);f.frequency.exponentialRampToValueAtTime(fEnd,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.05);
  },
  splash(big){this.burst(big?0.6:0.35,big?0.7:0.4,3500,500);this.tone(220,0.15,'sine',0.25,0,90);},
  quack(){this.tone(520,0.12,'sawtooth',0.2,0,380);this.tone(470,0.14,'sawtooth',0.18,0.13,330);},
  fish(){this.tone(880,0.08,'triangle',0.2);this.tone(1320,0.14,'triangle',0.18,0.07);this.burst(0.2,0.25,2500,900,0.02);},
  boostPick(){this.tone(440,0.08,'square',0.15);this.tone(660,0.08,'square',0.15,0.08);this.tone(880,0.2,'square',0.15,0.16);},
  boostGo(){this.burst(0.9,0.35,400,4000);this.tone(180,0.8,'sawtooth',0.12,0,800);},
  jump(){this.burst(0.5,0.3,600,3500,0,'highpass');this.tone(300,0.45,'triangle',0.18,0,700);},
  crash(){this.burst(0.5,0.9,2500,200);this.tone(90,0.45,'sine',0.5,0,28);this.splash(true);},
  bump(){this.tone(300,0.18,'sine',0.35,0,120);this.burst(0.2,0.35,2000,400);},
  whirl(){this.tone(500,0.7,'sine',0.15,0,120);this.burst(0.6,0.3,1500,300);},
  horn(){this.tone(110,0.6,'sawtooth',0.28);this.tone(165,0.6,'square',0.18);this.tone(82,0.6,'sawtooth',0.12);},
  beep(go){if(go){this.tone(880,0.55,'square',0.25);this.tone(1320,0.55,'triangle',0.15);}else this.tone(440,0.18,'square',0.25);},
  fanfare(){const n=[523,659,784,1047,784,1047,1319];n.forEach((f,i)=>{this.tone(f,0.16,'square',0.18,i*0.11);this.tone(f/2,0.16,'triangle',0.1,i*0.11);});},
  cheer(){[784,988,1175,1568].forEach((f,i)=>this.tone(f,0.25,'triangle',0.2,i*0.09));this.tone(1568,0.6,'triangle',0.15,0.4);},
  click(){this.tone(900,0.05,'square',0.12);}
};

/* ===================== haptics ===================== */
const Haptics={
  enabled:store.get('rr_haptics',true),pad:null,
  vibrate(pattern){if(!this.enabled)return;try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}},
  rumble(strong,weak,ms){if(!this.enabled)return;const gp=this.pad;if(!gp)return;const act=gp.vibrationActuator||(gp.hapticActuators&&gp.hapticActuators[0]);
    try{if(act&&act.playEffect)act.playEffect('dual-rumble',{startDelay:0,duration:ms,strongMagnitude:strong,weakMagnitude:weak});else if(act&&act.pulse)act.pulse(Math.max(strong,weak),ms);}catch(e){}},

function circle(x,cx,cy,r,fill,ns){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function ellipse(x,cx,cy,rx,ry,fill,ns){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function rr(x,px,py,w,h,r,fill,ns){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function poly(x,pts,fill,ns){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function starPath(x,cx,cy,R,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}x.closePath();}

const SEG_LEN=200,RUMBLE=3,ROAD_W=2000,LANES=3,ZONE_SEGS=420;
const L={SHORT:25,MEDIUM:50,LONG:100},H={LOW:20,MEDIUM:40,HIGH:60};
let segments=[],trackLength=0,catchTotal=0,ZONE_BOUNDS=[];
const lastY=()=>segments.length?segments[segments.length-1].p2.world.y:0;
function addSegment(curve,y,zone){const n=segments.length;segments.push({index:n,zone,p1:{world:{x:0,y:lastY(),z:n*SEG_LEN},camera:{},screen:{}},p2:{world:{x:0,y:y,z:(n+1)*SEG_LEN},camera:{},screen:{}},curve,sprites:[],cars:[],alt:Math.floor(n/RUMBLE)%2===0,checker:false,rapids:false,seed:(n*7919)%97/97});}
function addRoad(enter,hold,leave,curve,y,zone){const sy=lastY(),ey=sy+y*SEG_LEN,total=enter+hold+leave;let n;
  for(n=0;n<enter;n++)addSegment(easeIn(0,curve,n/enter),easeInOut(sy,ey,n/total),zone);
  for(n=0;n<hold;n++)addSegment(curve,easeInOut(sy,ey,(enter+n)/total),zone);
  for(n=0;n<leave;n++)addSegment(easeInOut(curve,0,n/leave),easeInOut(sy,ey,(enter+hold+n)/total),zone);}
function genZone(zone,count,maxCurve,hillMax){const start=segments.length;
  while(segments.length-start<count){const r=Math.random(),s=Math.random()<0.5?-1:1;
    if(r<0.22)addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,pick([0,0,-H.LOW*0.5,-H.LOW*0.4]),zone);
    else if(r<0.55)addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,s*rnd(2,maxCurve),pick([0,-H.LOW,-H.LOW*0.5,0]),zone);
    else if(r<0.78){addRoad(L.SHORT,L.SHORT,L.SHORT,s*maxCurve,0,zone);addRoad(L.SHORT,L.SHORT,L.SHORT,-s*maxCurve,0,zone);}
    else addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,pick([-hillMax,-hillMax*0.6,hillMax*0.5]),zone);}
  addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,-lastY()/SEG_LEN,zone);
  ZONE_BOUNDS[zone]={start,end:segments.length};
}
function addDeco(n,name,offset){const seg=segments[n%segments.length];const spr=name==='sign'?pick(SPR.signs):SPR[name];seg.sprites.push({spr,offset,kind:'deco'});}

function buildTrack(mode){
  segments=[];const K=mode==='kid';
  for(let i=0;i<40;i++)addSegment(0,0,0);
  BIOMES.forEach((b,i)=>genZone(i,ZONE_SEGS-(i===0?40:0),K?4:6,K?H.MEDIUM:H.HIGH));

    for(const car of seg.cars){const sc=lerp(seg.p1.screen.scale,seg.p2.screen.scale,car.percent),sx=lerp(seg.p1.screen.x,seg.p2.screen.x,car.percent)+sc*car.offset*ROAD_W*W/2,sy=lerp(seg.p1.screen.y,seg.p2.screen.y,car.percent);drawSprite(W,car.spr,sc,sx,sy,-0.5,-1+0.02*Math.sin(G.time*3+car.z),seg.clip);}
    for(const s of seg.sprites){if(s.taken)continue;const sc=seg.p1.screen.scale,sx=seg.p1.screen.x+sc*s.offset*ROAD_W*W/2,sy=seg.p1.screen.y;
      if(s.kind==='deco')drawSprite(W,s.spr,sc,sx,sy,s.offset<0?-1:0,-1,seg.clip);
      else if(s.kind==='fish')drawSprite(W,s.spr,sc,sx,sy,-0.5,-0.9-1.1*Math.abs(Math.sin(G.time*2.6+seg.index*0.9)),seg.clip);
      else if(s.kind==='duck')drawSprite(W,s.spr,sc,sx,sy,-0.5,-0.95-0.08*Math.sin(G.time*4+seg.index),seg.clip);
      else if(s.kind==='boost')drawSprite(W,s.spr,sc*(1+0.08*Math.sin(G.time*5+seg.index)),sx,sy,-0.5,-1.3-0.2*Math.abs(Math.sin(G.time*4+seg.index*0.7)),seg.clip);

      else drawSprite(W,s.spr,sc,sx,sy,-0.5,-0.95,seg.clip);}
  }
  ctx.restore();
  ctx.save();if(G.shake>0&&!reducedMotion)ctx.translate(rnd(-1,1)*G.shake*1.5,rnd(-1,1)*G.shake);
  drawBoat(W,H);drawParticles();ctx.restore();
  drawEffects(W,H);
  if(G.state!=='title')drawGauge(W,H);

function updateParticles(dt){for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.life-=dt;if(p.life<=0){G.particles.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!=null)p.rot+=dt*6;}}

/* ===================== river traffic ===================== */
function resetCars(n){G.cars=[];segments.forEach(s=>s.cars.length=0);
  for(let i=0;i<n;i++){const r=Math.random(),spr=r<0.2?SPR.sail:r<0.4?SPR.jetski:pick(SPR.boats),z=rndi(60,segments.length-1)*SEG_LEN,speed=G.maxSpeed*(spr===SPR.jetski?rnd(0.4,0.6):spr===SPR.sail?rnd(0.15,0.25):rnd(0.22,0.4));
    const car={offset:pick([-0.6,-0.2,0.2,0.6]),z,spr,speed,percent:0};G.cars.push(car);findSegment(z).cars.push(car);}}
function carOffsetDelta(car,carSeg,playerSeg){const look=20,cw=car.spr.w*SPRITE_SCALE;let d=carSeg.index-playerSeg.index;if(d<0)d+=segments.length;if(d>CAM.drawDist)return 0;
  for(let i=1;i<look;i++){const seg=segments[(carSeg.index+i)%segments.length];
    if(seg===playerSeg&&G.state==='racing'&&car.speed>G.speed&&overlap(G.playerX,0.3,car.offset,cw,1.2)){const dir=G.playerX>0.5?-1:G.playerX<-0.5?1:(car.offset>G.playerX?1:-1);return dir/i*(car.speed-G.speed)/G.maxSpeed;}
    for(const o of seg.cars){const ow=o.spr.w*SPRITE_SCALE;if(car.speed>o.speed&&overlap(car.offset,cw,o.offset,ow,1.2)){const dir=o.offset>0.5?-1:o.offset<-0.5?1:(car.offset>o.offset?1:-1);return dir/i*(car.speed-o.speed)/G.maxSpeed;}}
    for(const s of seg.sprites){if((s.kind!=='hard'&&s.kind!=='soft')||s.taken)continue;const sw=s.spr.w*SPRITE_SCALE;if(overlap(car.offset,cw,s.offset,sw,1.2)){const dir=s.offset>0.5?-1:s.offset<-0.5?1:(car.offset>s.offset?1:-1);return dir/i*car.speed/G.maxSpeed;}}}
  if(car.offset<-0.9)return 0.1;if(car.offset>0.9)return -0.1;return 0;}
function updateCars(dt,playerSeg){for(const car of G.cars){const old=findSegment(car.z);car.offset+=carOffsetDelta(car,old,playerSeg);car.z=(car.z+dt*car.speed)%trackLength;car.percent=pct(car.z,SEG_LEN);const ns=findSegment(car.z);if(old!==ns){const i=old.cars.indexOf(car);if(i>=0)old.cars.splice(i,1);ns.cars.push(car);}}}

/* ===================== physics ===================== */
const accel=(v,a,dt)=>v+a*dt;
function update(dt){G.time+=dt;const K=G.mode==='kid',racing=G.state==='racing',playerSeg=findSegment(G.position+playerZ),speedPct=G.speed/G.maxSpeed;
  if(G.state==='paused'||G.state==='results'){Audio.update(speedPct,false,false,false,false,false,false);return;}
  let steer=0,gas=false,brake=false;
  if(racing){steer=clamp((keys.left?-1:0)+(keys.right?1:0)+pad.steer,-1,1);gas=keys.gas||pad.gas>0.1||(K&&G.autoGas);brake=keys.brake||pad.brake>0.1;if(brake)gas=false;}
  else if(G.state==='title'){steer=clamp(-G.playerX*2.5-playerSeg.curve*0.12,-1,1);gas=G.speed<G.maxSpeed*0.6;}
  if(G.slip>0){G.slip-=dt;steer*=-0.4;G.spin=(1-Math.max(0,G.slip)/0.8)*Math.PI*2;if(G.slip<=0){G.slip=0;G.spin=0;}}
  if(G.air>0)steer*=0.35;
  G.throttle=gas;G.braking=brake;G.steer=lerp(G.steer,steer,1-Math.pow(0.0005,dt));
  updateCars(dt,playerSeg);
  const startPos=G.position;G.position=(G.position+dt*G.speed)%trackLength;
  const dx=dt*2*speedPct*(K?0.85:1);G.playerX+=dx*G.steer;G.playerX-=dx*speedPct*playerSeg.curve*(K?0.15:0.3);
  if(K&&racing&&Math.abs(steer)<0.05)G.playerX=lerp(G.playerX,clamp(G.playerX,-0.7,0.7),1-Math.pow(0.15,dt));
  G.inRapids=!!playerSeg.rapids&&G.state!=='countdown';
  const top=G.maxSpeed*(G.boost>0?1.3:G.inRapids?1.12:1);
  if(G.boost>0){G.speed=accel(G.speed,G.maxSpeed*1.4,dt);G.boost-=dt;if(G.boost<0)G.boost=0;}
  else if(gas)G.speed=accel(G.speed,G.maxSpeed/(K?3.5:5),dt);else if(brake)G.speed=accel(G.speed,-G.maxSpeed*(K?0.9:1.1),dt);else G.speed=accel(G.speed,-G.maxSpeed/6,dt);
  if(G.inRapids){if(G.speed<G.maxSpeed*0.8)G.speed=accel(G.speed,G.maxSpeed*0.7,dt);G.playerX+=Math.sin(G.time*7)*dt*0.25;G.rapidTick+=dt;if(G.rapidTick>0.15){G.rapidTick=0;Haptics.rapids();if(!reducedMotion)spawn('foam',3);}}
  if(G.air>0){G.air-=dt;if(G.air<=0){G.air=0;land();}}
  const beached=Math.abs(G.playerX)>1;
  if(beached&&G.state!=='countdown'){if(G.speed>G.maxSpeed/4)G.speed=accel(G.speed,-G.maxSpeed/2,dt);G.bankTick+=dt;if(G.bankTick>0.1&&speedPct>0.1){G.bankTick=0;Haptics.bank();if(!reducedMotion)spawn('spray',3);}
    if(K&&racing)G.playerX=lerp(G.playerX,0,1-Math.pow(0.3,dt));
    if(racing)for(const s of playerSeg.sprites){if(s.kind!=='deco')continue;const sw=s.spr.w*SPRITE_SCALE;if(overlap(G.playerX,0.3,s.offset+sw/2*(s.offset>0?1:-1),sw)){crash('deco',s);break;}}}
  G.speed=clamp(G.speed,0,top);G.playerX=clamp(G.playerX,-2.6,2.6);
  if(racing){for(const s of playerSeg.sprites){if(s.taken||s.kind==='deco')continue;const sw=s.spr.w*SPRITE_SCALE;if(!overlap(G.playerX,0.3,s.offset,sw,0.8))continue;
      if(s.kind==='duck'){s.taken=true;collectDuck();}else if(s.kind==='fish'){s.taken=true;collectFish();}else if(s.kind==='boost'){s.taken=true;collectBoost();}
      else if(G.air>0)continue;else if(s.kind==='ramp')jump();else if(s.kind==='whirl')whirl();else if(s.kind==='soft')crash('soft',s);else crash('hard',s);}
    if(G.air<=0)for(const car of playerSeg.cars){const cw=car.spr.w*SPRITE_SCALE;if(G.speed>car.speed&&overlap(G.playerX,0.3,car.offset,cw,0.8))crash('car',car);}
    const ax=Math.abs(G.playerX);if(ax>0.84&&ax<=1.06&&speedPct>0.15){G.bankTick+=dt;if(G.bankTick>0.11){G.bankTick=0;Haptics.bank();Audio.burst(0.08,0.15,2500,600);if(!reducedMotion)spawn('spray',2);}}
    if(speedPct>0.3&&!reducedMotion){G.wakeTick+=dt;if(G.wakeTick>0.08){G.wakeTick=0;spawn('foam',G.inRapids?4:2);}}
    if(G.position<startPos&&startPos-G.position>trackLength*0.5)lapDone();G.lapTime+=dt;G.totalTime+=dt;}
  G.skidding=racing&&speedPct>0.45&&(Math.abs(G.steer)>0.85||(brake&&speedPct>0.35)||G.slip>0);
  if(G.crashTime>0)G.crashTime-=dt;if(G.hornTime>0)G.hornTime-=dt;G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*2.5);G.wobble*=Math.pow(0.03,dt);
  G.bounce=reducedMotion?0:(G.inRapids?5:beached?4:1.2)*speedPct*(Math.random()*2-1);
  G.speedKmh=lerp(G.speedKmh,speedPct*(K?90:220)*(G.boost>0?1.25:1),1-Math.pow(0.002,dt));
  G.skyOffset+=0.001*playerSeg.curve*speedPct*dt*60;G.hillOffset+=0.002*playerSeg.curve*speedPct*dt*60;
  G.clouds.forEach(c=>{c.x=(c.x+c.v*dt)%1;});updateParticles(dt);
  Audio.update(speedPct,gas,G.boost>0,G.inRapids,G.skidding,G.state!=='title',G.air>0);}

/* ===================== HUD ===================== */
const hudCache={};function setText(k,node,v){if(hudCache[k]!==v){hudCache[k]=v;node.textContent=v;}}
function updateHud(force){if(el.hud.hidden&&!force)return;setText('ducks',el.ducks,String(G.ducks));setText('fish',el.fish,String(G.fish));setText('lap',el.lapLabel,G.mode==='pro'?'Lap '+Math.min(G.lap,3)+' / 3':'Lap '+G.lap);setText('time',el.time,fmtTime(G.lapTime));
  const zn=G.curSeg?BIOMES[G.curSeg.zone].name:'';setText('bio',el.bio,zn);const td=G.turbo<=0||G.boost>0;if(hudCache.turbo!==td){hudCache.turbo=td;el.turbo.disabled=td;}}

/* ===================== loop ===================== */
let last=performance.now(),acc=0,frameNo=0;const STEP=1/60;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;pollPad();while(acc>=STEP){update(STEP);acc-=STEP;}render();updateHud();if(++frameNo%30===0)measurePads();requestAnimationFrame(frame);}
function init(){buildSprites();goTitle();requestAnimationFrame(frame);}
const fontsReady=document.fonts?Promise.all([document.fonts.load('42px Bangers'),document.fonts.load('900 20px Nunito')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(init);
})();
</script>
