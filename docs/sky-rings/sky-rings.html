<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Sky Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
:root{
  --ink:#1B1A2E;--cream:#FFF6E5;--amber:#FFB300;--coral:#FF4D3D;--sky:#3FA7F5;--teal:#1FC8C0;--teal2:#0E9E98;--violet:#6C4DFF;
  --display:'Bangers','Impact','Arial Black',sans-serif;--ui:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1B1A2E}
body{font-family:var(--ui);color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;background:#3FA7F5;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:8px}
.pill{background:rgba(27,26,46,.78);border:3px solid var(--cream);border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(16px,2.6vw,24px);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.rings{color:var(--amber)}
.pill.lap{color:var(--cream);flex-direction:column;gap:0;padding:4px 18px;line-height:1.1}
.pill.lap small{font-size:.6em;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
.hud-top .center{display:flex;flex-direction:column;align-items:center;gap:5px}
#bio{font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,246,229,.85);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.hud-btns button{width:46px;height:46px;border-radius:50%;background:rgba(27,26,46,.78);border:3px solid var(--cream);color:var(--cream);font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hud-btns button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);font-family:var(--display);font-size:clamp(36px,9vw,96px);color:var(--amber);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,179,0,.55);letter-spacing:.04em;opacity:0;transition:opacity .25s,transform .25s cubic-bezier(.2,1.6,.4,1);text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* joystick */
#stick{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:min(170px,40vw,42vh);height:min(170px,40vw,42vh);border-radius:50%;background:rgba(27,26,46,.55);border:4px solid var(--cream);box-shadow:0 6px 0 var(--ink);pointer-events:auto;touch-action:none}
#stick::before{content:'';position:absolute;inset:18%;border-radius:50%;border:2px dashed rgba(255,246,229,.35)}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;background:var(--teal);border:4px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none}
.pad{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.pad button{touch-action:none;color:var(--ink);font-family:var(--display);font-size:clamp(18px,3.4vw,28px);letter-spacing:.06em;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:50%;opacity:.94;display:flex;align-items:center;justify-content:center}
.pad button.down,.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.1)}
.pad button[data-k=brake]{width:min(96px,20vw,26vh);height:min(96px,20vw,26vh);background:var(--coral)}
.pad button[data-k=boost]{width:min(118px,25vw,30vh);height:min(118px,25vw,30vh);background:var(--violet);color:var(--cream)}
.pad button[data-k=boost][disabled]{opacity:.35;filter:grayscale(.6)}
.pad button[data-k=boost]:not([disabled]){animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(108,77,255,.6)}to{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(108,77,255,0)}}
body.no-touch .pad,body.no-touch #stick{display:none}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(27,26,46,.3),rgba(27,26,46,.8));overflow:auto}
.title-wrap{position:relative;padding:18px 40px}
.title-wrap::before{content:'';position:absolute;left:50%;top:50%;width:min(360px,70vw);height:min(360px,70vw);transform:translate(-50%,-50%);border-radius:50%;border:clamp(10px,2.4vw,22px) solid var(--amber);box-shadow:0 0 40px rgba(255,179,0,.45),inset 0 0 30px rgba(255,179,0,.35);opacity:.9}
.screen h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(60px,15vw,160px);line-height:.88;margin:0;color:var(--cream);-webkit-text-stroke:2px var(--ink);text-shadow:0 8px 0 var(--ink),0 0 40px rgba(31,200,192,.5);letter-spacing:.03em;transform:rotate(2deg);text-wrap:balance}
.screen h1 span{color:var(--teal)}
.screen h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,90px);margin:0;color:var(--cream);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);letter-spacing:.04em}
.tag{margin:0;font-weight:900;font-size:clamp(15px,2.4vw,20px);letter-spacing:.14em;text-transform:uppercase;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.mode{display:flex;flex-direction:column;gap:4px;align-items:center;width:min(280px,82vw);padding:16px 18px 20px;border-radius:26px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);color:var(--ink);transition:transform .08s}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.mode .big{font-family:var(--display);font-size:clamp(34px,6vw,46px);letter-spacing:.05em;line-height:1}
.mode small{font-weight:800;font-size:14px;line-height:1.3;opacity:.85}
.mode.kid{background:linear-gradient(180deg,#5FE3DB,#1FC8C0)}
.mode.pro{background:linear-gradient(180deg,#8C73FF,#6C4DFF);color:var(--cream)}
.mode.pro small{opacity:.9}
.opts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;background:rgba(27,26,46,.7);border:3px solid var(--cream);border-radius:999px;padding:8px 16px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--amber);margin:0}
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:13px;color:rgba(255,246,229,.85);margin-top:4px}
.keys kbd{font-family:var(--ui);background:var(--cream);color:var(--ink);border-radius:6px;padding:2px 7px;border-bottom:3px solid #b9ad99;font-weight:900}
#best{font-weight:900;color:var(--amber);letter-spacing:.06em;text-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:clamp(22px,4vw,32px);letter-spacing:.06em;padding:10px 28px;border-radius:18px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--amber);color:var(--ink)}
.btn.alt{background:var(--cream)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-weight:900;font-size:clamp(18px,3vw,26px);font-variant-numeric:tabular-nums;background:rgba(27,26,46,.72);border:3px solid var(--cream);border-radius:20px;padding:14px 26px;text-align:left}
.stat span:nth-child(odd){color:rgba(255,246,229,.7);letter-spacing:.1em;text-transform:uppercase;font-size:.7em;align-self:center}
.stat span:nth-child(even){color:var(--amber);text-align:right}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cdText{font-family:var(--display);font-size:clamp(120px,30vw,320px);color:var(--amber);-webkit-text-stroke:3px var(--ink);text-shadow:0 12px 0 var(--ink),0 0 60px rgba(255,179,0,.6);animation:cd .95s ease-out infinite}
@keyframes cd{0%{transform:scale(1.5);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){#cdText,.pad button[data-k=boost]{animation:none}}
@media (max-height:520px){.screen h1{font-size:clamp(44px,10vw,90px)}.mode{padding:10px 14px 14px}.keys{display:none}.title-wrap::before{display:none}}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="pill rings"><span aria-hidden="true">◎</span><span id="hudRings">0</span></div>
      <div class="center"><div class="pill lap"><small id="hudLapLabel">Lap 1</small><span id="hudTime">0:00.0</span></div><div id="bio">Sunny Meadow</div></div>
      <div class="hud-btns">
        <button id="btnMute" title="Sound on/off" aria-label="Sound on/off">🔊</button>
        <button id="btnPause" title="Pause" aria-label="Pause">⏸</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="stick" aria-label="Joystick: drag to steer and climb"><div id="knob">✈️</div></div>
    <div class="pad">
      <button data-k="brake" aria-label="Air brake">BRAKE</button>
      <button data-k="boost" id="btnBoost" disabled aria-label="Boost">BOOST</button>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="title-wrap"><h1>Sky<br><span>Rings</span></h1></div>
    <p class="tag">Fly · Climb · Thread the rings</p>
    <div class="modes">
      <button class="mode kid" data-mode="kid"><span class="big">Kid Sky</span><small>Big rings that pull you in, soft bumps, fly as long as you like</small></button>
      <button class="mode pro" data-mode="pro"><span class="big">Pro Sky</span><small>3 timed laps, small rings, wind gusts, spin-outs, best lap saved</small></button>
    </div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="optHaptics" checked> Haptics</label>
      <label class="toggle"><input type="checkbox" id="optInvert"> Invert climb (push down to climb)</label>
    </div>
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> steer</span><span><kbd>↑</kbd> climb</span><span><kbd>↓</kbd> dive</span><span><kbd>Space</kbd> air brake</span><span><kbd>Shift</kbd> boost</span><span><kbd>P</kbd> pause</span><span>🎮 gamepad works too</span>
    </div>
    <div id="best">Best lap: —</div>
  </div>

  <div id="pause" class="screen" hidden>
    <h2>Paused</h2>
    <div class="row"><button class="btn" id="btnResume">Keep Flying</button><button class="btn alt" id="btnQuit">Main Menu</button></div>
  </div>

  <div id="results" class="screen" hidden>
    <h2 id="resTitle">Flight Complete!</h2>
    <div class="stat" id="resStats"></div>
    <div class="row"><button class="btn" id="btnAgain">Fly Again</button><button class="btn alt" id="btnMenu">Main Menu</button></div>
  </div>

  <div id="countdown" hidden><span id="cdText">3</span></div>
</div>
<script>
(function(){
'use strict';
/* ===================== utilities ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const easeIn=(a,b,p)=>a+(b-a)*Math.pow(p,2);
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
const pct=(n,total)=>(n%total)/total;
const overlap=(x1,w1,x2,w2,p)=>{const h1=w1*(p||1)/2,h2=w2*(p||1)/2;return !((x1+h1)<(x2-h2)||(x1-h1)>(x2+h2));};
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mixHex=(a,b,t)=>{const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtTime=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);};
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== audio (all synthesized) ===================== */
const Audio={
  ctx:null,master:null,muted:store.get('sr_muted',false),ready:false,
  init(){
    if(this.ready)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=this.ctx=new AC();
    this.master=ctx.createGain();this.master.gain.value=this.muted?0:0.9;this.master.connect(ctx.destination);
    const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf;
    // propeller: saw + triangle through lowpass, chopped by an AM oscillator (blade beat)
    const pg=ctx.createGain();pg.gain.value=0;pg.connect(this.master);
    const am=ctx.createGain();am.gain.value=1;am.connect(pg);
    const lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=24;const lg=ctx.createGain();lg.gain.value=0.45;lfo.connect(lg);lg.connect(am.gain);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;lp.Q.value=1.5;lp.connect(am);
    const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=90;o1.connect(lp);
    const o2=ctx.createOscillator();o2.type='triangle';o2.frequency.value=180;const g2=ctx.createGain();g2.gain.value=0.5;o2.connect(g2);g2.connect(lp);
    o1.start();o2.start();lfo.start();this.prop={gain:pg,lp,o1,o2,lfo};
    // wind
    const wg=ctx.createGain();wg.gain.value=0;wg.connect(this.master);const wf=ctx.createBiquadFilter();wf.type='bandpass';wf.frequency.value=700;wf.Q.value=0.5;wf.connect(wg);
    const wn=ctx.createBufferSource();wn.buffer=buf;wn.loop=true;wn.connect(wf);wn.start();this.wind={gain:wg,bp:wf};
    this.ready=true;
  },
  resume(){if(this.ctx&&this.ctx.state!=='running')this.ctx.resume();},
  setMuted(m){this.muted=m;store.set('sr_muted',m);if(this.master)this.master.gain.setTargetAtTime(m?0:0.9,this.ctx.currentTime,0.02);},
  update(speedPct,brake,boost,cloud,running,gust){
    if(!this.ready)return;const t=this.ctx.currentTime,p=this.prop;
    const f=70+speedPct*110+(boost?50:0)-(brake?25:0);
    p.o1.frequency.setTargetAtTime(f,t,0.08);p.o2.frequency.setTargetAtTime(f*2.01,t,0.08);p.lfo.frequency.setTargetAtTime(14+speedPct*30+(boost?12:0),t,0.1);
    p.lp.frequency.setTargetAtTime(350+speedPct*1200+(boost?600:0),t,0.1);
    p.gain.gain.setTargetAtTime(running?(0.05+speedPct*0.08+(boost?0.03:0)):0,t,0.08);
    const w=running?(speedPct*speedPct*0.14+(boost?0.08:0)+(cloud?0.1:0)+(gust?0.12:0)+(brake?0.06:0)):0;
    this.wind.gain.gain.setTargetAtTime(w,t,0.12);this.wind.bp.frequency.setTargetAtTime(cloud?300:500+speedPct*1400+(gust?800:0),t,0.15);
  },
  tone(freq,dur,type,vol,when,slideTo){
    if(!this.ready)return;const ctx=this.ctx,t=(when||0)+ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);
  },
  burst(dur,vol,fStart,fEnd,when){
    if(!this.ready)return;const ctx=this.ctx,t=(when||0)+ctx.currentTime;const s=ctx.createBufferSource();s.buffer=this.noise;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(fStart,t);f.frequency.exponentialRampToValueAtTime(fEnd,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.05);
  },
  ring(combo){const scale=[523,587,659,784,880,1047,1175,1319,1568,1760];const f=scale[Math.min(combo,scale.length-1)];this.tone(f,0.35,'sine',0.25);this.tone(f*2,0.25,'sine',0.1,0.02);this.tone(f*3,0.18,'sine',0.05,0.04);},
  miss(){this.tone(220,0.2,'triangle',0.12,0,160);},
  boltPick(){this.tone(440,0.08,'square',0.15);this.tone(660,0.08,'square',0.15,0.08);this.tone(880,0.2,'square',0.15,0.16);},
  boostGo(){this.burst(1.1,0.35,500,5000);this.tone(220,1.0,'sawtooth',0.12,0,1100);},
  bump(){this.tone(320,0.18,'sine',0.35,0,120);this.burst(0.15,0.3,1200,300);},
  spin(){this.burst(0.6,0.6,3000,200);this.tone(700,0.9,'sawtooth',0.18,0,90);},
  cloud(){this.burst(0.5,0.25,800,200);},
  gust(){this.burst(1.6,0.3,300,2500);},
  beep(go){if(go){this.tone(880,0.55,'square',0.25);this.tone(1320,0.55,'triangle',0.15);}else this.tone(440,0.18,'square',0.25);},
  fanfare(){const n=[523,659,784,1047,784,1047,1319];n.forEach((f,i)=>{this.tone(f,0.16,'square',0.18,i*0.11);this.tone(f/2,0.16,'triangle',0.1,i*0.11);});},
  cheer(){[784,988,1175,1568].forEach((f,i)=>this.tone(f,0.25,'triangle',0.2,i*0.09));this.tone(1568,0.6,'triangle',0.15,0.4);},
  click(){this.tone(900,0.05,'square',0.12);}
};

/* ===================== haptics ===================== */
const Haptics={
  enabled:store.get('sr_haptics',true),pad:null,
  vibrate(pattern){if(!this.enabled)return;try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}},
  rumble(strong,weak,ms){if(!this.enabled)return;const gp=this.pad;if(!gp)return;const act=gp.vibrationActuator||(gp.hapticActuators&&gp.hapticActuators[0]);
    try{if(act&&act.playEffect)act.playEffect('dual-rumble',{startDelay:0,duration:ms,strongMagnitude:strong,weakMagnitude:weak});else if(act&&act.pulse)act.pulse(Math.max(strong,weak),ms);}catch(e){}},
  ring(){this.vibrate(14);this.rumble(0,0.35,60);},
  bump(){this.vibrate(45);this.rumble(0.6,0.4,140);},
  spin(){this.vibrate([60,40,120]);this.rumble(1,0.8,400);},
  boost(){this.vibrate([20,30,20,30,60]);this.rumble(0.5,1,500);},
  cloud(){this.vibrate([10,20,10]);this.rumble(0.2,0.3,200);},
  gust(){this.vibrate([15,30,15]);this.rumble(0.3,0.5,300);},
  go(){this.vibrate([30,60,30,60,90]);this.rumble(0.7,0.7,250);},
  lap(){this.vibrate([20,40,20,40,20]);this.rumble(0.4,0.8,300);}
};
/* ===================== sprite art ===================== */
const INK='#1B1A2E';
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.lineJoin='round';x.lineCap='round';x.strokeStyle=INK;x.lineWidth=3;fn(x,w,h);return {img:c,w,h};}
function circle(x,cx,cy,r,fill,ns){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}
function ellipse(x,cx,cy,rx,ry,fill,ns){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}

function poly(x,pts,fill,ns){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(!ns)x.stroke();}

const SEG_LEN=200,RUMBLE=3,ROAD_W=2000,ALT_RANGE=3000,ZONE_SEGS=420;

let segments=[],trackLength=0,ringTotal=0,ZONE_BOUNDS=[];
const lastY=()=>segments.length?segments[segments.length-1].p2.world.y:0;
function addSegment(curve,y,zone){const n=segments.length;segments.push({index:n,zone,p1:{world:{x:0,y:lastY(),z:n*SEG_LEN},camera:{},screen:{}},p2:{world:{x:0,y:y,z:(n+1)*SEG_LEN},camera:{},screen:{}},curve,sprites:[],air:[],rings:[],alt:Math.floor(n/RUMBLE)%2===0,checker:false});}
function addRoad(enter,hold,leave,curve,y,zone){const sy=lastY(),ey=sy+y*SEG_LEN,total=enter+hold+leave;let n;
  for(n=0;n<enter;n++)addSegment(easeIn(0,curve,n/enter),easeInOut(sy,ey,n/total),zone);
  for(n=0;n<hold;n++)addSegment(curve,easeInOut(sy,ey,(enter+n)/total),zone);
  for(n=0;n<leave;n++)addSegment(easeInOut(curve,0,n/leave),easeInOut(sy,ey,(enter+hold+n)/total),zone);}
function genZone(zone,count,maxCurve,hillMax){const start=segments.length;
  while(segments.length-start<count){const r=Math.random(),s=Math.random()<0.5?-1:1;
    if(r<0.22)addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,pick([0,0,H.LOW*0.5,-H.LOW*0.5]),zone);
    else if(r<0.55)addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,s*rnd(2,maxCurve),pick([0,H.LOW,-H.LOW,0]),zone);
    else if(r<0.78){addRoad(L.SHORT,L.SHORT,L.SHORT,s*maxCurve,0,zone);addRoad(L.SHORT,L.SHORT,L.SHORT,-s*maxCurve,0,zone);}
    else addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,pick([hillMax,-hillMax*0.6,hillMax*0.7]),zone);}
  addRoad(L.MEDIUM,L.MEDIUM,L.MEDIUM,0,-lastY()/SEG_LEN,zone);ZONE_BOUNDS[zone]={start,end:segments.length};}
function addDeco(n,name,offset){const seg=segments[n%segments.length];const spr=name==='sign'?pick(SPR.signs):SPR[name];seg.sprites.push({spr,offset});}

function buildTrack(mode){
  segments=[];ringTotal=0;const K=mode==='kid';
  for(let i=0;i<40;i++)addSegment(0,0,0);
  BIOMES.forEach((b,i)=>genZone(i,ZONE_SEGS-(i===0?40:0),K?4:6,K?H.MEDIUM:H.HIGH));
  trackLength=segments.length*SEG_LEN;segments[2].checker=segments[3].checker=segments[4].checker=true;
  for(let n=10;n<segments.length;n+=rndi(2,5)){const b=BIOMES[segments[n].zone];const s=Math.random()<0.5?-1:1;addDeco(n,pick(b.side),s*rnd(1.3,3.6));if(Math.random()<0.55)addDeco(n+1,pick(b.side),-s*rnd(1.3,3.6));if(Math.random()<0.12)addDeco(n+2,pick(b.side),s*rnd(3.8,6.5));}
  // rings: patterned groups
  const R=K?620:430,groups=K?26:24;
  for(let g=0;g<groups;g++){const n=rndi(30,segments.length-40),cnt=rndi(4,7),sp=K?7:6,pat=pick(['line','wave','slalom','climb','dive']),ox=rnd(-0.55,0.55),oa=rnd(0.25,0.7);

  // air obstacles and clouds
  const nb=K?12:22,nbird=K?10:20,nc=K?14:20;
  for(let i=0;i<nb;i++)addAir(rndi(80,segments.length-30),pick(SPR.balloons),rnd(-0.9,0.9),rnd(0.3,0.9),'balloon');
  for(let i=0;i<nbird;i++)addAir(rndi(80,segments.length-30),SPR.birds,rnd(-0.9,0.9),rnd(0.15,0.75),'bird');
  for(let i=0;i<nc;i++)addAir(rndi(60,segments.length-30),Math.random()<0.25?SPR.cloudDark:SPR.cloud,rnd(-0.9,0.9),rnd(0.45,1.0),'cloud');
  for(let i=0;i<3;i++)addAir(rndi(100,segments.length-60),SPR.blimp,pick([-1.6,1.6]),rnd(0.6,0.95),'deco');

}

function project(p,cameraX,cameraY,cameraZ,W,hy){p.camera.x=(p.world.x||0)-cameraX;p.camera.y=(p.world.y||0)-cameraY;p.camera.z=(p.world.z||0)-cameraZ;p.screen.scale=CAM.depth/p.camera.z;p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);p.screen.y=Math.round(hy-p.screen.scale*p.camera.y*W/2);p.screen.w=Math.round(p.screen.scale*ROAD_W*W/2);}

/* ===================== particles ===================== */
function spawn(kind,n){const g=planeGeom();for(let i=0;i<n;i++){let p;
  if(kind==='trail'){const side=i%2?1:-1;p={x:g.cx+side*g.w*0.48*Math.cos(G.steer*0.55),y:g.cy+side*g.w*0.48*Math.sin(-G.steer*0.55),vx:rnd(-10,10),vy:rnd(120,220),life:rnd(0.4,0.8),color:'rgba(255,255,255,1)',r:rnd(2,5),g:0,a:0.6};}
  else if(kind==='ringburst')p={x:g.cx+rnd(-g.w*0.2,g.w*0.2),y:g.cy-g.h*0.2,vx:rnd(-300,300),vy:rnd(-360,-60),life:rnd(0.5,0.9),color:pick(['#FFD24A','#FFF0B0','#FFB300']),r:rnd(6,12),g:600,star:true,rot:rnd(0,6)};
  else if(kind==='spark')p={x:g.cx+rnd(-g.w*0.4,g.w*0.4),y:g.cy,vx:rnd(-420,420),vy:rnd(-520,-80),life:rnd(0.3,0.8),color:pick(['#FFE066','#FF8A00','#FF4D3D','#FFFFFF']),r:rnd(2,6),g:900};
  else if(kind==='puff')p={x:g.cx+rnd(-g.w*0.5,g.w*0.5),y:g.cy+rnd(-g.h,g.h),vx:rnd(-120,120),vy:rnd(60,200),life:rnd(0.5,1),color:'#FFFFFF',r:rnd(10,26),g:0,a:0.7};
  else if(kind==='boost')p={x:g.cx+rnd(-g.w*0.1,g.w*0.1),y:g.cy+g.h*0.4,vx:rnd(-80,80),vy:rnd(150,320),life:rnd(0.3,0.7),color:pick(['#8C73FF','#B9A8FF','#FFFFFF']),r:rnd(4,9),g:0};
  else if(kind==='leaf')p={x:G.gustDir>0?-10:view.w+10,y:rnd(0,view.h),vx:G.gustDir*rnd(500,900),vy:rnd(-60,60),life:rnd(1,2),color:pick(['#62C24B','#E8893A','#FFD24A']),r:rnd(3,6),g:0};
  else p={x:rnd(0,view.w),y:rnd(-40,-5),vx:rnd(-60,60),vy:rnd(40,160),life:rnd(1.6,2.6),color:pick(['#FFD24A','#FF4D3D','#62C24B','#3FA7F5','#FF6AD5','#8C73FF']),r:rnd(4,8),g:140};
  p.max=p.life;G.particles.push(p);}if(G.particles.length>500)G.particles.splice(0,G.particles.length-500);}
function updateParticles(dt){for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.life-=dt;if(p.life<=0){G.particles.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!=null)p.rot+=dt*6;}}

/* ===================== events ===================== */
function useBoost(){if(G.state!=='racing'||G.boosts<=0||G.boost>0||G.spin>0)return;G.boosts--;G.boost=2.4;G.loop=0.001;Audio.boostGo();Haptics.boost();toast('LOOP THE LOOP!',1000);spawn('boost',30);G.flash=0.2;}
function ringHit(r){r.taken=true;G.rings++;G.ringsLap++;G.combo++;if(G.combo>G.bestCombo)G.bestCombo=G.combo;Audio.ring(G.combo-1);Haptics.ring();spawn('ringburst',10);
  if(G.combo===5)toast('COMBO ×5!',800);else if(G.combo===10)toast('AMAZING ×10!',900);else if(G.combo>10&&G.combo%5===0)toast('UNSTOPPABLE ×'+G.combo+'!',900);}
function ringMiss(r){r.missed=true;if(G.combo>=3)toast('Combo lost',600);G.combo=0;G.missed++;Audio.miss();}
function boltPick(a){a.taken=true;G.boosts=Math.min(3,G.boosts+1);Audio.boltPick();Haptics.ring();spawn('boost',20);toast(view.touch?'BOOST READY! Tap BOOST':'BOOST READY! Press Shift',1300);}
function cloudHit(a){if(G.cloudTime>0)return;G.cloudTime=1.2;G.fog=0.8;Audio.cloud();Haptics.cloud();spawn('puff',18);toast('Foggy!',700);}
function hit(a){if(G.hitTime>0)return;const K=G.mode==='kid';G.combo=0;G.boost=0;G.loop=0;
  if(K){G.hitTime=0.9;G.speed*=0.6;G.shake=7;G.wobble=(G.playerX>a.offset?1:-1)*2;Audio.bump();Haptics.bump();spawn('spark',12);toast(pick(['Boing!','Oops!','Whoa!']),800);a.taken=true;}
  else{G.hitTime=1.5;G.hits++;G.spin=1.3;G.spinAngle=0;G.shake=16;G.flash=0.5;Audio.spin();Haptics.spin();spawn('spark',30);toast('SPIN OUT!',900);}}
function startGust(){G.gust=2.5;G.gustDir=Math.random()<0.5?-1:1;G.gustNext=rnd(9,15);toast(G.gustDir>0?'WIND →':'← WIND',900);Audio.gust();Haptics.gust();if(!reducedMotion)spawn('leaf',24);}
function resetPickups(){segments.forEach(s=>{s.rings.forEach(r=>{r.taken=false;r.missed=false;});s.air.forEach(a=>a.taken=false);});}
function lapDone(){const lt=G.lapTime;G.laps.push(lt);if(!G.bestLapThis||lt<G.bestLapThis)G.bestLapThis=lt;G.lap++;G.lapTime=0;Haptics.lap();spawn('confetti',reducedMotion?0:90);
  if(G.mode==='pro'){const best=store.get('sr_best_pro',0);if(!best||lt<best){store.set('sr_best_pro',lt);toast('NEW BEST LAP '+fmtTime(lt)+'!',1600);Audio.fanfare();}else{toast('LAP '+fmtTime(lt),1200);Audio.cheer();}if(G.lap>3){finish();return;}}
  else{const br=store.get('sr_best_rings',0);if(G.ringsLap>br){store.set('sr_best_rings',G.ringsLap);toast('LAP DONE! '+G.ringsLap+' RINGS, NEW BEST! 🎉',1600);}else toast('LAP '+(G.lap-1)+' DONE! 🎉',1400);Audio.cheer();}
  G.ringsLap=0;resetPickups();}
function finish(){G.state='results';keepAwake(false);const best=store.get('sr_best_total',0);const nb=!best||G.totalTime<best;if(nb)store.set('sr_best_total',G.totalTime);
  el.resTitle.textContent=nb?'New Record!':'Flight Complete!';
  el.resStats.innerHTML=[['Total time',fmtTime(G.totalTime)],['Best lap',fmtTime(G.bestLapThis)],['Rings',G.rings+' / '+ringTotal*3],['Best combo','×'+G.bestCombo],['Spin-outs',G.hits]].map(([k,v])=>'<span>'+k+'</span><span>'+v+'</span>').join('');
  el.results.hidden=false;el.hud.hidden=true;Audio.fanfare();}

/* ===================== flow ===================== */
function resetGame(mode){G.mode=mode;const K=mode==='kid';buildTrack(mode);G.maxSpeed=SEG_LEN*60*(K?0.5:0.9);G.topSpeed=G.maxSpeed*1.35;
  Object.assign(G,{position:0,playerX:0,alt:0.45,speed:0,lap:1,lapTime:0,totalTime:0,laps:[],bestLapThis:0,rings:0,ringsLap:0,combo:0,bestCombo:0,boosts:0,boost:0,loop:0,spin:0,spinAngle:0,hits:0,missed:0,particles:[],hitTime:0,cloudTime:0,fog:0,gust:0,gustNext:rnd(8,12),wobble:0,shake:0,flash:0,steer:0,climb:0,pitch:0,speedKmh:0});}
function showBest(){const b=store.get('sr_best_pro',0),r=store.get('sr_best_rings',0);el.best.textContent=(b?'Best pro lap: '+fmtTime(b):'No pro lap yet')+' · '+(r?'Most rings in a lap: '+r:'No kid lap yet');}
function goTitle(){resetGame('kid');G.state='title';el.hud.hidden=true;el.pause.hidden=true;el.results.hidden=true;el.countdown.hidden=true;el.title.hidden=false;showBest();keepAwake(false);}
let cdTimer=0;
function startGame(mode){resetGame(mode);G.state='countdown';el.title.hidden=true;el.pause.hidden=true;el.results.hidden=true;el.hud.hidden=false;el.countdown.hidden=false;keepAwake(true);updateHud(true);
  clearTimeout(cdTimer);const steps=['3','2','1','GO!'];let i=0;const tick=()=>{if(G.state!=='countdown')return;el.cdText.textContent=steps[i];el.cdText.style.animation='none';void el.cdText.offsetWidth;el.cdText.style.animation='';
    if(i<3){Audio.beep(false);Haptics.vibrate(25);i++;cdTimer=setTimeout(tick,900);}else{Audio.beep(true);Haptics.go();G.state='racing';cdTimer=setTimeout(()=>{el.countdown.hidden=true;},800);}};tick();}
function togglePause(){if(G.state==='racing'){G.state='paused';el.pause.hidden=false;keepAwake(false);}else if(G.state==='paused'){G.state='racing';el.pause.hidden=true;keepAwake(true);}}

/* ===================== physics ===================== */
function nearestRing(maxAhead){const base=findSegment(G.position+playerZ).index;for(let n=1;n<=maxAhead;n++){const seg=segments[(base+n)%segments.length];for(const r of seg.rings)if(!r.taken&&!r.missed)return {r,n};}return null;}
function update(dt){G.time+=dt;const K=G.mode==='kid',racing=G.state==='racing',playerSeg=findSegment(G.position+playerZ),speedPct=G.speed/G.maxSpeed;
  if(G.state==='paused'||G.state==='results'){Audio.update(speedPct,false,false,false,false,false);return;}
  const inv=el.invert.checked?-1:1;let steer=0,climb=0,brake=false;
  if(racing){steer=clamp((keys.left?-1:0)+(keys.right?1:0)+pad.steer+stick.x,-1,1);climb=clamp(((keys.up?1:0)-(keys.down?1:0))*inv+pad.climb*inv-stick.y*inv,-1,1);brake=keys.brake||pad.brake>0.1;}
  if(G.spin>0){steer=0;climb=0;}
  // autopilot for the title screen, and the kid-mode ring magnet
  const near=nearestRing(racing?12:20);
  if(near&&(G.state==='title'||(K&&racing))){const dx=near.r.offset-G.playerX,da=near.r.alt-G.alt,close=1-near.n/(racing?12:20);
    if(G.state==='title'){steer=clamp(dx*4,-1,1);climb=clamp(da*6,-1,1);}
    else if(Math.abs(dx)<0.7&&Math.abs(da)<0.4&&near.n<=10){G.playerX+=dx*dt*2.4*close;G.alt+=da*dt*2.4*close;}}
  if(K&&racing&&Math.abs(steer)<0.05&&G.spin<=0)G.playerX=lerp(G.playerX,0,1-Math.pow(0.55,dt));
  if(G.state==='title'){G.speed=lerp(G.speed,G.maxSpeed*0.55,1-Math.pow(0.1,dt));}
  G.braking=brake;G.steer=lerp(G.steer,steer,1-Math.pow(0.0005,dt));G.climb=lerp(G.climb,climb,1-Math.pow(0.0008,dt));G.pitch=lerp(G.pitch,climb,1-Math.pow(0.02,dt));
  const oldPos=G.position;G.position=(G.position+dt*G.speed)%trackLength;
  G.playerX+=dt*1.7*G.steer*(0.5+0.5*speedPct);G.playerX-=dt*speedPct*speedPct*playerSeg.curve*(K?0.06:0.12);
  if(G.gust>0){G.playerX+=G.gustDir*dt*0.45;G.gust-=dt;G.wobble=G.gustDir*0.8;}
  G.alt+=dt*(K?0.42:0.5)*G.climb;if(G.spin>0)G.alt-=dt*0.2;
  if(G.alt<0.04){G.alt=0.04;if(racing&&G.climb<0&&G.lowTime<=0){G.lowTime=2;toast('Too low! Pull up!',900);Haptics.bump();G.shake=4;}}
  G.lowTime=(G.lowTime||0)-dt;G.alt=clamp(G.alt,0.04,1);G.playerX=clamp(G.playerX,K?-1.25:-1.7,K?1.25:1.7);
  // speed
  if(racing){let target=G.maxSpeed;if(brake)target*=0.45;if(G.cloudTime>0)target*=K?0.8:0.65;if(G.spin>0)target*=0.4;if(G.boost>0)target=G.maxSpeed*1.35;
    const rate=G.speed<target?(G.boost>0?G.maxSpeed*1.5:G.maxSpeed/2.5):G.maxSpeed*1.2;G.speed=G.speed<target?Math.min(target,G.speed+rate*dt):Math.max(target,G.speed-rate*dt);}
  if(G.boost>0){G.boost-=dt;if(G.boost<0)G.boost=0;}if(G.loop>0){G.loop+=dt/1.1;if(G.loop>=1)G.loop=0;}
  if(G.spin>0){G.spin-=dt;G.spinAngle+=dt*11;if(G.spin<=0){G.spin=0;G.spinAngle=0;}}
  if(G.cloudTime>0)G.cloudTime-=dt;G.fog=Math.max(0,G.fog-dt*1.6);
  // rings and air objects on every segment passed this step
  if(racing){const a=findSegment(oldPos+playerZ).index,b=findSegment(G.position+playerZ).index;let n=a;const steps=((b-a)%segments.length+segments.length)%segments.length;
    for(let i=0;i<=steps;i++){const seg=segments[(a+i)%segments.length];if(seg===findSegment(oldPos+playerZ)&&i===0&&steps>0){}
      for(const r of seg.rings){if(r.taken||r.missed)continue;const rx=r.r/ROAD_W*(K?1.1:0.95),ra=r.r/ALT_RANGE*(K?1.1:0.95);if(Math.abs(G.playerX-r.offset)<rx&&Math.abs(G.alt-r.alt)<ra)ringHit(r);else ringMiss(r);}
      for(const o of seg.air){if(o.taken||o.kind==='deco')continue;const hx=(o.w*0.8+0.3)/2,ha=(o.h*0.8+0.1)/2;if(Math.abs(G.playerX-o.offset)<hx&&Math.abs(G.alt-o.alt)<ha){if(o.kind==='bolt')boltPick(o);else if(o.kind==='cloud')cloudHit(o);else hit(o);}}}
    if(G.position<oldPos&&oldPos-G.position>trackLength/2)lapDone();if(G.state==='racing'){G.lapTime+=dt;G.totalTime+=dt;}
    if(!K){G.gustNext-=dt;if(G.gustNext<=0&&G.gust<=0)startGust();}}
  if(G.hitTime>0)G.hitTime-=dt;G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*2.5);G.wobble*=Math.pow(0.03,dt);
  G.speedKmh=lerp(G.speedKmh,speedPct*(K?180:420),1-Math.pow(0.002,dt));
  G.skyOffset+=0.001*playerSeg.curve*speedPct*dt*60;G.hillOffset+=0.002*playerSeg.curve*speedPct*dt*60;G.clouds.forEach(c=>{c.x=(c.x+c.v*dt)%1;});
  if(!reducedMotion&&speedPct>0.3&&G.state!=='countdown'&&Math.random()<speedPct*0.8)spawn('trail',2);updateParticles(dt);
  Audio.update(speedPct,brake,G.boost>0,G.cloudTime>0,G.state!=='title',G.gust>0);}

/* ===================== HUD + loop ===================== */
const hudCache={};function setText(k,node,v){if(hudCache[k]!==v){hudCache[k]=v;node.textContent=v;}}
function updateHud(force){if(el.hud.hidden&&!force)return;setText('rings',el.rings,String(G.rings));setText('lap',el.lapLabel,G.mode==='pro'?'Lap '+Math.min(G.lap,3)+' / 3':'Lap '+G.lap);setText('time',el.time,fmtTime(G.lapTime));
  setText('bio',el.bio,G.curSeg?BIOMES[G.curSeg.zone].name:'');const bd=G.boosts<=0||G.boost>0||G.spin>0;if(hudCache.boost!==bd){hudCache.boost=bd;el.boost.disabled=bd;}}
let last=performance.now(),acc=0;const STEP=1/60;
const raf=cb=>window.requestAnimationFrame(cb);
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;pollPad();while(acc>=STEP){update(STEP);acc-=STEP;}render();updateHud();raf(frame);}
function init(){buildSprites();goTitle();raf(frame);}
const fontsReady=document.fonts?Promise.all([document.fonts.load('42px Bangers'),document.fonts.load('900 20px Nunito')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(init);
})();
</script>
