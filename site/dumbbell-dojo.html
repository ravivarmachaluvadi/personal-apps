<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Dumbbell Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EEF0F3; --surface:#FFFFFF; --panel:#F6F7F9; --ink:#171B21; --muted:#5A6472;
    --text:var(--ink); --surface-2:var(--panel); /* names the shared Drive sign-in widget reads */
    --line:#D8DDE3; --accent:#E8590C; --accent-ink:#FFFFFF; --good:#237032;
    --text-mix:62%; /* how much of a day colour survives when used as small text (darkened on light grounds) */
    --push:#E8590C; --pull:#1971C2; --legs:#2F9E44; --restc:#868E96;
    --shoul:#E8A20C; --arms:#9C36B5; --core:#0C8599;
    --fig:#2A313A; --fig-faint:#B9C1CA; --focusring:#1971C2; --care:#C2255C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101317; --surface:#191E24; --panel:#14181D; --ink:#E6EAEE; --muted:#98A2AE;
      --line:#2A313A; --accent:#FF7A33; --accent-ink:#14181D; --good:#51CF66; --text-mix:100%;
      --push:#FF7A33; --pull:#4DABF7; --legs:#69DB7C; --restc:#6C757D;
      --shoul:#FFC078; --arms:#DA77F2; --core:#3BC9DB;
      --fig:#D3DAE1; --fig-faint:#49525C; --focusring:#4DABF7; --care:#F783AC;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101317; --surface:#191E24; --panel:#14181D; --ink:#E6EAEE; --muted:#98A2AE;
    --line:#2A313A; --accent:#FF7A33; --accent-ink:#14181D; --good:#51CF66; --text-mix:100%;
    --push:#FF7A33; --pull:#4DABF7; --legs:#69DB7C; --restc:#6C757D;
    --shoul:#FFC078; --arms:#DA77F2; --core:#3BC9DB;
    --fig:#D3DAE1; --fig-faint:#49525C; --focusring:#4DABF7; --care:#F783AC;
  }
  html{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px; line-height:1.55; margin:0; padding:0 16px 120px;
  }
  .wrap{max-width:900px; margin:0 auto}
  a{color:var(--pull)}
  button{font-family:inherit}
  :is(button,a,input):focus-visible{outline:3px solid var(--focusring); outline-offset:2px; border-radius:4px}

  header{padding:26px 0 14px; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
  .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:34px;
    letter-spacing:.04em; text-transform:uppercase; line-height:1}
  .brand .db{color:var(--accent)}
  .tagline{color:var(--muted); font-size:14px; letter-spacing:.02em}
  nav{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 18px}
  .tab{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 18px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

  .strip{display:flex; gap:6px; margin:0 0 20px; overflow-x:auto; padding:6px 2px 8px}
  .daychip{flex:1 0 76px; border:1px solid var(--line); background:var(--surface); border-radius:8px;
    padding:8px 10px; text-align:left; cursor:pointer; min-width:76px}
  .daychip .d{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:6px}
  .daychip .w{font-size:12.5px; color:var(--muted)}
  .daychip .dot{width:8px; height:8px; border-radius:50%; background:var(--tc,var(--restc)); flex:none}
  .daychip.today{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink)}
  .daychip.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .daychip .done{color:var(--good); font-weight:700}

  .dayhead{margin:4px 0 16px}
  .dayhead h1{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; font-size:42px; margin:0; line-height:1.05; text-wrap:balance}
  .dayhead h1 .accent{color:var(--tc,var(--accent)); color:color-mix(in srgb, var(--tc,var(--accent)) var(--text-mix), var(--ink))}
  .dayhead .sub{color:var(--muted); font-size:15px; margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .todaypill{background:var(--ink); color:var(--bg); font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:999px; letter-spacing:.04em; text-transform:uppercase}
  .jumpbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:4px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer}
  .jumpbtn:hover{border-color:var(--accent); color:var(--accent)}
  .resetbtn{border:none; background:none; color:var(--pull); text-decoration:underline;
    font-size:13.5px; cursor:pointer; padding:0; font-family:inherit}
  .banner{display:none; margin:0 0 16px; padding:12px 16px; border-radius:8px;
    background:var(--good); color:var(--accent-ink); font-weight:600}
  .banner.show{display:block}

  .warm{background:var(--surface); border:1px dashed var(--line); border-radius:10px;
    padding:14px 18px; margin:0 0 22px}
  .warm h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em;
    font-size:17px; margin:0 0 6px; font-weight:700}
  .warm ol{margin:0; padding-left:20px; color:var(--muted); font-size:14.5px}
  .warm li{margin:2px 0}

  .exlist{display:flex; flex-direction:column; gap:14px}
  .ex-card{background:var(--surface); border:1px solid var(--line); border-radius:10px;
    display:grid; grid-template-columns:230px 1fr; overflow:hidden}
  .anim-box{background:var(--panel); border-right:1px solid var(--line); position:relative;
    display:flex; align-items:center; justify-content:center; min-height:210px}
  .anim-box canvas{width:100%; max-width:230px; height:auto; display:block; cursor:grab; touch-action:none}
  .anim-box canvas:active{cursor:grabbing}
  .anim-box .hint{position:absolute; bottom:6px; left:10px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--muted); letter-spacing:.04em; pointer-events:none}
  .vbtns{position:absolute; top:6px; right:6px; display:flex; gap:4px}
  .vbtns button{border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 8px; border-radius:6px; cursor:pointer}
  .vbtns button:hover{color:var(--accent); border-color:var(--accent)}
  .ex-body{padding:14px 18px 16px}
  .ex-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .ex-num{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted)}
  .ex-name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px;
    text-transform:uppercase; letter-spacing:.02em; margin:0}
  .chip{font-size:12px; font-weight:600; letter-spacing:.03em; padding:2px 9px; border-radius:999px;
    background:var(--panel); color:var(--muted); border:1px solid var(--line);
    background:color-mix(in srgb, var(--tc,var(--muted)) 14%, transparent);
    color:color-mix(in srgb, var(--tc,var(--muted)) var(--text-mix), var(--ink));
    border-color:color-mix(in srgb, var(--tc,var(--muted)) 35%, transparent)}
  .rx{display:flex; gap:18px; flex-wrap:wrap; margin:8px 0 10px;
    font-family:'IBM Plex Mono',monospace; font-size:14px; font-variant-numeric:tabular-nums}
  .rx b{font-weight:600}
  .rx .lbl{color:var(--muted); font-size:11px; display:block; letter-spacing:.05em; text-transform:uppercase; font-family:'Barlow',sans-serif}
  .cues{margin:0 0 8px; padding-left:20px; font-size:14.5px}
  .cues li{margin:3px 0}
  .avoid{font-size:13.5px; color:var(--muted); margin:0 0 12px}
  .avoid b{color:var(--accent); color:color-mix(in srgb, var(--accent) var(--text-mix), var(--ink)); font-weight:700}
  .ex-actions{display:flex; gap:6px 16px; align-items:center; flex-wrap:wrap}
  .donebtn{border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 16px; border-radius:8px; font-size:14.5px; font-weight:600; cursor:pointer}
  .donebtn[aria-pressed="true"]{background:var(--good); border-color:var(--good); color:var(--accent-ink)}
  .vidlink{font-size:14px; font-weight:500}
  .opt-tag{font-size:12px; color:var(--muted); font-style:italic}
  .rmbtn{border:1px dashed var(--line); background:transparent; color:var(--muted);
    padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; margin-left:auto; align-self:center}
  .rmbtn:hover{color:var(--accent); border-color:var(--accent)}
  /* muscle map: front + back body, solid = main muscles, faded = helpers */
  .mmap{display:flex; align-items:center; gap:10px; margin:8px 0 10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--panel); max-width:100%}
  .mm-fig{display:flex; flex-direction:column; align-items:center; flex:none; gap:2px}
  .mm-fig svg{width:40px; height:88px; display:block}
  .mm-k{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .mm-t{font-size:13.5px; line-height:1.35; min-width:0}
  .mm-t b{display:block; font-weight:700; color:var(--tc,var(--ink)); color:color-mix(in srgb, var(--tc,var(--ink)) var(--text-mix), var(--ink))}
  .mm-t span{color:var(--muted); font-size:13px}
  .mmr{fill:var(--fig-faint); opacity:.55}
  .mmr.p{fill:var(--tc,var(--accent)); opacity:1}
  .mmr.s{fill:var(--tc,var(--accent)); opacity:.42}
  .dayhead.withmap{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .dayhead.withmap .dh-t{flex:1 1 280px; min-width:0}
  .dayhead.withmap .mmap{margin:0}
  .mm-mini{display:inline-flex; gap:3px; margin-left:auto; vertical-align:middle}
  .mm-mini svg{width:16px; height:35px}
  /* ---- plan bar, ordinals, flare-up, summary, toast ---- */
  .planbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:0 0 10px; font-size:13px; color:var(--muted)}
  .planbar .lab{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-right:2px}
  .pbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:5px 11px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer}
  .pbtn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); color:color-mix(in srgb, var(--accent) var(--text-mix), var(--ink)); box-shadow:0 0 0 1px var(--accent)}
  .pbtn.more{border-style:dashed; color:var(--muted); font-weight:500}
  .daychip .w small{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-left:3px}
  .daychip:focus-visible{outline:3px solid var(--focusring); outline-offset:2px}
  .ord{display:block; width:100%; font-size:13.5px; color:var(--muted)}
  .ord b{color:var(--ink); font-weight:600}
  .flarebtn{border:1.5px solid var(--care); background:transparent; color:var(--care); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer}
  .flarebtn:hover{background:color-mix(in srgb, var(--care) 10%, transparent)}
  .summary{display:none; margin:14px 0 0; padding:14px 18px; border-radius:8px; background:var(--good); color:var(--accent-ink); font-weight:600}
  .summary.show{display:flex; gap:8px 18px; flex-wrap:wrap; align-items:baseline}
  .summary span{font-weight:500; font-family:'IBM Plex Mono',monospace; font-size:13px; opacity:.95}
  .toast{position:fixed; left:50%; bottom:calc(var(--barh,70px) + 14px); transform:translate(-50%,20px); opacity:0; pointer-events:none;
    background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:14px; display:flex; gap:12px; align-items:center;
    box-shadow:0 8px 24px rgba(0,0,0,.25); transition:opacity .2s, transform .2s; z-index:30; max-width:calc(100% - 32px)}
  .toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto}
  .toast button{border:1px solid currentColor; background:transparent; color:inherit; padding:4px 10px; border-radius:6px; font-weight:700; cursor:pointer}
  /* ---- compact Today cards ---- */
  .ex-card.compact{grid-template-columns:1fr}
  .ex-card.compact .ex-body{padding:12px 16px 12px}
  .more{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
  .more summary{cursor:pointer; font-weight:600; color:var(--pull); list-style:none; display:inline-flex; gap:8px; align-items:center; font-size:14px}
  .more summary::-webkit-details-marker{display:none}
  .more summary::before{content:'+'; font-family:'IBM Plex Mono',monospace; font-size:16px; line-height:1}
  .more[open] summary::before{content:'–'}
  .more-in{display:grid; grid-template-columns:230px 1fr; gap:14px; margin-top:10px}
  .more-in .anim-box{border:1px solid var(--line); border-radius:8px; min-height:214px}
  .how-text .cues{margin-top:0}
  @media (max-width:660px){ .more-in{grid-template-columns:1fr} .more-in .anim-box{max-width:260px} }
  details.warm summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px}
  details.warm summary::-webkit-details-marker{display:none}
  details.warm summary h2{margin:0}
  details.warm summary::after{content:'show'; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-left:auto}
  details.warm[open] summary::after{content:'hide'}
  details.warm[open] summary{margin-bottom:6px}
  details.pickwrap{margin-top:20px}
  details.pickwrap > summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:8px; border:1px dashed var(--line);
    background:var(--surface); padding:10px 16px; border-radius:10px; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:17px; font-weight:700}
  details.pickwrap > summary::-webkit-details-marker{display:none}
  details.pickwrap > summary::before{content:'+'; font-family:'IBM Plex Mono',monospace; color:var(--accent)}
  details.pickwrap[open] > summary::before{content:'–'}
  details.pickwrap .picker{margin-top:8px}
  .loghint{color:var(--good); font-size:12.5px; font-weight:600; width:100%}
  .loghist{width:100%; font-size:12.5px}
  .loghist summary{cursor:pointer; color:var(--muted); list-style:none; display:inline-flex; gap:4px}
  .loghist summary::-webkit-details-marker{display:none}
  .loghist summary::before{content:'▸ '}
  .loghist[open] summary::before{content:'▾ '}
  .loghist ul{margin:4px 0 0; padding-left:16px; font-family:'IBM Plex Mono',monospace}
  .loghist li span{color:var(--muted); margin-left:6px}
  .swapbtn{border:1px dashed var(--line); background:transparent; color:var(--muted); padding:6px 10px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer}
  .swapbtn:hover{color:var(--accent); border-color:var(--accent)}
  .swapsel{font-family:inherit; font-size:13.5px; padding:6px 8px; border-radius:8px; border:1.5px solid var(--accent); background:var(--surface); color:var(--ink); max-width:100%}
  .rmbtn{padding:6px 12px; min-height:28px}
  .vbtns button{padding:5px 9px; min-height:26px; font-size:11.5px}
  .jumpbtn,.resetbtn{padding:6px 12px}
  .wk-card{cursor:pointer}
  .wkgo{background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left}
  .wkgo:focus-visible{outline:3px solid var(--focusring); outline-offset:3px; border-radius:3px}
  .wk-card .wkdone{color:var(--good)}
  .wk-card .added{color:var(--accent); font-weight:700}
  .wk-card .edited{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:6px}
  .sr{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
  .tclock{font:600 12.5px 'IBM Plex Mono',monospace; color:var(--accent); color:color-mix(in srgb, var(--accent) var(--text-mix), var(--ink)); text-decoration:underline dotted; text-underline-offset:3px}
  .tbtn.gear{padding:8px 10px}
  .timerbar.typing{display:none!important}
  /* ---- Do & Don't tab ---- */
  .dd-h{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; font-size:24px; letter-spacing:.04em; margin:28px 0 8px}
  .dd-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 16px}
  .dd-t{grid-column:1/-1; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:17px; font-weight:700; margin:4px 0 0}
  .dd-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; gap:14px; align-items:center}
  .dd-card.do{border-color:var(--good); border-color:color-mix(in srgb, var(--good) 50%, var(--line))}
  .dd-card.dont{border-color:var(--care); border-color:color-mix(in srgb, var(--care) 50%, var(--line))}
  .dd-card svg,.dd-glyph{width:36%; max-width:132px; flex:none}
  .dd-glyph{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px; text-align:center; padding:22px 6px; border-radius:8px; background:var(--panel); line-height:1.15}
  .dd-glyph.do{color:var(--good)} .dd-glyph.dont{color:var(--care)}
  .dd-txt{font-size:14.5px; min-width:0}
  .dd-txt b{display:inline-block; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; padding:1px 9px; border-radius:999px; margin-right:6px; font-size:13.5px}
  .do .dd-txt b{background:var(--good); color:var(--accent-ink)} .dont .dd-txt b{background:var(--care); color:var(--accent-ink)}
  .dd-txt span{display:block; color:var(--muted); font-size:13px; margin-top:5px}
  @media (max-width:560px){ .dd-pair{grid-template-columns:1fr} }
  .ddfig{display:block; height:auto; background:var(--panel); border-radius:8px}
  .ddfig .body{fill:none; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round}
  .ddfig .body circle{fill:var(--panel)}
  .ddfig .floor{stroke:var(--line); stroke-width:1.5}
  .ddfig .prop{fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .ddfig .propfill{fill:var(--fig-faint); stroke:none}
  .ddfig .db{fill:var(--accent); stroke:none}
  .ddfig .mark{fill:none; stroke:var(--care); stroke-width:2; stroke-dasharray:3 2}
  .ddfig text{font:600 14px 'IBM Plex Mono',monospace; fill:var(--muted)}

  .restcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px 24px}
  .restcard h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; font-size:26px; margin:0 0 8px}
  .restcard p{margin:6px 0; max-width:62ch}
  .restcard ul{padding-left:20px}

  .modegroup{display:flex; gap:8px; margin:0 0 18px; flex-wrap:wrap; align-items:center}
  .modegroup .lab{font-size:14px; color:var(--muted); margin-right:4px}
  .modebtn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14.5px; font-weight:600}
  .modebtn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .weekgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
  .wk-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer}
  .wk-card:hover{border-color:var(--tc,var(--accent))}
  .wk-card h3{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; font-size:19px;
    margin:0; display:flex; align-items:center; gap:8px; letter-spacing:.04em}
  .wk-card .dot{width:9px;height:9px;border-radius:50%;background:var(--tc,var(--restc));flex:none}
  .wk-card .focus{color:var(--muted); font-size:13px; margin:2px 0 8px}
  .wk-card ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--muted)}
  .wk-card li{margin:1px 0}
  .wk-card.today{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink)}
  .wk-note{color:var(--muted); font-size:14px; margin:14px 0 0; max-width:65ch}

  .picker{background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:16px 18px 18px; margin-top:20px}
  .picker h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em;
    font-size:19px; margin:0 0 4px; font-weight:700}
  .picker .gsub{color:var(--muted); font-size:14px; margin:2px 0 14px}
  .pickerchips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px}

<script>
'use strict';
/* ============================================================
   3D pose model.
   World: y up, x = figure's right/left axis, z = the direction
   the figure faces. Poses are direction vectors per limb segment
   (normalized to fixed bone lengths), so figures stay in
   proportion. Shorthand fields (ua, fa, th, sh, ft) apply to the
   RIGHT side and are mirrored (x negated) for the left; uaL,
   faR, etc. override individual limbs.
   ============================================================ */
const LEN = {torso:38, headOff:13, headR:8.5, shw:11, hipw:7, uarm:20, farm:22, thigh:28, shin:28, foot:10};
const DEF = {ua:[0.12,-1,0.03], fa:[0.05,-1,0.05], th:[0.08,-1,0], sh:[0,-1,0.02], ft:[0,-0.35,1]};

function n3(v){const m=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/m,v[1]/m,v[2]/m];}
function add3(a,d,s){return [a[0]+d[0]*s, a[1]+d[1]*s, a[2]+d[2]*s];}
function mid3(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];}
function rotAxis(v,k,a){ // rotate v around unit axis k by angle a (Rodrigues)
  const c=Math.cos(a), s=Math.sin(a), d=k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
  return [
    v[0]*c + (k[1]*v[2]-k[2]*v[1])*s + k[0]*d*(1-c),
    v[1]*c + (k[2]*v[0]-k[0]*v[2])*s + k[1]*d*(1-c),
    v[2]*c + (k[0]*v[1]-k[1]*v[0])*s + k[2]*d*(1-c)
  ];
}
function expandSpec(s){
  const q = {hip:s.hip, torso:s.torso||[0,1,0], twist:s.twist||0, shrug:s.shrug||0,
             shoulderAxis:s.shoulderAxis||null, hipAxis:s.hipAxis||null};
  for(const part of ['ua','fa','th','sh','ft']){
    const base = s[part] || DEF[part];
    q[part+'R'] = s[part+'R'] || base.slice();
    q[part+'L'] = s[part+'L'] || [-base[0], base[1], base[2]];
  }
  return q;
}
function buildPose(spec, bell, bellAxis){
  const q = expandSpec(spec);
  const td = n3(q.torso), hip = q.hip;
  const neck = add3(hip, td, LEN.torso);
  const head = add3(neck, td, LEN.headOff);
  let sax = q.shoulderAxis ? n3(q.shoulderAxis) : [1,0,0];
  if(q.twist) sax = rotAxis(sax, td, q.twist*Math.PI/180);
  const sy = q.shrug;
  const shR = [neck[0]+sax[0]*LEN.shw, neck[1]+sax[1]*LEN.shw+sy, neck[2]+sax[2]*LEN.shw];
  const shL = [neck[0]-sax[0]*LEN.shw, neck[1]-sax[1]*LEN.shw+sy, neck[2]-sax[2]*LEN.shw];
  const hax = q.hipAxis ? n3(q.hipAxis) : [1,0,0];
  const hipR = add3(hip, hax, LEN.hipw), hipL = add3(hip, hax, -LEN.hipw);
  const elR = add3(shR, n3(q.uaR), LEN.uarm), elL = add3(shL, n3(q.uaL), LEN.uarm);
  const wrR = add3(elR, n3(q.faR), LEN.farm), wrL = add3(elL, n3(q.faL), LEN.farm);
  const knR = add3(hipR, n3(q.thR), LEN.thigh), knL = add3(hipL, n3(q.thL), LEN.thigh);
  const anR = add3(knR, n3(q.shR), LEN.shin), anL = add3(knL, n3(q.shL), LEN.shin);
  const toR = add3(anR, n3(q.ftR), LEN.foot), toL = add3(anL, n3(q.ftL), LEN.foot);
  const pts = {head,neck,hipC:hip,shL,shR,hipL,hipR,elL,elR,wrL,wrR,knL,knR,anL,anR,toL,toR};
  // dumbbells: pairs of endpoints
  const ax = {x:[1,0,0], y:[0,1,0], z:[0,0,1]};
  function bellAt(c, axis, half){ const a = n3(axis); return [add3(c,a,-half), add3(c,a,half)]; }
  function axisFor(side){
    if(bellAxis==='fa') return side==='R'? n3(q.faR): n3(q.faL);
    return ax[bellAxis||'x'];
  }
  let bells = [];
  if(bell==='wrists') bells = [bellAt(wrL, axisFor('L'), 7), bellAt(wrR, axisFor('R'), 7)];
  else if(bell==='wristR') bells = [bellAt(wrR, axisFor('R'), 7)];
  else if(bell==='mid') bells = [bellAt(mid3(wrL,wrR), ax[bellAxis||'x'], 7)];
  else if(bell==='goblet') bells = [bellAt(mid3(wrL,wrR), ax.y, 6)];
  else if(bell==='hips') bells = [bellAt([hip[0],hip[1]+5,hip[2]], ax.x, 8)];
  return {pts, bells};
}

/* ============================================================
   Exercise data: prescription + cues + two 3D keyframes.
   v:'f'|'s' picks the starting camera angle; ly marks
   floor-level moves (higher camera pitch).
   ============================================================ */

const SUP   = {hip:[0,10,6], torso:[0,-0.06,-1], th:[0.06,0.62,0.78], sh:[0,-0.62,0.78], ft:[0,-0.2,1],
               ua:[0.3,-0.05,0.95], fa:[0.1,0,1]};
const GOB   = {ua:[0.28,-0.85,0.42], fa:[-0.3,0.62,0.62]};

const EXR = {
/* ---------------- CHEST ---------------- */

     {...SUP, ua:[0.95,0.15,0.02], fa:[0.95,-0.05,0.05]}]},

function todayKey(d){ d=d||new Date();

function cleanCustom(o){ const out={}; Object.keys(o||{}).forEach(k=>{ const c=o[k]; if(!c||typeof c!=='object'||!/^[0-6]$/.test(String(k))) return;
  const add=(Array.isArray(c.add)?c.add:[]).filter(id=>EXR[id]), remove=(Array.isArray(c.remove)?c.remove:[]).filter(id=>EXR[id]), swap={};
  Object.keys(c.swap&&typeof c.swap==='object'?c.swap:{}).forEach(f=>{ if(EXR[f]&&EXR[c.swap[f]]) swap[f]=c.swap[f]; });
  if(add.length||remove.length||Object.keys(swap).length) out[k]={add, remove, swap}; }); return out; }
function cleanLogs(o){ const out={}; Object.keys(o||{}).forEach(id=>{ if(!EXR[id]||!Array.isArray(o[id])) return; const arr=o[id].filter(e=>e&&typeof e.d==='string'&&typeof e.v==='string'); if(arr.length) out[id]=arr; }); return out; }
function cleanProgress(o){ const out={}; Object.keys(o||{}).forEach(dk=>{ const p=o[dk]; if(!p||typeof p!=='object') return; const q={}; Object.keys(p).forEach(id=>{ if(p[id]) q[id]=p[id]; }); if(Object.keys(q).length) out[dk]=q; }); return out; }
function effectiveList(idx){
  const type = SCHEDULES[mode][idx];

  const base = (type==='rest' ? [] : WORKOUTS[type].ex.slice()).map(id=>cu.swap[id]||id);
  const list = base.filter(id=>EXR[id] && !cu.remove.includes(id));
  cu.add.forEach(id=>{ if(EXR[id] && !list.includes(id)) list.push(id); });

function commitCustom(idx, cu){
  const swap=cu.swap||{};

  else customEx[idx]={add:cu.add, remove:cu.remove, swap};

  const cu = dayCustom(idx);

  else if(!cu.add.includes(exId)) cu.add.push(exId);

function removeFromDay(idx, exId){
  const cu = dayCustom(idx);
  const ai = cu.add.indexOf(exId);

  else if(!cu.remove.includes(exId)) cu.remove.push(exId);
  commitCustom(idx, cu);

/* Swap keeps the slot: the replacement takes the original's place in the order. */
function swapOnDay(idx, fromId, toId){
  const cu = dayCustom(idx);
  const ai = cu.add.indexOf(fromId);
  if(ai>-1) cu.add[ai]=toId;
  else { const origin = Object.keys(cu.swap).find(k=>cu.swap[k]===fromId) || fromId; if(toId===origin) delete cu.swap[origin]; else cu.swap[origin]=toId; }
  cu.remove = cu.remove.filter(id=>id!==toId);

}

  const dk=todayKey(dateForWeekday(dayIdx)); const list=effectiveList(dayIdx).list;

}

const SEGS = [['neck','hipC'],['shL','shR'],['hipL','hipR'],
  ['shL','elL'],['elL','wrL'],['shR','elR'],['elR','wrR'],
  ['hipL','knL'],['knL','anL'],['anL','toL'],
  ['hipR','knR'],['knR','anR'],['anR','toR']];
const PT_KEYS = ['head','neck','hipC','shL','shR','hipL','hipR','elL','elR','wrL','wrR','knL','knR','anL','anR','toL','toR'];

function precompute(ex){
  const A = buildPose(ex.p[0], ex.bell, ex.bellAxis);
  const B = buildPose(ex.p[1], ex.bell, ex.bellAxis);
  // auto center & radius over both frames
  let sx=0,sy=0,sz=0,cnt=0;
  const all=[];
  [A,B].forEach(f=>{ PT_KEYS.forEach(k=>{ const p=f.pts[k]; sx+=p[0];sy+=p[1];sz+=p[2];cnt++; all.push(p); });
                     f.bells.forEach(b=>{ all.push(b[0],b[1]); }); });
  const c=[sx/cnt, sy/cnt, sz/cnt];
  let r=0; all.forEach(p=>{ r=Math.max(r, Math.hypot(p[0]-c[0], p[1]-c[1], p[2]-c[2])); });
  (ex.props||[]).forEach(pr=>{ const b=pr.box;
    r=Math.max(r, Math.hypot(b[0]-c[0],b[1]-c[1],b[2]-c[2]), Math.hypot(b[0]+b[3]-c[0],b[1]+b[4]-c[1],b[2]+b[5]-c[2])); });
  r=Math.max(r,46);
  return {A,B,center:c,rad:r};
}
function lerp3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

let anims=[]; let visible=new Set();
const io = ('IntersectionObserver' in window)? new IntersectionObserver(es=>{
  es.forEach(e=>{ const a=anims.find(x=>x.canvas===e.target); if(!a) return;
    if(e.isIntersecting){ visible.add(a); ensureLoop(); } else visible.delete(a); });
},{rootMargin:'80px'}) : null;
/* Canvases are created only when their card scrolls into view; 78 at boot was 58 MB of backing store on a phone. */
const boxIO = ('IntersectionObserver' in window)? new IntersectionObserver(es=>{
  es.forEach(e=>{ if(!e.isIntersecting) return; const box=e.target; boxIO.unobserve(box); if(box.dataset.made) return; box.dataset.made='1'; makeAnim(box.getAttribute('data-anim'), box); });

function makeAnim(exId, box){

  box.prepend(canvas);
  const pre = precompute(ex);
  const yaw0 = ex.v==='f' ? 0.35 : 1.15;
  const a = {canvas, ctx:canvas.getContext('2d'), ex, pre, dpr,
    yawBase:yaw0, yaw:yaw0, pitch: ex.ly? 0.5 : 0.26,
    userHold:false, phase:Math.random()*7000, osc:!REDUCED};
  anims.push(a);
  // drag to rotate
  let px=0, py=0, drag=false;

    a.userHold=true; a.osc=false; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!drag) return;
    a.yaw += (e.clientX-px)*0.012; a.pitch += (e.clientY-py)*0.008;
    a.pitch = Math.max(-0.25, Math.min(1.25, a.pitch));
    px=e.clientX; py=e.clientY; if(REDUCED) draw(a, 1); });
  const end = e=>{ drag=false; };

    btn.addEventListener('click', ()=>{

      a.yawBase=a.yaw; a.pitch = v==='top'? 1.1 : (a.ex.ly?0.5:0.26);
      a.osc=false; a.userHold=true; if(REDUCED) draw(a,1);

function draw(a, p){
  const {ctx, pre, dpr, ex} = a;
  const cx=CW/2, cyPix=CH/2 + 6;
  const CAMD = pre.rad*3.4, FOC = 315;
  const cosY=Math.cos(a.yaw), sinY=Math.sin(a.yaw), cosP=Math.cos(a.pitch), sinP=Math.sin(a.pitch);
  const C = pre.center;
  function proj(pt){
    const x=pt[0]-C[0], y=pt[1]-C[1], z=pt[2]-C[2];
    const x1= x*cosY + z*sinY, z1= -x*sinY + z*cosY;
    const y2= y*cosP - z1*sinP, z2= y*sinP + z1*cosP;
    const s = FOC/(CAMD - z2*0.9);
    return {x:cx + x1*s, y:cyPix - y2*s, z:z2, s};
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // ground grid at y=0
  ctx.strokeStyle=COLORS.grid; ctx.lineWidth=1; ctx.globalAlpha=0.85;

    p1=proj([g,0,-66]); p2=proj([g,0,66]);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  // props (bench/chair): box edges
  (ex.props||[]).forEach(pr=>{
    const [bx,by,bz,w,h,d]=pr.box;
    const v=[[bx,by,bz],[bx+w,by,bz],[bx+w,by,bz+d],[bx,by,bz+d],
             [bx,by+h,bz],[bx+w,by+h,bz],[bx+w,by+h,bz+d],[bx,by+h,bz+d]].map(proj);
    const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    ctx.strokeStyle=COLORS.muted; ctx.globalAlpha=0.55; ctx.lineWidth=1.4;
    E.forEach(e=>{ ctx.beginPath(); ctx.moveTo(v[e[0]].x,v[e[0]].y); ctx.lineTo(v[e[1]].x,v[e[1]].y); ctx.stroke(); });
  });
  // interpolate pose
  const pts={};
  PT_KEYS.forEach(k=>{ pts[k]=lerp3(pre.A.pts[k], pre.B.pts[k], p); });
  const bells = pre.A.bells.map((b,i)=>[lerp3(b[0], pre.B.bells[i][0], p), lerp3(b[1], pre.B.bells[i][1], p)]);
  // depth-sorted strokes
  const items=[];
  SEGS.forEach(sg=>{
    const p1=proj(pts[sg[0]]), p2=proj(pts[sg[1]]);
    items.push({z:(p1.z+p2.z)/2, kind:'seg', p1, p2});
  });
  const hp=proj(pts.head);
  items.push({z:hp.z, kind:'head', p:hp});
  bells.forEach(b=>{
    const p1=proj(b[0]), p2=proj(b[1]);
    items.push({z:(p1.z+p2.z)/2, kind:'bell', p1, p2});
  });
  items.sort((u,v)=>u.z-v.z); // far first
  const zs=items.map(i=>i.z), zmin=Math.min(...zs), zmax=Math.max(...zs), zr=(zmax-zmin)||1;
  items.forEach(it=>{
    const t=(it.z-zmin)/zr; // 0 far → 1 near
    ctx.globalAlpha = 0.38 + 0.62*t;
    if(it.kind==='seg'){
      ctx.strokeStyle=COLORS.fig; ctx.lineWidth=3.6+1.6*t;
      ctx.beginPath(); ctx.moveTo(it.p1.x,it.p1.y); ctx.lineTo(it.p2.x,it.p2.y); ctx.stroke();
    }else if(it.kind==='head'){
      ctx.strokeStyle=COLORS.fig; ctx.lineWidth=3.2+1.2*t;
      ctx.beginPath(); ctx.arc(it.p.x,it.p.y, LEN.headR*it.p.s, 0, Math.PI*2); ctx.stroke();
    }else{
      ctx.strokeStyle=COLORS.accent; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(it.p1.x,it.p1.y); ctx.lineTo(it.p2.x,it.p2.y); ctx.stroke();
      ctx.fillStyle=COLORS.accent;
      [it.p1,it.p2].forEach(pp=>{ ctx.beginPath(); ctx.arc(pp.x,pp.y, 3.4*pp.s, 0, Math.PI*2); ctx.fill(); });
    }
  });

}
function tick(now){
  visible.forEach(a=>{
    const dur=(a.ex.dur||2.4)*1000;
    const t=((now+a.phase)%dur)/dur;
    let s=(Math.sin(t*2*Math.PI - Math.PI/2)+1)/2;
    s=Math.min(1,Math.max(0, s*1.3-0.15)); s=s*s*(3-2*s);
    if(a.osc) a.yaw = a.yawBase + 0.3*Math.sin((now+a.phase)*0.00045);
    draw(a, s);
  });
  if(visible.size) requestAnimationFrame(tick); else loopOn=false;
}
let loopOn=false;
function ensureLoop(){ if(REDUCED||loopOn) return; loopOn=true; requestAnimationFrame(tick); }

function figSVG(f, kind){

  out+=`<g class="body" style="stroke:var(${kind==='do'?'--good':'--care'})">`;
  out+= f.bend ? `<path d="M${f.neck[0]} ${f.neck[1]} Q${f.bend[0]} ${f.bend[1]} ${f.hip[0]} ${f.hip[1]}"/>` : L(f.neck,f.hip);
  (f.legs||[]).forEach(([k,a,t])=>{ out+=L(f.hip,k)+L(k,a)+(t?L(a,t):''); });

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function ytUrl(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
function refLinks(exId){
  const r = REFS[exId];
  if(r && (r.page || r.video)){
    let h='';
    if(r.page) h += `<a class="vidlink" href="${r.page.url}" target="_blank" rel="noopener">${esc(r.page.source)} guide ↗</a>`;
    if(r.video) h += `<a class="vidlink" href="${r.video.url}" target="_blank" rel="noopener">Video · ${esc(r.video.source)} ↗</a>`;
    return h;
  }
  return `<a class="vidlink" href="${ytUrl(EXR[exId].q)}" target="_blank" rel="noopener">Watch video demo ↗</a>`;
}
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
function fmtDate(dk){ const [y,m,d]=dk.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function logLast(exId, dk){ const arr=logs[exId]||[]; const prev=arr.filter(e=>e.d!==dk); return prev.length? prev[prev.length-1] : null; }
function logToday(exId, dk){ const arr=logs[exId]||[]; const t=arr.find(e=>e.d===dk); return t? t.v : ''; }
function setLog(exId, dk, v){
  const arr=(logs[exId]||[]).filter(e=>e.d!==dk);
  if(v.trim()) arr.push({d:dk, v:v.trim().slice(0,40)});
  arr.sort((a,b)=>a.d<b.d?-1:1);
  if(arr.length>30) arr.splice(0, arr.length-30);
  if(arr.length) logs[exId]=arr; else delete logs[exId];
  persistLog(exId);
}
function restSeconds(ex){ const r=parseInt(ex.rest,10); return isNaN(r)? 0 : r; }
function estMinutes(list){
  let s=0;
  list.forEach(id=>{ const ex=EXR[id]; if(!ex) return;
    if(ex.rxLabel){ s += 65; return; }                       // a back-care dose is one timed block, not N sets
    const m=/^(\d+)\s*×/.exec(ex.sets); let sets=m? parseInt(m[1],10) : 1;
    if(/\/\s*side/i.test(ex.sets)) sets*=2;                   // 3 × 10 / side is six working sets
    s += sets*40 + Math.max(0,sets-1)*restSeconds(ex) + 45; }); // 45 s to change plates between exercises
  return Math.round((s+300)/60);
}
function progressHint(ex, last){
  if(!last) return '';
  const m=/(\d+(?:[.,]\d+)?)\s*(?:kg|lb)?\s*(?:each)?\s*[x×*]\s*(\d+)/i.exec(last.v), r=/(\d+)\s*[–-]\s*(\d+)/.exec(ex.sets||'');
  if(!m||!r) return '';
  const reps=+m[2], bot=+r[1], top=+r[2];
  if(reps>=top) return `Hit ${reps} last time: add the smallest weight step and aim for ${bot}.`;
  return `Aim for ${reps+1} reps with the same weight this time.`;
}
function exCardHTML(exId, idx, colorVar, dateKey, removable){

  const rs = restSeconds(ex);
  const hm = ex.rxLabel ? /(\d+)(?:\s*[–-]\s*\d+)?\s*s\b/.exec(ex.sets||'') : null;
  const hold = hm ? parseInt(hm[1],10) : 0;
  const last = dateKey? logLast(exId, dateKey) : null;
  const hist = (logs[exId]||[]).slice(-5).reverse();
  const showLog = dateKey && !ex.rxLabel;
  const compact = !!(dateKey && removable);                       // Today cards keep the essentials up front
  const pref = compact ? sGet('dd-more:'+exId, null) : null;
  const open = compact ? (pref===null ? (logs[exId]||[]).length<3 : !!pref) : true;
  const top = `
      <div class="ex-top">
        <span class="ex-num">${String(idx+1).padStart(2,'0')}</span>
        <h3 class="ex-name">${esc(ex.name)}</h3>

      </div>
      ${muscleMapHTML(mm.p, mm.s, ex.rxLabel?'Targets':'Works')}
      <div class="rx">
        <span><span class="lbl">${esc(ex.rxLabel||'Sets × reps')}</span><b>${esc(ex.sets)}</b></span>
        ${rs? `<span><span class="lbl">Rest</span><b>${esc(ex.rest)}</b></span>`:''}
      </div>`;
  const cuesHtml = `
      <ol class="cues">${ex.cues.map(c=>'<li>'+esc(c)+'</li>').join('')}</ol>
      <p class="avoid"><b>Avoid:</b> ${esc(ex.avoid)}</p>
      ${SPINE[exId]? `<p class="spine"><b>Sore back?</b> ${esc(SPINE[exId])}</p>`:''}`;
  const logHtml = showLog? `<div class="logwrap">
        <span class="lbl">Log</span>
        <input class="loginp" data-log="${exId}" placeholder="12 kg each × 10" value="${escA(logToday(exId,dateKey))}" aria-label="Weight and reps used for ${escA(ex.name)}" maxlength="40">
        ${last? `<span class="loglast">last: <b>${esc(last.v)}</b> · ${fmtDate(last.d)}</span>` : '<span class="loglast">first time — note the weight you used</span>'}
        ${last && progressHint(ex,last)? `<span class="loghint">${esc(progressHint(ex,last))}</span>`:''}
        ${hist.length>1? `<details class="loghist"><summary>History</summary><ul>${hist.map(e=>`<li><b>${esc(e.v)}</b><span>${fmtDate(e.d)}</span></li>`).join('')}</ul></details>`:''}
      </div>`:'';
  const actions = `
      <div class="ex-actions">
        ${dateKey? `<button class="donebtn" type="button" data-ex="${exId}" aria-pressed="${done?'true':'false'}">${done?'Done ✓':'Mark done'}</button>`:''}
        ${dateKey && rs? `<button class="restbtn" type="button" data-rest="${rs}" title="Start the rest timer">Rest ${rs} s ▶</button>`:''}
        ${dateKey && hold? `<button class="restbtn" type="button" data-rest="${hold}" title="Count the hold">Hold ${hold} s ▶</button>`:''}
        ${removable? `<button class="swapbtn" type="button" data-swap="${exId}" title="Swap for another exercise from the same group">Swap ⇄</button>`:''}
        ${refLinks(exId)}
      </div>`;
  const anim = `
    <div class="anim-box" data-anim="${exId}">
      <div class="vbtns"><button type="button" data-v="three">¾</button><button type="button" data-v="front">front</button><button type="button" data-v="side">side</button></div>
      <span class="hint">drag to rotate ⟲</span>
    </div>`;
  if(compact) return `
  <article class="ex-card compact" style="--tc:var(${colorVar})" data-exid="${exId}">
    <div class="ex-body">${top}${logHtml}${actions}
      <details class="more" data-more="${exId}"${open?' open':''}><summary>How to do it</summary>
        <div class="more-in">${anim}<div class="how-text">${cuesHtml}</div></div>
      </details>
    </div>
  </article>`;
  return `
  <article class="ex-card" style="--tc:var(${colorVar})" data-exid="${exId}">

function mountAnims(root, eager){ // eager: build the canvases now (Today's few cards); otherwise when the card scrolls into view
  anims = anims.filter(a=>{ if(a.canvas.isConnected) return true; if(io) io.unobserve(a.canvas); visible.delete(a); return false; });
  root.querySelectorAll('[data-anim]').forEach(b=>{ if(b.dataset.made) return; if(boxIO && !eager) boxIO.observe(b); else { b.dataset.made='1'; makeAnim(b.getAttribute('data-anim'), b); } });
}
function mountDone(root, dk, onChange){
  root.querySelectorAll('.donebtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id=btn.getAttribute('data-ex');
      progress[dk]=progress[dk]||{};
      const nowOn=!progress[dk][id];
      if(nowOn) progress[dk][id]=Date.now(); else delete progress[dk][id];   // a timestamp, so the session summary can say how long it took
      if(Object.keys(progress[dk]).length===0) delete progress[dk];
      persistProgress(dk);
      btn.setAttribute('aria-pressed', nowOn?'true':'false');
      btn.textContent=nowOn?'Done ✓':'Mark done';
      if(onChange) onChange(id, nowOn);
    });
  });
}
function mountCardExtras(root, dk){
  root.querySelectorAll('.loginp').forEach(inp=>{
    const save=()=>{
      setLog(inp.getAttribute('data-log'), dk, inp.value);
      let s=inp.parentElement.querySelector('.logsaved');
      if(!s){ s=document.createElement('span'); s.className='logsaved'; inp.parentElement.appendChild(s); }
      s.textContent='saved ✓'; setTimeout(()=>{ if(s.isConnected) s.textContent=''; }, 1800);
    };
    inp.addEventListener('change', save);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ save(); inp.blur(); } });
  });
  root.querySelectorAll('.restbtn').forEach(b=>b.addEventListener('click', ()=>startTimer(parseInt(b.getAttribute('data-rest'),10))));
  root.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>showView(b.getAttribute('data-goto'))));
  root.querySelectorAll('details.more').forEach(d=>d.addEventListener('toggle', ()=>{ sSet('dd-more:'+d.getAttribute('data-more'), d.open); if(d.open) mountAnims(d); }));
}

  candidates.sort((a,b)=> EXR[a].mus===EXR[b].mus ? EXR[a].name.localeCompare(EXR[b].name) : EXR[a].mus.localeCompare(EXR[b].mus));

function sameTypeInfo(dayIdx){ // 'Push 2/2 this week · same list as Monday'
  const t=SCHEDULES[mode][dayIdx]; if(t==='rest') return null;
  const idxs=SCHEDULES[mode].map((x,i)=>x===t?i:-1).filter(i=>i>=0); if(idxs.length<2) return null;
  const k=idxs.indexOf(dayIdx)+1, first=idxs[0];
  const same = JSON.stringify(effectiveList(dayIdx).list)===JSON.stringify(effectiveList(first).list);
  return {k, n:idxs.length, first, same};
}
function doneCountText(dk, list){ const n=list.filter(x=>progress[dk]&&progress[dk][x]).length; return `${n} of ${list.length} done`; }
function renderSummary(root, dk, list, fin){
  const box=root.querySelector('#summary'); if(!box) return;
  if(!fin){ box.className='summary'; box.innerHTML=''; return; }
  const p=progress[dk]||{}, n=list.filter(x=>p[x]).length;
  const stamps=list.map(x=>p[x]).filter(v=>typeof v==='number'&&v>1e12);
  const span=stamps.length>1? Math.round((Math.max(...stamps)-Math.min(...stamps))/60000) : 0;
  const logged=list.filter(x=>logToday(x,dk)).length;
  box.className='summary show';
  box.innerHTML=`<b>Workout complete — good work. 💪</b><span>${n} of ${list.length} done${logged?` · ${logged} weight${logged===1?'':'s'} logged`:''}${span?` · ${span} min from first tick`:''}</span>`;
}
let toastT=null;
function toast(msg, undo){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
  t.textContent=msg;
  if(undo){ const b=document.createElement('button'); b.type='button'; b.textContent='Undo'; b.addEventListener('click', ()=>{ hideToast(); undo(); }); t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(hideToast, 5000);
}
/* the Undo button must leave the tab order with the toast, not linger invisibly */
function hideToast(){ const t=document.getElementById('toast'); if(!t) return; t.classList.remove('show'); const b=t.querySelector('button'); if(b) b.remove(); }

function weekStreak(){ // consecutive scheduled sessions completed, counting back from the last scheduled day (today does not break it)
  let n=0; const now=new Date();
  for(let i=0;i<180;i++){ const d=new Date(now); d.setDate(now.getDate()-i); const list=effectiveList(weekdayIdx(d)).list; if(!list.length) continue;
    if(complete[todayKey(d)]) n++; else if(i===0) continue; else break; }
  return n;
}

function renderGuide(){
  const root=document.getElementById('view-guide');
  root.innerHTML=`
    <div class="dayhead">
      <h1>The <span class="accent">Guide</span></h1>
      <div class="sub">How to use this plan and actually get stronger</div>
    </div>
    <div class="guide">
      <h2>Reading the 3D demonstrations</h2>
      <p>Every exercise card has a 3D figure performing the movement on loop. <b>Drag it with your finger or mouse to rotate
      around the figure</b> — check the side view for back position on hinges and squats, and the front view for elbow and
      knee paths. The orange pieces are the dumbbells (bodyweight and stretch cards have none). The ¾ / front / side buttons jump to those angles.</p>
      <p>The figure shows the movement path; it can't see <i>your</i> body. So for each new exercise: watch the linked
      professional guide once, start with a light weight for the first week, and occasionally film yourself from the side —
      comparing your video to the demonstration is the fastest form fix there is.</p>

      <h2>The four plans</h2>
      <ul>
        <li><b>6-day Push / Pull / Legs</b> — the default. Push Mon and Thu, Pull Tue and Fri, Legs + Core Wed and Sat: every muscle twice a week, 72 hours apart, which is why the same session appears twice.</li>
        <li><b>4-day Upper / Lower</b> — Upper Mon and Thu, Lower Tue and Fri. Still twice a week per muscle, three free days. The plan for weeks with badminton, cricket or a sore back.</li>
        <li><b>3-day Full body A / B / C</b> — Mon / Wed / Fri, six exercises a session covering the whole body, most muscles two or three times a week.</li>
        <li><b>6-day body-part split</b> — a dedicated day per area: Chest, Back, Legs, Shoulders + Abs, Arms, plus a core day Saturday. Each muscle once a week.</li>
      </ul>
      <p>Pick one on the Week tab. <b>Swapping varieties:</b> any exercise can be replaced by another from the same muscle
      group with the <b>Swap</b> button on its card, same sets and reps. Rotate varieties every 4–6 weeks to keep progressing.</p>

      <h2>Picking the right weight</h2>
      <p>Choose a weight where you could do <b>2–3 more reps</b> than the target before form breaks. If the target is 8–12
      and you can barely finish 8, that's right. If you could do 20, it's too light. The weight will differ a lot between
      exercises — pressing 15&nbsp;kg while lateral-raising 4&nbsp;kg is normal.</p>

      <h2>How to progress (this is the whole secret)</h2>
      <ol>
        <li>Keep the weight and add a rep or two each week until you hit the <b>top</b> of the rep range on <b>all</b> sets.</li>
        <li>Then increase the weight by the smallest step, which drops you back to the bottom of the range.</li>
        <li>Repeat. Type each weight into the <b>Log</b> box on the card and the card tells you what to aim for next time.</li>
        <li>When the pair is maxed out and 15+ reps are easy: raise the range to 15–25 reps with 2–3 reps in reserve, go one-sided (Bulgarian split squat, single-leg RDL, one-arm row, step-up), or lower for three seconds and pause one second at the bottom.</li>
      </ol>
      <p>For raises, flys and kickbacks the smallest weight step is often too big: first add reps up to 20, then slow the lowering to three seconds, then take the jump and accept dropping to 8–10 reps. Every 6–8 weeks, or when two sessions in a row feel worse than the last, take one week at half the sets.</p>

      <h2>Rest between sets</h2>
      <p>Use the timer at the bottom of the Today tab. Big movements (squats, presses, rows, deadlifts) earn 90–120 seconds.
      Small ones (curls, raises, abs) need 45–60. Resting too little costs you reps on the next set; if you lose more than two reps between
      set one and set four, rest 120 seconds instead of 90.</p>

      <h2>When to stop</h2>
      <p>Sore muscles are fine to train — sharp pain in a joint is not. If something <i>hurts</i> (not burns — hurts), stop
      that exercise and see a professional if it persists. Sick or slept terribly? Take the rest day. Consistency over months
      is what matters.</p>

      <h2>Training with a sore back</h2>
      <p>Back pain from sitting is the most common reason people stop a home programme — and stopping is the wrong move. The
      <b>Back care</b> tab has a 15-minute daily Spine Reset (stretches and asanas), a spine-protecting core routine, a 90-second desk
      break with a stand-up reminder, and desk-setup advice. The <b>Do &amp; Don't</b> tab shows the positions that hurt and the ones that help. Exercises in the plan that load the lower back carry a
      <b>"Sore back?"</b> note with the adjustment to make. On a bad day, tap <b>Sore back today</b> at the top of the Today tab and the session
      becomes the Spine Reset.</p>

      <h2>Logging your weights</h2>
      <p>Every exercise card on the Today tab has a <b>Log</b> box — type what you used (for example <i>12 kg × 10</i>) and press
      Enter. Next time, the card shows your last entry and a hint: at the top of the rep range it says add the smallest weight step, below it
      says aim for one more rep. Open <b>History</b> on the card for the last five entries. Marking an exercise done starts its rest timer.</p>

      <p class="fine">This plan is general fitness guidance for healthy adults, not medical advice. If you have an injury, a
      heart condition, or any medical concern, check with a doctor before starting. Progress data lives only in this browser
      on this device.</p>
    </div>`;
}

function renderStrip(){
  const strip=document.getElementById('weekstrip');
  const wd=weekdayIdx(); const sched=SCHEDULES[mode];
  strip.innerHTML=sched.map((t,i)=>{
    const list=effectiveList(i).list;
    const isDone=list.length>0&&complete[todayKey(dateForWeekday(i))];
    const n=sched.filter(x=>x===t).length, k=sched.slice(0,i+1).filter(x=>x===t).length, rep=t!=='rest'&&n>1;
    const cls=[i===wd?'today':'', i===selectedDay?'selected':''].filter(Boolean).join(' ');
    return `<button class="daychip ${cls}" type="button" style="--tc:var(${WORKOUTS[t].c})" data-day="${i}"${i===selectedDay?' aria-current="true"':''} aria-label="${DAY_NAMES[i]}: ${STRIP_LABEL[t]}${rep?' '+k+' of '+n:''}${isDone?', done':''}${i===wd?', today':''}${i===selectedDay?', selected':''}">
      <span class="d"><span class="dot"></span>${DAY_SHORT[i]}${isDone?' <span class="done">✓</span>':''}</span>
      <span class="w">${STRIP_LABEL[t]}${rep?`<small>${k}/${n}</small>`:''}</span>
    </button>`;
  }).join('');
  strip.querySelectorAll('.daychip').forEach(c=>c.addEventListener('click',()=>{
    selectedDay=parseInt(c.getAttribute('data-day'),10);

  const sel=strip.querySelector('.daychip.selected');
  if(sel && strip.scrollWidth>strip.clientWidth+4){ strip.scrollLeft = Math.max(0, sel.offsetLeft - (strip.clientWidth - sel.offsetWidth)/2); }
  renderPlanBar();
}

function showView(v){
  if(!views.includes(v)) v='today';
  if(!rendered.has(v)){ rendered.add(v); try{ if(v==='library') renderLibrary(); else if(v==='care') renderCare(); else if(v==='dos') renderDos(); }catch(e){ console.error(e); } }
  views.forEach(name=>{ document.getElementById('view-'+name).hidden=(name!==v); });
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.getAttribute('data-view')===v?'true':'false'));
  currentView=v; updateBar();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showView(t.getAttribute('data-view'))));
document.querySelector('nav[role="tablist"]').addEventListener('keydown', e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const tabs=[...document.querySelectorAll('.tab')], i=tabs.indexOf(document.activeElement); if(i<0) return;
  e.preventDefault(); const nx=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length]; nx.focus(); showView(nx.getAttribute('data-view'));
});

/* ---------- rest timer ---------- */
/* The bell: audio is unlocked by the tap that starts a rest, the chime repeats every 3 s up to
   5 times or until you tap the bar, the phone vibrates while the page is on screen, and the
   screen stays awake while a rest counts. A hidden or locked phone cannot ring from the
   background: the countdown is remembered and picked up when you return, a notification goes
   out through sw.js where allowed, and on Android the bar offers a link that hands the countdown
   to the phone's own Clock app. 'GO!' stays on the bar until you tap it. */
let timerEnd=0, timerInt=null, barOver=false, currentView='today';
const tdisplay=document.getElementById('tdisplay'), tstatus=document.getElementById('tstatus');
const IS_ANDROID=/Android/i.test(navigator.userAgent), IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let AC=null, bellVol=sGet('dd-vol',70), bellRep=null, bellCount=0, wl=null;
function ensureAudio(){ try{ if(!AC){ const Ctx=window.AudioContext||window.webkitAudioContext; AC=new Ctx(); } if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f,t0,dur,g){
  const o=AC.createOscillator(), o2=AC.createOscillator(), gn=AC.createGain(), g2=AC.createGain();
  o.type='sine'; o.frequency.value=f; o2.type='triangle'; o2.frequency.value=f*2; g2.gain.value=0.18;
  gn.gain.setValueAtTime(0,t0); gn.gain.linearRampToValueAtTime(g,t0+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); o2.connect(g2); g2.connect(gn); gn.connect(AC.destination);
  o.start(t0); o2.start(t0); o.stop(t0+dur+0.05); o2.stop(t0+dur+0.05);
}
function chime(){ ensureAudio(); if(!AC) return; const v=(bellVol/100)*0.7; if(v<=0) return; const t=AC.currentTime+0.02; [523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.17,0.9,v)); }
function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
function beep(){ chime(); buzz([300,120,300]); }
let bellStart=0;
function ringUntilTap(){ stopRinging(); bellCount=0; bellStart=Date.now(); beep(); bellRep=setInterval(()=>{ bellCount++; if(bellCount>=5 || Date.now()-bellStart>16000){ stopRinging(); return; } beep(); },3000); }
function stopRinging(){ if(bellRep){ clearInterval(bellRep); bellRep=null; } }
function wake(on){ try{ if(on&&'wakeLock' in navigator){ if(!wl){ navigator.wakeLock.request('screen').then(l=>{ wl=l; l.addEventListener('release',()=>{ wl=null; }); }).catch(()=>{}); } } else if(!on&&wl){ wl.release().catch(()=>{}); wl=null; } }catch(e){} }
/* Android Chrome refuses page-level notifications; sw.js (shared with Spine Bell and Tally Board) shows them instead. */
let SWREG=null;
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); navigator.serviceWorker.ready.then(r=>{ SWREG=r; }).catch(()=>{}); }catch(e){} }
function notify(title, body){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const o={body, tag:'dojo-rest', renotify:true, vibrate:[300,120,300], data:{url:location.href}};
  if(SWREG&&SWREG.showNotification){ SWREG.showNotification(title,o).catch(()=>{ try{ new Notification(title,o); }catch(e){} }); return; }
  try{ new Notification(title,o); }catch(e){}
}
function alertsUI(){ const b=document.getElementById('talerts'); if(!('Notification' in window)){ b.hidden=true; return; }
  b.textContent = Notification.permission==='granted' ? 'Alerts on' : Notification.permission==='denied' ? 'Alerts blocked' : 'Alerts: enable'; b.disabled = Notification.permission!=='default'; }
document.getElementById('talerts').addEventListener('click', ()=>{ try{ Notification.requestPermission().then(alertsUI); }catch(e){} });
function intentUrl(sec,label){ return 'intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH='+Math.max(1,Math.round(sec))+';S.android.intent.extra.alarm.MESSAGE='+encodeURIComponent(label)+';end'; }
const clockLink=document.getElementById('tclock');
function updateClockLink(){ if(!IS_ANDROID){ clockLink.hidden=true; return; } clockLink.hidden=!timerInt; if(timerInt) clockLink.href=intentUrl((timerEnd-Date.now())/1000,'Dumbbell Dojo: rest over'); }
clockLink.addEventListener('click', ()=>{ if(timerInt) clockLink.href=intentUrl((timerEnd-Date.now())/1000,'Dumbbell Dojo: rest over'); });
document.getElementById('tvol').value=bellVol;
document.getElementById('tvol').addEventListener('input', e=>{ bellVol=parseInt(e.target.value,10)||0; sSet('dd-vol',bellVol); });
document.getElementById('ttest').addEventListener('click', ()=>{ ensureAudio(); beep(); });
document.getElementById('tgear').addEventListener('click', ()=>{ const st=document.getElementById('tsettings'); st.hidden=!st.hidden; document.getElementById('tgear').setAttribute('aria-expanded', String(!st.hidden)); setBarPadding(); });
document.getElementById('timerbar').addEventListener('click', e=>{ stopRinging(); if(barOver && !e.target.closest('button,a,input')) clearOver(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ if(timerInt||standInt) wake(true); if(timerInt) tickRest(); } });
function fmt(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function clearOver(){ barOver=false; tdisplay.classList.remove('over'); if(!timerInt) tdisplay.textContent='--:--'; document.title='Dumbbell Dojo'; try{ sessionStorage.removeItem('dd-rest-end'); }catch(e){} updateBar(); }
function stopTimer(msg){ clearInterval(timerInt); timerInt=null; tdisplay.classList.remove('running'); tdisplay.textContent=msg||'--:--'; updateClockLink(); }
function restOver(){ stopTimer('GO!'); tdisplay.classList.add('over'); barOver=true; wake(false); ringUntilTap(); notify('Rest over','Next set. Tap to come back to Dumbbell Dojo.'); tstatus.textContent='Rest over'; document.title='GO! · Dumbbell Dojo'; updateBar(); }
function tickRest(){ const left=timerEnd-Date.now(); if(left<=0){ if(timerInt) restOver(); } else tdisplay.textContent=fmt(left); }
function startTimer(sec){
  ensureAudio(); stopRinging(); wake(true); barOver=false; tdisplay.classList.remove('over'); tstatus.textContent='';
  timerEnd=Date.now()+sec*1000; try{ sessionStorage.setItem('dd-rest-end', String(timerEnd)); }catch(e){}
  clearInterval(timerInt); tdisplay.classList.add('running');
  timerInt=setInterval(tickRest,200); tickRest(); updateClockLink(); updateBar();
  document.getElementById('timerbar').classList.add('flash');
  setTimeout(()=>document.getElementById('timerbar').classList.remove('flash'), 600);
}
function resumeRest(){ // a tab that was discarded or reloaded mid-rest picks the countdown back up
  let end=0; try{ end=+sessionStorage.getItem('dd-rest-end')||0; }catch(e){} if(!end) return;
  const left=end-Date.now();
  if(left>0) startTimer(Math.ceil(left/1000));
  else if(Date.now()-end<120000){ tdisplay.textContent='GO!'; tdisplay.classList.add('over'); barOver=true; tstatus.textContent='Rest ended while this page was away'; updateBar(); }
  else { try{ sessionStorage.removeItem('dd-rest-end'); }catch(e){} }
}
document.querySelectorAll('.tbtn[data-sec]').forEach(btn=>{
  btn.addEventListener('click',()=>startTimer(parseInt(btn.getAttribute('data-sec'),10)));
});
document.getElementById('tstop').addEventListener('click',()=>{ stopTimer(); stopRinging(); wake(false); clearOver(); });
/* keep the page content clear of the fixed bar whatever height it wraps to, and show the bar on any tab while a rest is running */
function setBarPadding(){ const bar=document.getElementById('timerbar'); const h=bar.style.display==='none'? 0 : bar.offsetHeight; document.body.style.paddingBottom=(h? h+16 : 24)+'px'; document.documentElement.style.setProperty('--barh', h+'px'); }
function updateBar(){ const bar=document.getElementById('timerbar'); bar.style.display=(currentView==='today'||timerInt||barOver)?'':'none'; setBarPadding(); }
if('ResizeObserver' in window){ new ResizeObserver(()=>setBarPadding()).observe(document.getElementById('timerbar')); }
document.addEventListener('focusin', e=>{ if(IS_MOBILE && e.target.classList && e.target.classList.contains('loginp')) document.getElementById('timerbar').classList.add('typing'); });
document.addEventListener('focusout', e=>{ if(e.target.classList && e.target.classList.contains('loginp')) document.getElementById('timerbar').classList.remove('typing'); });
alertsUI();

/* ---------- Back care view ---------- */
function renderCare(){
  if(!rendered.has('care')) return;
  const root=document.getElementById('view-care');
  const dk=todayKey();
  const routineHTML = r=>{
    const doneN = r.ex.filter(id=>progress[dk]&&progress[dk][id]).length;
    return `
    <section class="routine" style="--tc:var(--care)">
      <div class="rhead">
        <h2><span class="dot"></span>${esc(r.name)}</h2>
        <span class="rdone" data-rdone="${r.id}">${doneN? `${doneN} of ${r.ex.length} done today`:''}</span>
      </div>
      <p class="when">${esc(r.when)}</p>
      <p class="rdesc">${esc(r.desc)}</p>
      <div class="exlist">${r.ex.map((id,i)=>exCardHTML(id,i,'--care',dk,false)).join('')}</div>
      ${r.id==='desk'? `
      <div class="micro">
        <h3>The 90-second desk break — in order</h3>
        <ol>
          <li><b>Stand up</b> and do 5 standing back extensions (above).</li>
          <li><b>Chin tucks × 8:</b> glide the chin straight back, making a double chin, hold 2 seconds. Undoes the forward-head neck. <a href="https://www.youtube.com/watch?v=vhFGQxDVzF8" target="_blank" rel="noopener">Video · Physio REHAB ↗</a></li>
          <li><b>Shoulder rolls × 8</b> backward, then the doorway stretch (above) for 20 seconds if a frame is near.</li>
          <li><b>Seated twist:</b> sit tall, hand on the opposite knee, turn and look behind you, 15 seconds each side.</li>
          <li><b>Walk</b> — to the water, the window, the corridor. Refill, return, sit down <i>differently</i>.</li>
        </ol>
        <div class="remind" id="remindbox"></div>
      </div>`:''}
    </section>`;
  };
  root.innerHTML=`
    <div class="dayhead" style="--tc:var(--care)">
      <h1>Back <span class="accent">Care</span></h1>
      <div class="sub">Stretches, asanas, and spine-safe core for a back that sits too much</div>
    </div>
    <div class="care-intro">
      <h2>Why sitting hurts — and what fixes it</h2>
      <p>Sitting still, not posture, is the problem. In a chair the same tissues carry one load for hours, the hips stiffen, the upper back rounds
      so the head drifts forward, and the small muscles that hold the spine still get tired. A tired, sensitised back complains the moment you
      move: a dull ache across the lower back, stiffness when you stand up, tightness that eases once you get going. That pattern is called
      <b>non-specific mechanical back pain</b>, and the good news is that it responds to movement, not rest.</p>
      <p>Three things fix it, in this order of importance: <b>1. Sit less at a stretch</b> (the Desk Break and its reminder).
      <b>2. Walk daily and build endurance in the muscles that protect the spine</b> (the Big 3 core, plus the glutes and back you are already
      training with dumbbells). <b>3. Restore the range you lost</b> (the daily Spine Reset — stretches and asanas that reverse the chair).</p>
      <p>Give it <b>two to six weeks of daily consistency</b>. Most people feel the morning stiffness go first, then the ache. Keep going
      after it stops hurting — the chair has not gone anywhere. Flare-ups are pain, not damage: drop the dose for a few days and keep moving.</p>
    </div>
    <div class="flag">
      <h2>See a doctor first if any of these apply</h2>
      <ul>
        <li><b>Go to A&amp;E now</b> if you have numbness around the back passage, genitals or buttocks; trouble starting to pee or feeling it, or losing bladder or bowel control; weakness or numbness in both legs; new sexual problems; severe weakness or you cannot walk or stand steadily; chest pain alongside the back pain; or the pain started in a serious accident. These can be signs of cauda equina syndrome or another emergency, and hours matter.</li>
        <li>Pain, numbness, tingling, or weakness running down a leg below the knee</li>
        <li>Pain that started after a fall, or after even a minor strain if you are over 50 or take long-term steroid tablets</li>
        <li>Pain that is worst at night and does not ease with a change of position</li>
        <li>Pain high in the back between the shoulder blades rather than in the lower back, a lump or a change in the shape of your back, or pain that is much worse when you cough, sneeze or strain</li>
        <li>Fever, unexplained weight loss, or a history of cancer or osteoporosis alongside the pain</li>
        <li>Pain that has not started to improve after a few weeks of this routine, or that is stopping you doing everyday things</li>
      </ul>
      <p>None of those? Then what follows is the standard advice for back pain from a sedentary life — the same things a physiotherapist
      would start you on. It is general guidance, not a diagnosis.</p>
    </div>
    ${CARE.map(routineHTML).join('')}
    <div class="care-guide">
      <h2>Set up your desk so it stops hurting you</h2>
      <div class="tw"><table>
        <tr><th>Part</th><th>Where it should be</th><th>Why</th></tr>
        <tr><td>Screen</td><td>Top edge at eye level, an arm's length away</td><td>A low laptop screen is the single biggest cause of the forward-head slump. Raise it on books and use a separate keyboard.</td></tr>
        <tr><td>Elbows</td><td>Bent about 90°, shoulders relaxed, wrists straight</td><td>Raised shoulders tighten the neck and upper back all day.</td></tr>
        <tr><td>Hips and knees</td><td>Hips slightly higher than knees, feet flat</td><td>Knees above hips tucks the pelvis under and rounds the lower back.</td></tr>
        <tr><td>Lower back</td><td>Sit back into the chair, small support in the curve</td><td>A rolled towel behind the lower back does the job of a costly chair.</td></tr>
        <tr><td>Phone</td><td>Lift it to eye level</td><td>Looking down at a phone loads the neck like a bowling ball hung forward.</td></tr>
      </table></div>
      <p>No setup is good for more than about 45 minutes. Standing all day is not the answer either — alternate. If you can, take calls
      standing or walking.</p>

      <h2>Daily habits that matter more than any single exercise</h2>
      <ul>
        <li><b>Walk 20–30 minutes a day</b> (7,000–8,000 steps is a good target). Walking is the gentlest of the well-proven back-pain treatments, and a regular walk roughly halves the chance of a flare coming back.</li>
        <li><b>Never sit longer than 45 minutes</b> without standing. Use the reminder above.</li>
        <li><b>Sleep on your side with a pillow between the knees</b>, or on your back with a pillow under the knees. Avoid sleeping on your stomach.</li>
        <li><b>Lift heavy or awkward things with a hip hinge</b>, the same move as the Romanian deadlift, load close to the body. Light things: bend however is comfortable; a back that bends is a normal back.</li>
        <li><b>Do the Spine Reset even on good days.</b> It takes 15 minutes; the pain took months to build.</li>
        <li>A warm shower before stretching makes the stiffest mornings much easier.</li>
      </ul>

      <h2>Should I still lift with a sore back?</h2>
      <p>Yes — strong glutes, hamstrings, and back muscles are the long-term cure, and stopping altogether makes most backs worse. Three rules:
      keep the spine in its natural curve on every rep, brace your abs before the weight moves, and stop any exercise where the pain
      is sharp or runs down a leg. Every exercise in the plan that loads the lower back now carries a <b>"Sore back?"</b> note with the
      specific adjustment. On a bad day, do the Spine Reset instead of the workout and come back tomorrow.</p>

      <h2>A stretch versus a warning sign</h2>
      <ul>
        <li><b>Fine:</b> a pulling, spreading feeling in a muscle; mild stiffness that eases as you move; soreness the next day from something new.</li>
        <li><b>Back off:</b> a pinch or sharp pain in one spot; anything that spreads down the leg; pain that is worse after a session than before it.</li>
      </ul>

      <h2>Read more — trusted sources</h2>
      <div class="reads">
        ${(CARE_READS||[]).map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} — ${esc(r.source)} ↗</a>`).join('')}
      </div>
      <p class="fine" style="font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:20px;padding-top:12px">
      General guidance for common, non-specific back pain linked to sitting. It is not a diagnosis or a substitute for seeing a doctor
      or physiotherapist — please do that if any red flag above applies, or if things are not improving.</p>
    </div>`;
  mountAnims(root);
  mountDone(root, dk, ()=>{
    CARE.forEach(r=>{ const el=root.querySelector(`[data-rdone="${r.id}"]`); if(!el) return;
      const n=r.ex.filter(id=>progress[dk]&&progress[dk][id]).length; el.textContent = n? `${n} of ${r.ex.length} done today` : ''; });
    renderToday();
  });
  mountCardExtras(root, dk);
  renderRemind();
}

/* ---------- stand-up reminder (laptop tab; a phone should use Spine Bell) ---------- */
let standNext=0, standInt=null;
function renderRemind(){
  const box=document.getElementById('remindbox'); if(!box) return;
  box.innerHTML=`<span class="lab">Remind me to stand every:</span>
    ${[0,30,45,60].map(m=>`<button class="rbtn" type="button" data-min="${m}" aria-pressed="${standEvery===m}">${m? m+' min':'Off'}</button>`).join('')}
    <span class="note">Chimes five times and shows a banner while this page is open in a laptop browser tab. On a phone use <a href="spine-bell.html">Spine Bell</a> instead: it keeps the screen awake, sends a banner, and can hand the timer to the Clock app.</span>`;
  box.querySelectorAll('.rbtn').forEach(b=>b.addEventListener('click', ()=>{ ensureAudio(); standStart(parseInt(b.getAttribute('data-min'),10)); }));
}
function standStart(min){ standEvery=min; persistStand(min); applyStand(min, true); renderRemind(); }
/* applyStand only runs the interval; it never writes, so a reload or a change from another device cannot re-save an old setting */
function applyStand(min, fresh){
  standEvery=min;
  clearInterval(standInt); standInt=null;
  document.title='Dumbbell Dojo';
  document.getElementById('standbanner').classList.remove('show');
  if(min>0){
    const saved=fresh? 0 : (+sGet('dd-standnext',0)||0);
    standNext = (!fresh && saved>Date.now()) ? saved : Date.now()+min*60000;
    sSet('dd-standnext', standNext);
    standInt=setInterval(standTick,1000);
  } else sSet('dd-standnext', 0);
  standTick();
}
function standTick(){
  const pill=document.getElementById('standpill'), banner=document.getElementById('standbanner');
  if(!standEvery){ pill.classList.remove('on'); return; }
  pill.classList.add('on');
  const left=standNext-Date.now();
  if(left<=0){
    if(!banner.classList.contains('show')){ banner.classList.add('show'); ringUntilTap(); document.title='⏰ Stand up — Dumbbell Dojo'; }
    pill.textContent='⏰ stand up';
  } else pill.textContent='stand in '+fmt(left);
}
document.getElementById('standpill').addEventListener('click', ()=>showView('care'));
document.getElementById('standdone').addEventListener('click', ()=>{
  stopRinging(); document.getElementById('standbanner').classList.remove('show'); document.title='Dumbbell Dojo';
  standNext=Date.now()+standEvery*60000; sSet('dd-standnext', standNext); standTick();
});
document.getElementById('standoff').addEventListener('click', ()=>{ stopRinging(); standStart(0); });

/* ---------- boot ---------- */
renderStrip(); renderToday(); renderWeek(); renderLibrary(); renderGuide(); renderCare(); showView('today');
if(standEvery) applyStand(standEvery, false);
resumeRest();
/* A tab left open past midnight must not write ticks to yesterday: re-render when the date changes. */
let bootDay=todayKey();
function dayRollover(){ const now=todayKey(); if(now===bootDay) return; bootDay=now; selectedDay=weekdayIdx(); renderStrip(); renderToday(); renderWeek(); renderCare(); }
setInterval(dayRollover, 60000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') dayRollover(); });
</script>
